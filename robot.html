<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>🤖 Robot Scraper · ZonaHack</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#07090e;--card:rgba(13,17,23,.92);--border:#1c2531;--text:#d7e2ef;--muted:#6d7f93;--accent:#2ee6a8;--violet:#7a5cff;--gold:#f1c40f}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;height:100vh;display:flex;flex-direction:column;overflow:hidden}
.bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.orb{position:absolute;border-radius:50%;filter:blur(90px);opacity:.3;animation:flotar 18s ease-in-out infinite}
.orb1{width:460px;height:460px;background:radial-gradient(circle,rgba(46,230,168,.18),transparent 70%);top:-170px;right:-120px}
.orb2{width:500px;height:500px;background:radial-gradient(circle,rgba(122,92,255,.18),transparent 70%);bottom:-200px;left:-160px;animation-delay:-7s}
@keyframes flotar{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(20px,-14px) scale(1.08)}}
.wrap{position:relative;z-index:1;flex:1;display:flex;flex-direction:column;min-height:0}
.header{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--border);background:rgba(7,9,14,.92);backdrop-filter:blur(10px)}
.logo{width:40px;height:40px;border-radius:12px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:20px;background:linear-gradient(135deg,rgba(46,230,168,.25),rgba(122,92,255,.25));border:1px solid rgba(46,230,168,.4)}
.ttl{flex:1;min-width:0}
.ttl h1{font-size:.95em;letter-spacing:2px;font-weight:900;font-family:'Courier New',monospace;color:#fff}
.ttl span{font-size:.6em;color:var(--muted)}
.back{color:var(--accent);text-decoration:none;font-size:.7em;padding:6px 10px;border:1px solid var(--border);border-radius:8px}
.sug{display:flex;gap:6px;padding:8px 14px;flex-wrap:wrap;border-bottom:1px solid var(--border);background:rgba(7,9,14,.5)}
.sug button{border:1px solid var(--border);border-radius:16px;background:var(--card);color:var(--muted);font-size:.62em;padding:6px 12px;cursor:pointer;font-family:inherit;transition:.12s}
.sug button:hover{border-color:var(--accent);color:var(--accent)}
.msgs{flex:1;overflow-y:auto;padding:16px 14px;display:flex;flex-direction:column;gap:10px;-webkit-overflow-scrolling:touch}
.msg{max-width:85%;padding:10px 14px;border-radius:14px;font-size:.8em;line-height:1.6;word-break:break-word;animation:fadeIn .25s;white-space:pre-wrap}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.msg.bot{align-self:flex-start;background:var(--card);border:1px solid var(--border);border-top-left-radius:4px}
.msg.user{align-self:flex-end;background:linear-gradient(135deg,rgba(46,230,168,.14),rgba(122,92,255,.14));border:1px solid rgba(46,230,168,.25);border-top-right-radius:4px}
.msg .who{font-size:.58em;font-weight:800;letter-spacing:.5px;margin-bottom:4px}
.msg.bot .who{color:var(--accent)}
.msg.user .who{color:var(--violet);text-align:right}
.msg .src{font-size:.6em;color:var(--muted);margin-top:6px;border-top:1px solid var(--border);padding-top:5px;word-break:break-all}
.msg .src a{color:var(--accent);text-decoration:none}
.input-bar{display:flex;gap:8px;padding:10px 14px;padding-bottom:calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--border);background:rgba(7,9,14,.95)}
.input-bar input{flex:1;background:var(--card);border:1px solid var(--border);border-radius:12px;color:var(--text);padding:12px 14px;font-size:.82em;outline:none;font-family:inherit}
.input-bar input:focus{border-color:var(--accent)}
.input-bar button{background:linear-gradient(135deg,#2ee6a8,#7a5cff);color:#03140a;border:none;border-radius:12px;padding:12px 18px;font-weight:800;font-size:.75em;cursor:pointer;font-family:inherit}
.typing{display:inline-block;width:8px;height:8px;background:var(--accent);border-radius:50%;margin-right:4px;animation:tp 1s infinite}
@keyframes tp{0%,100%{opacity:.2}50%{opacity:1}}
</style>
</head>
<body>
<div class="bg"><div class="orb orb1"></div><div class="orb orb2"></div></div>

<div class="wrap">
  <div class="header">
    <div class="logo">🤖</div>
    <div class="ttl"><h1>ROBOT SCRAPER</h1><span>automático · sin link · sin APIs</span></div>
    <a href="/" class="back">←</a>
  </div>

  <div class="sug" id="sug">
    <button onclick="auto('Qué es python')">🐍 ¿Qué es Python?</button>
    <button onclick="auto('Quién fue Napoleón')">🎖 Napoleón</button>
    <button onclick="auto('Qué es el agujero negro')">🕳 Agujero negro</button>
    <button onclick="auto('Historia de Argentina')">🇦🇷 Argentina</button>
    <button onclick="auto('Qué es la fotosíntesis')">🌿 Fotosíntesis</button>
    <span style="flex:1"></span>
    <button onclick="abrirLink()" id="btnLink" style="border-color:rgba(241,196,15,.3);color:var(--gold)">🔗 Pegar URL</button>
  </div>

  <div id="linkBar" style="display:none;padding:8px 14px;border-bottom:1px solid var(--border);background:rgba(7,9,14,.5)">
    <div style="display:flex;gap:8px">
      <input id="urlInp" placeholder="https://..." onkeydown="if(event.key==='Enter')leerLink()" style="flex:1;background:var(--card);border:1px solid var(--border);border-radius:10px;color:var(--text);padding:10px 12px;font-size:.78em;outline:none;font-family:inherit">
      <button onclick="leerLink()" style="background:rgba(241,196,15,.15);border:1px solid rgba(241,196,15,.3);color:var(--gold);border-radius:10px;padding:10px 14px;font-weight:800;font-size:.7em;cursor:pointer;font-family:inherit">LEER</button>
    </div>
  </div>

  <div class="sug" id="lenBar">
    <span style="font-size:.6em;color:var(--muted);display:flex;align-items:center">📏 Resumen:</span>
    <button onclick="setLen('corto',this)" data-l="corto">Corto</button>
    <button onclick="setLen('medio',this)" class="on" data-l="medio">Medio</button>
    <button onclick="setLen('largo',this)" data-l="largo">Largo</button>
  </div>

  <div class="msgs" id="msgs">
    <div class="msg bot"><div class="who">🤖 ROBOT</div>¡Hola! Soy tu robot automático: escribí cualquier pregunta y yo <b>busco solo</b>, leo la página y te respondo con su contenido. Sin pegar links y sin APIs.</div>
  </div>

  <div class="input-bar">
    <input id="qInp" placeholder="Preguntame lo que quieras..." onkeydown="if(event.key==='Enter')preguntar()">
    <button onclick="preguntar()">PREGUNTAR</button>
  </div>
</div>

<script>
function $(id){return document.getElementById(id);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function addHTML(html,quien){
  var box=$("msgs");
  var d=document.createElement("div");
  d.className="msg "+(quien==='user'?'user':'bot');
  d.innerHTML='<div class="who">'+(quien==='user'?'🧑 TÚ':'🤖 ROBOT')+'</div>'+html;
  box.appendChild(d);
  box.scrollTop=box.scrollHeight;
  return d;
}
function add(msg,quien,fuente){
  var html=esc(msg)+(fuente?'<div class="src">📎 Fuente: <a href="'+esc(fuente)+'" target="_blank" rel="noopener">'+esc(fuente)+'</a></div>':'');
  addHTML(html,quien);
}

function preguntar(){
  var q=$("qInp").value.trim();
  if(!q)return;
  $("qInp").value="";
  auto(q);
}

// ─── LARGO DEL RESUMEN ───
var LEN="medio", LENN={"corto":2,"medio":4,"largo":7};
function setLen(l,btn){
  LEN=l;
  document.querySelectorAll("#lenBar button").forEach(function(b){b.classList.remove("on");});
  btn.classList.add("on");
}

// ─── MODO LINK (opcional) ───
function abrirLink(){
  var bar=$("linkBar");
  bar.style.display=bar.style.display==="none"?"block":"none";
  if(bar.style.display==="block")$("urlInp").focus();
}
function leerLink(){
  var u=$("urlInp").value.trim();
  if(!u)return;
  addHTML(esc("🔗 Leyendo: "+u),'user');
  $("urlInp").value="";
  ocupado=true;
  var d=addHTML('<span class="typing"></span> Leyendo la página...','bot');
  fetch("/api/scrape?url="+encodeURIComponent(u))
  .then(function(r){return r.json();}).then(function(res){
    d.remove();
    if(res&&res.ok){
      var resp=responder("resumen de la página", res.texto||"", res.titulo||u, res.url||u);
      addHTML(resp,'bot');
    }else{
      add("😢 No pude leer esa página: "+(res&&res.error||'error'),'bot');
    }
  }).catch(function(){ d.remove(); add("😢 Error de conexión.",'bot'); })
  .then(function(){ ocupado=false; });
}

var ocupado=false;
function auto(q){
  if(ocupado)return;
  addHTML(esc(q),'user');
  ocupado=true;
  var d=addHTML('<span class="typing"></span><span class="typing"></span><span class="typing"></span> Buscando y leyendo...','bot');
  fetch("/api/auto?q="+encodeURIComponent(q))
  .then(function(r){return r.json();}).then(function(res){
    d.remove();
    if(res&&res.ok){
      // responder con frases relevantes del texto
      var resp=responder(q, res.texto||"", res.titulo||res.fuente, res.fuente);
      // videos relacionados
      if(res.videos&&res.videos.length){
        resp+='<div class="src">🎬 Videos relacionados:</div>';
        resp+=res.videos.map(function(v){
          return '<div class="src" style="border-top:none;padding-top:2px">▶ <a href="https://www.youtube.com/watch?v='+esc(v.id)+'" target="_blank" rel="noopener">'+esc(v.title)+'</a></div>';
        }).join('');
      }
      addHTML(resp,'bot');
    }else{
      var msg="😢 No encontré información automática para: \""+q+"\".\nProbá reformular la pregunta.";
      if(res&&res.videos&&res.videos.length){
        msg+='\n\n🎬 Pero encontré videos relacionados:';
        msg+=res.videos.map(function(v){
          return '\n▶ <a href="https://www.youtube.com/watch?v='+esc(v.id)+'" target="_blank" rel="noopener">'+esc(v.title)+'</a>';
        }).join('');
      }
      addHTML(msg,'bot');
    }
  }).catch(function(){
    d.remove();
    add("😢 Error de conexión. Intentá de nuevo.",'bot');
  }).then(function(){ ocupado=false; });
}

// ─── RESPONDER SIN API: extracción de frases relevantes ───
var STOP=["de","la","el","los","las","un","una","unos","unas","que","y","o","a","en","con","por","para","se","su","sus","es","son","está","estan","del","al","lo","le","me","te","nos","pero","más","mas","como","cuando","donde","qué","que","cual","cuales","quien","quienes","mi","tu","this","and","the","of","to","in","on","is","are","fue","era","son","han","ha","habia"];
function palabras(s){
  return (s||"").toLowerCase().replace(/[^a-záéíóúñü0-9]/g," ").split(/\s+/).filter(function(w){return w.length>2 && STOP.indexOf(w)<0;});
}
function frases(t){
  return (t||"").split(/(?<=[.!?])\s+|\n/).map(function(f){return f.trim();}).filter(function(f){return f.length>30 && f.length<400;});
}
function responder(q,texto,titulo,fuente){
  var ql=q.toLowerCase();
  var fs=frases(texto);
  if(!fs.length) return "Leí la página pero no encontré texto para resumir. Fuente: "+(titulo||fuente);
  var qw=palabras(q);
  // puntuar frases por coincidencia con la pregunta
  var scored=fs.map(function(f){
    var fw=palabras(f);
    return {f:f,score:fw.filter(function(w){return qw.indexOf(w)>=0;}).length};
  });
  var relevantes=scored.filter(function(s){return s.score>0;}).sort(function(a,b){return b.score-a.score;}).map(function(s){return s.f;});
  var base = relevantes.length ? relevantes : fs.slice(0,5);
  // armar un resumen en TEXTO (oraciones unidas, coherente)
  var partes=[];
  if(fs[0] && base.indexOf(fs[0])<0) partes.push(fs[0]);   // definición inicial
  base.slice(0,LENN[LEN]||4).forEach(function(f){ if(partes.indexOf(f)<0) partes.push(f); });
  var resumen=partes.join(" ");
  return "📝 <b>"+esc(titulo)+"</b> — resumen"+(LEN==='corto'?' (breve)':LEN==='largo'?' (extendido)':'')+":\n\n"+esc(resumen)+fuenteHtml(fuente);
}
function fuenteHtml(fuente){
  return '<div class="src">📎 Fuente: <a href="'+esc(fuente)+'" target="_blank" rel="noopener">'+esc(fuente)+'</a></div>';
}
</script>
<script src="/logger_zh.js?v=2026"></script>
</body>
</html>
