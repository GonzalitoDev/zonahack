<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>🍟 Alejo y Valentina — ZonaHack</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0a;color:#c8d6e5;font-family:'Courier New',monospace;min-height:100vh}
.header{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid rgba(0,255,65,.08);background:#050505;position:sticky;top:0;z-index:100}
.header h1{color:#ffd700;font-size:.85em;letter-spacing:1px;text-shadow:0 0 10px rgba(255,215,0,.15)}
.back{color:#ffd700;text-decoration:none;font-size:.65em;padding:4px 8px;border:1px solid rgba(255,255,255,.1);border-radius:3px}
.container{max-width:760px;margin:0 auto;padding:12px}
.status{text-align:center;font-size:.62em;color:rgba(255,255,255,.35);margin:6px 0;min-height:16px}
#player{display:none;margin-bottom:12px}
#player.active{display:block}
#player iframe{width:100%;aspect-ratio:16/9;border:none;border-radius:8px;background:#000}
.player-title{font-size:.75em;color:#ffd700;margin:6px 2px 2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.actions{display:flex;gap:6px;margin:8px 0;flex-wrap:wrap}
.actions button{padding:7px 14px;border:1px solid rgba(255,215,0,.25);border-radius:8px;background:rgba(255,215,0,.05);color:#ffd700;font-size:.7em;cursor:pointer;font-family:'Courier New',monospace;transition:.2s}
.actions button:hover{border-color:#ffd700;box-shadow:0 0 12px rgba(255,215,0,.15)}
.actions button:disabled{opacity:.4}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.card{background:#0d0f0d;border:1px solid rgba(255,215,0,.1);border-radius:8px;overflow:hidden;cursor:pointer;transition:.2s}
.card:hover{border-color:#ffd700;box-shadow:0 0 14px rgba(255,215,0,.12);transform:translateY(-2px)}
.card img{width:100%;aspect-ratio:16/9;object-fit:cover;background:#111;display:block}
.card .t{font-size:.7em;padding:6px 8px;color:#ddd;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.empty{text-align:center;color:rgba(255,255,255,.15);padding:40px;font-size:.8em}
.spin{width:22px;height:22px;border:2px solid rgba(255,215,0,.15);border-top-color:#ffd700;border-radius:50%;animation:spin .7s linear infinite;margin:10px auto}
@keyframes spin{to{transform:rotate(360deg)}}
.hero{text-align:center;padding:14px;border:1px solid rgba(255,215,0,.12);border-radius:10px;background:rgba(255,215,0,.03);margin-bottom:10px}
.hero .big{font-size:2.2em}
.hero h2{color:#ffd700;font-size:.95em;margin-top:6px}
.hero p{font-size:.65em;color:rgba(255,255,255,.4);margin-top:4px}
</style>
</head>
<body>
<div class="header">
  <a href="/" class="back">←</a>
  <h1>🍟 ALEJO Y VALENTINA</h1>
  <a href="/" class="back">Volver</a>
</div>
<div class="container">
  <div class="hero">
    <div class="big">🍟</div>
    <h2>Los capítulos completos</h2>
    <p>La serie animada argentina: Karate Gil, Carlitox, Ladry Potter, El Topo Chicho y más. Directo desde el canal oficial.</p>
  </div>

  <div id="player">
    <iframe id="playerFrame" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>
    <div class="player-title" id="playerTitle"></div>
    <div class="actions">
      <button onclick="abrirYouTube()">▶ YouTube</button>
      <button onclick="invidious(0)">🟢 Invidious</button>
      <button onclick="invidious(1)">⏭ Otro servidor</button>
    </div>
  </div>

  <div class="actions">
    <button onclick="scrapearMas()" id="btnScrap">➕ Buscar más capítulos</button>
    <button onclick="cargar()">🔄 Actualizar</button>
  </div>
  <div class="status" id="status">Cargando capítulos...</div>
  <div class="grid" id="grid"></div>
</div>

<script>
var SB="https://xfwolaurpeofysnymqle.supabase.co/rest/v1";
var KEY="sb_publishable_3VvBUD5Bdu3Uaq59fJ99MQ_XDCtujUU";
var H={"apikey":KEY,"Authorization":"Bearer "+KEY};
function esc(s){return (s||"").replace(/[&<>"]/g,function(m){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m];});}

function cargar(){
  document.getElementById("grid").innerHTML='<div class="spin"></div>';
  fetch(SB+"/videos?select=titulo,url,thumbnail&categoria=eq.Alejo%20y%20Valentina&order=created_at.desc&limit=100",{headers:H})
  .then(function(r){return r.json();})
  .then(function(d){
    var arr=(d||[]).filter(function(v){return v.url;});
    document.getElementById("status").textContent=arr.length+" capítulos";
    if(!arr.length){document.getElementById("grid").innerHTML='<div class="empty">No hay capítulos todavía.<br>Tocá "Buscar más capítulos" para traerlos.</div>';return;}
    document.getElementById("grid").innerHTML=arr.map(function(v){
      return '<div class="card" onclick="reproducir(\''+esc(v.url)+'\',\''+esc(v.titulo)+'\')">'+
        (v.thumbnail?'<img src="'+esc(v.thumbnail)+'" loading="lazy">':'<div style="aspect-ratio:16/9;background:#111;display:flex;align-items:center;justify-content:center;font-size:1.6em">🍟</div>')+
        '<div class="t">'+esc(v.titulo)+'</div></div>';
    }).join("");
  })
  .catch(function(){document.getElementById("grid").innerHTML='<div class="empty">Error al cargar</div>';});
}

function reproducir(url,titulo){
  _vid=url;
  var p=document.getElementById("player");
  p.classList.add("active");
  document.getElementById("playerFrame").src="https://www.youtube-nocookie.com/embed/"+encodeURIComponent(url)+"?autoplay=1&rel=0&modestbranding=1";
  document.getElementById("playerTitle").textContent="▶ "+(titulo||"Alejo y Valentina");
  document.getElementById("player").scrollIntoView({behavior:"smooth",block:"start"});
}

var _vid="";
var _invIdx=0;
var _invServidores=["inv.nadeko.net","yewtu.be","invidious.nerdvpn.de","inv.vern.cc","invidious.flokinet.to","invidious.f5.si","invidious.protokolla.fi","invidious.darkness.services"];
function invidious(siguiente){
  if(!_vid){return;}
  if(siguiente){_invIdx=(_invIdx+1)%_invServidores.length;}
  var host=_invServidores[_invIdx];
  document.getElementById("playerFrame").src="https://"+host+"/embed/"+encodeURIComponent(_vid)+"?autoplay=1";
  document.getElementById("playerTitle").textContent="🟢 Invidious ("+host+") · "+(document.getElementById("playerTitle").textContent.replace(/^[^ ]+ /,""));
  document.getElementById("player").scrollIntoView({behavior:"smooth",block:"start"});
}
function abrirYouTube(){
  if(!_vid){return;}
  window.open("https://www.youtube.com/watch?v="+_vid,"_blank");
}

function scrapearMas(){
  var b=document.getElementById("btnScrap");
  b.disabled=true;b.textContent="Buscando...";
  document.getElementById("status").textContent="Buscando capítulos en YouTube...";
  fetch("/api/search_multi?q="+encodeURIComponent("Alejo y Valentina capitulo completo")+"&guardar=1")
  .then(function(r){return r.json();})
  .then(function(d){
    var g=(d&&d.guardadas)||0;
    document.getElementById("status").textContent="✅ "+g+" capítulos nuevos agregados";
    b.disabled=false;b.textContent="➕ Buscar más capítulos";
    cargar();
  })
  .catch(function(){
    document.getElementById("status").textContent="Error al buscar";
    b.disabled=false;b.textContent="➕ Buscar más capítulos";
  });
}

cargar();
</script>
</body>
</html>
