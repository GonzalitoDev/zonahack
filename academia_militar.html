// ─── PROGRESO POR LECCION ───
var LS_CURSOS="vh_militar_prog";
function getPC(){try{return JSON.parse(localStorage.getItem(LS_CURSOS)||"{}");}catch(e){return{};}}
function setPC(p){try{localStorage.setItem(LS_CURSOS,JSON.stringify(p));}catch(e){}}
function progLeccion(cursoId,leccionId){
  var p=getPC();
  return (p[cursoId]&&p[cursoId].lecciones&&p[cursoId].lecciones[leccionId])||0;
}
function guardarLeccion(cursoId,leccionId,pct){
  var p=getPC();
  if(!p[cursoId]) p[cursoId]={lecciones:{},ultima:null,ts:0};
  var actual=p[cursoId].lecciones[leccionId]||0;
  var nuevo=Math.max(actual,Math.min(pct||0,99));
  p[cursoId].lecciones[leccionId]=nuevo;
  p[cursoId].ultima=leccionId;
  p[cursoId].ts=Date.now();
  setPC(p);
  if(actual<90&&nuevo>=90){
    sumarXP(5,"Lección completada");
    verificarInsigniaCurso(cursoId);
  }
}
function statsCurso(curso){
  var p=getPC()[curso.id];
  var lecc=(p&&p.lecciones)||{};
  var total=curso.lecciones.length;
  var completadas=curso.lecciones.filter(function(l){return (lecc[l.id]||0)>=90;}).length;
  var pct=total?Math.round(completadas/total*100):0;
  return {completadas:completadas,total:total,pct:pct};
}

// ─── GAMIFICACION: XP y niveles (mismo sistema que el resto de ZonaHack) ───
function notificarXP(cant,accion){
  var noti=document.createElement("div");
  noti.style.cssText="position:fixed;top:60px;right:20px;z-index:99999;padding:8px 14px;border:1px solid rgba(0,255,65,.12);border-radius:8px;background:#0d0d0d;color:#00ff41;font-size:.75em;font-family:'Courier New',monospace;box-shadow:0 4px 20px rgba(0,0,0,.4);transition:all .4s;opacity:0;transform:translateX(40px)";
  noti.innerHTML="⭐ +"+cant+" XP <span style='color:rgba(200,214,229,.4);font-size:.9em'>"+esc(accion)+"</span>";
  document.body.appendChild(noti);
  setTimeout(function(){noti.style.opacity="1";noti.style.transform="translateX(0)";},50);
  setTimeout(function(){noti.style.opacity="0";noti.style.transform="translateX(40px)";setTimeout(function(){if(noti.parentNode)noti.parentNode.removeChild(noti);},400);},2200);
}
function notificarNivel(nv){
  var el=document.createElement("div");
  el.style.cssText="position:fixed;top:100px;right:20px;z-index:99999;padding:12px 18px;border:1px solid rgba(241,196,15,.2);border-radius:8px;background:#0d0d0d;color:#f1c40f;font-size:.9em;font-family:'Courier New',monospace;box-shadow:0 4px 20px rgba(0,0,0,.4);transition:all .4s;opacity:0;transform:translateX(40px)";
  el.innerHTML="🎉 SUBISTE AL NIVEL "+nv+"!";
  document.body.appendChild(el);
  setTimeout(function(){el.style.opacity="1";el.style.transform="translateX(0)";},50);
  setTimeout(function(){el.style.opacity="0";el.style.transform="translateX(40px)";setTimeout(function(){if(el.parentNode)el.parentNode.removeChild(el);},400);},3000);
}
var _xpQueue=Promise.resolve();
function sumarXP(cant,accion){
  var user=localStorage.getItem('vh_usuario')||'';
  if(!user||user==='anon')return;
  notificarXP(cant,accion);
  _xpQueue=_xpQueue.then(function(){
    return fetch('https://xfwolaurpeofysnymqle.supabase.co/rest/v1/usuarios_ext?usuario_nombre=eq.'+encodeURIComponent(user)+'&limit=1',{
      headers:{'apikey':'sb_publishable_3VvBUD5Bdu3Uaq59fJ99MQ_XDCtujUU','Authorization':'Bearer sb_publishable_3VvBUD5Bdu3Uaq59fJ99MQ_XDCtujUU'}
    }).then(function(r){return r.json();}).then(function(d){
      var xp=cant,nv=1;
      if(d&&d.length){
        xp=(d[0].xp||0)+cant;
        nv=Math.min(15,Math.max(1,Math.floor(xp/100)+1));
        if(nv>(d[0].nivel||1)) notificarNivel(nv);
        return fetch('https://xfwolaurpeofysnymqle.supabase.co/rest/v1/usuarios_ext?usuario_nombre=eq.'+encodeURIComponent(user),{method:'PATCH',headers:{'apikey':'sb_publishable_3VvBUD5Bdu3Uaq59fJ99MQ_XDCtujUU','Authorization':'Bearer sb_publishable_3VvBUD5Bdu3Uaq59fJ99MQ_XDCtujUU','Content-Type':'application/json'},body:JSON.stringify({xp:xp,nivel:nv})}).catch(function(){});
      }else{
        return fetch('https://xfwolaurpeofysnymqle.supabase.co/rest/v1/usuarios_ext',{method:'POST',headers:{'apikey':'sb_publishable_3VvBUD5Bdu3Uaq59fJ99MQ_XDCtujUU','Authorization':'Bearer sb_publishable_3VvBUD5Bdu3Uaq59fJ99MQ_XDCtujUU','Content-Type':'application/json','Prefer':'return=minimal'},body:JSON.stringify({usuario_nombre:user,xp:cant,nivel:nv,rol:'user',estado:'activo'})}).catch(function(){});
      }
    }).catch(function(){});
  });
}

// ─── INSIGNIAS ───
var INSIGNIAS_CURSO={
  historia:{nombre:"🎖️ Historiador Militar",color:"#c9a227",desc:"Completó el curso de Historia Militar en ZonaHack"},
  supervivencia:{nombre:"🏕️ Superviviente",color:"#2ecc71",desc:"Completó el curso de Supervivencia Básica en ZonaHack"},
  vida:{nombre:"🫡 Disciplina de Hierro",color:"#00c8ff",desc:"Completó el curso de Vida y Disciplina Militar en ZonaHack"}
};
function getInsigniasGanadas(){ try{return JSON.parse(localStorage.getItem("vh_insignias_militar")||"{}");}catch(e){return {};} }
function mostrarInsigniaGanada(def){
  var el=document.createElement("div");
  el.style.cssText="position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(.85);z-index:999999;background:#0d0d0d;border:2px solid "+def.color+";border-radius:14px;padding:26px 32px;text-align:center;box-shadow:0 10px 50px rgba(0,0,0,.6);font-family:'Courier New',monospace;opacity:0;transition:all .4s;max-width:88vw";
  el.innerHTML="<div style='font-size:2.6em;margin-bottom:8px'>"+def.nombre.split(' ')[0]+"</div>"+
    "<div style='color:#fff;font-size:1em;font-weight:bold;margin-bottom:4px'>¡Insignia desbloqueada!</div>"+
    "<div style='color:"+def.color+";font-size:.9em;font-weight:bold'>"+esc(def.nombre)+"</div>"+
    "<div style='color:rgba(255,255,255,.4);font-size:.65em;margin-top:8px;max-width:260px'>"+esc(def.desc)+"</div>";
  document.body.appendChild(el);
  requestAnimationFrame(function(){el.style.opacity="1";el.style.transform="translate(-50%,-50%) scale(1)";});
  setTimeout(function(){
    el.style.opacity="0";el.style.transform="translate(-50%,-50%) scale(.9)";
    setTimeout(function(){if(el.parentNode)el.parentNode.removeChild(el);},400);
  },3200);
}
function verificarInsigniaCurso(cursoId){
  var curso=CURSOS.filter(function(c){return c.id===cursoId;})[0];
  var def=INSIGNIAS_CURSO[cursoId];
  if(!curso||!def)return;
  var s=statsCurso(curso);
  if(s.total===0||s.completadas<s.total)return;
  var ya=getInsigniasGanadas();
  if(ya[cursoId])return;
  ya[cursoId]=true;
  localStorage.setItem("vh_insignias_militar",JSON.stringify(ya));
  mostrarInsigniaGanada(def);
  sumarXP(25,"Curso completo: "+curso.titulo);
  renderBadgesRow();
  var user=localStorage.getItem('vh_usuario')||'';
  if(user&&user!=='anon'){
    fetch('https://xfwolaurpeofysnymqle.supabase.co/rest/v1/insignias',{method:'POST',headers:{'apikey':'sb_publishable_3VvBUD5Bdu3Uaq59fJ99MQ_XDCtujUU','Authorization':'Bearer sb_publishable_3VvBUD5Bdu3Uaq59fJ99MQ_XDCtujUU','Content-Type':'application/json','Prefer':'return=minimal,resolution=ignore-duplicates'},body:JSON.stringify({usuario_nombre:user,insignia:def.nombre,color:def.color,descripcion:def.desc})}).catch(function(){});
  }
}
function renderBadgesRow(){
  var ya=getInsigniasGanadas();
  var ids=Object.keys(ya).filter(function(id){return ya[id]&&INSIGNIAS_CURSO[id];});
  var row=document.getElementById("badgesRow"),list=document.getElementById("badgesList");
  if(!row||!list)return;
  if(!ids.length){row.style.display="none";return;}
  row.style.display="block";
  list.innerHTML=ids.map(function(id){
    var def=INSIGNIAS_CURSO[id];
    return '<div class="badge-chip" style="border:1px solid '+def.color+'55;color:'+def.color+'" title="'+esc(def.desc)+'">'+
      '<span>'+def.nombre.split(' ')[0]+'</span>'+esc(def.nombre.split(' ').slice(1).join(' '))+'</div>';
  }).join("");
}

// ─── CURSOS Y LECCIONES ───
function renderCursosGrid(){
  document.getElementById("cursosGrid").innerHTML=CURSOS.map(function(c){
    var s=statsCurso(c),done=s.total>0&&s.completadas===s.total;
    var mejor=getQuizGuardado()[c.id];
    return '<div class="curso-card'+(done?' done':'')+'" onclick="abrirCurso(\''+c.id+'\')">'+
      '<div class="curso-ico">'+c.icono+'</div>'+
      '<div class="curso-t">'+esc(c.titulo)+'</div>'+
      '<div class="barbg"><div class="bar" style="width:'+s.pct+'%"></div></div>'+
      '<div class="curso-sub">'+(done?'✅ Completado':s.completadas+' / '+s.total+' lecciones')+'</div>'+
      (mejor?'<div class="curso-sub">📝 Quiz: '+mejor.correctas+'/'+mejor.total+'</div>':'')+
    '</div>';
  }).join("");
  document.getElementById("st").textContent=CURSOS.length+" cursos disponibles";
  renderBadgesRow();
}

var cursoActual=null, leccionActualIdx=null, progIntCurso=null;

window.abrirCurso=function(cursoId){
  cursoActual=CURSOS.filter(function(c){return c.id===cursoId;})[0];
  if(!cursoActual)return;
  document.getElementById("vistaCursos").style.display="none";
  document.getElementById("vistaLecciones").style.display="block";
  pintarLecciones();
  pintarQuiz();
};
window.volverACursos=function(){
  document.getElementById("vistaLecciones").style.display="none";
  document.getElementById("vistaCursos").style.display="block";
  cursoActual=null;
  renderCursosGrid();
};
function pintarLecciones(){
  var s=statsCurso(cursoActual);
  document.getElementById("cursoHdr").innerHTML=
    '<div class="curso-hdr-ico">'+cursoActual.icono+'</div>'+
    '<div style="flex:1"><div class="curso-hdr-t">'+esc(cursoActual.titulo)+'</div>'+
    '<div class="curso-hdr-sub">'+s.completadas+' de '+s.total+' lecciones completadas ('+s.pct+'%)</div>'+
    '<div class="barbg" style="margin-top:5px"><div class="bar" style="width:'+s.pct+'%"></div></div></div>';
  document.getElementById("leccionesGrid").innerHTML=cursoActual.lecciones.map(function(l,i){
    var pct=progLeccion(cursoActual.id,l.id),done=pct>=90;
    return '<div class="leccion-item'+(done?' done':'')+'" onclick="abrirLeccion('+i+')">'+
      '<div class="leccion-num">'+(done?'✅':(i+1))+'</div>'+
      '<img src="'+esc(l.thumb)+'" loading="lazy">'+
      '<div class="leccion-inf"><div class="leccion-t">'+esc(l.titulo)+'</div>'+
      (pct>3&&!done?'<div class="barbg" style="margin-top:4px"><div class="bar" style="width:'+pct+'%"></div></div>':'')+
      '</div></div>';
  }).join("");
}

// ─── CONTROL DEL VIDEO (YouTube IFrame API) ───
var _ytReady=false,_ytPlayer=null,_ytPendingLoad=null;
(function(){
  var tag=document.createElement("script");
  tag.src="https://www.youtube.com/iframe_api";
  document.head.appendChild(tag);
})();
window.onYouTubeIframeAPIReady=function(){
  _ytReady=true;
  if(_ytPendingLoad){cargarVideoEnPlayer(_ytPendingLoad.id,_ytPendingLoad.start);_ytPendingLoad=null;}
};
function cargarVideoEnPlayer(videoId,startSeconds){
  if(!_ytReady){_ytPendingLoad={id:videoId,start:startSeconds};return;}
  if(_ytPlayer&&_ytPlayer.loadVideoById){
    _ytPlayer.loadVideoById({videoId:videoId,startSeconds:startSeconds||0});
    return;
  }
  _ytPlayer=new YT.Player("playerIframe",{
    videoId:videoId,
    width:"100%",
    height:"100%",
    playerVars:{autoplay:1,rel:0,start:startSeconds||0,modestbranding:1}
  });
}
window.repetirUltimos=function(){
  if(!_ytPlayer||!_ytPlayer.getCurrentTime||!_ytPlayer.seekTo)return;
  try{
    var t=_ytPlayer.getCurrentTime();
    _ytPlayer.seekTo(Math.max(0,t-15),true);
    _ytPlayer.playVideo();
  }catch(e){}
};

window.abrirLeccion=function(idx){
  leccionActualIdx=idx;
  var l=cursoActual.lecciones[idx];
  var pr=progLeccion(cursoActual.id,l.id);
  document.getElementById("playerTitle").textContent=l.titulo;
  cargarVideoEnPlayer(l.id,(pr>3&&pr<95)?Math.round(pr/100*600):0);
  document.getElementById("playerModal").classList.add("show");
  guardarLeccion(cursoActual.id,l.id,Math.max(pr,2));
  if(progIntCurso)clearInterval(progIntCurso);
  progIntCurso=setInterval(function(){
    if(!document.getElementById("playerModal").classList.contains("show"))return;
    var nuevo=null;
    if(_ytPlayer&&_ytPlayer.getCurrentTime&&_ytPlayer.getDuration){
      try{
        var cur=_ytPlayer.getCurrentTime(),dur=_ytPlayer.getDuration();
        if(dur>0)nuevo=Math.min(95,Math.round(cur/dur*100));
      }catch(e){}
    }
    if(nuevo==null)nuevo=Math.min(progLeccion(cursoActual.id,l.id)+1,90);
    guardarLeccion(cursoActual.id,l.id,nuevo);
  },5000);
};
window.marcarCompletada=function(){
  if(!cursoActual||leccionActualIdx===null)return;
  var l=cursoActual.lecciones[leccionActualIdx];
  guardarLeccion(cursoActual.id,l.id,99);
  pintarLecciones();
};
window.cerrarPlayer=function(){
  if(_ytPlayer&&_ytPlayer.stopVideo){try{_ytPlayer.stopVideo();}catch(e){}}
  document.getElementById("playerModal").classList.remove("show");
  if(progIntCurso){clearInterval(progIntCurso);progIntCurso=null;}
  leccionActualIdx=null;
  if(cursoActual)pintarLecciones();
};

// ─── QUIZ ───
function getQuizGuardado(){ try{return JSON.parse(localStorage.getItem("vh_militar_quiz")||"{}");}catch(e){return {};} }
function guardarQuizResultado(cursoId,correctas,total){
  var q=getQuizGuardado();
  var prev=q[cursoId];
  if(!prev||correctas>prev.correctas){
    q[cursoId]={correctas:correctas,total:total,ts:Date.now()};
    localStorage.setItem("vh_militar_quiz",JSON.stringify(q));
  }
}
function pintarQuiz(){
  var preguntas=QUIZZES[cursoActual.id]||[];
  var sec=document.getElementById("quizSection");
  if(!preguntas.length){ sec.innerHTML=""; return; }
  var mejor=getQuizGuardado()[cursoActual.id];
  var h='<div class="quiz-box"><div class="quiz-hdr">📝 Quiz del curso'+(mejor?' — mejor puntaje: '+mejor.correctas+'/'+mejor.total:'')+'</div>';
  preguntas.forEach(function(p,i){
    h+='<div class="quiz-q" data-qi="'+i+'"><div class="quiz-qtxt">'+(i+1)+'. '+esc(p.q)+'</div>';
    p.opciones.forEach(function(op,oi){
      h+='<label class="quiz-opt"><input type="radio" name="quiz-'+i+'" value="'+oi+'"> '+esc(op)+'</label>';
    });
    h+='</div>';
  });
  h+='<button class="quiz-btn" onclick="corregirQuiz()">✅ Corregir</button><div id="quizResultado"></div></div>';
  sec.innerHTML=h;
}
window.corregirQuiz=function(){
  var preguntas=QUIZZES[cursoActual.id]||[];
  var correctas=0;
  preguntas.forEach(function(p,i){
    var seleccionado=document.querySelector('input[name="quiz-'+i+'"]:checked');
    var labels=document.querySelectorAll('.quiz-q[data-qi="'+i+'"] .quiz-opt');
    labels.forEach(function(lbl,oi){
      lbl.classList.remove("correcta","incorrecta");
      if(oi===p.correcta) lbl.classList.add("correcta");
      else if(seleccionado&&parseInt(seleccionado.value,10)===oi) lbl.classList.add("incorrecta");
    });
    if(seleccionado&&parseInt(seleccionado.value,10)===p.correcta) correctas++;
  });
  var prevMejor=getQuizGuardado()[cursoActual.id];
  var esMejora=!prevMejor||correctas>prevMejor.correctas;
  guardarQuizResultado(cursoActual.id,correctas,preguntas.length);
  var res=document.getElementById("quizResultado");
  var pct=Math.round(correctas/preguntas.length*100);
  res.className="quiz-score "+(pct>=60?"bien":"mal");
  res.textContent="Resultado: "+correctas+"/"+preguntas.length+" ("+pct+"%)"+(pct>=60?" — ¡bien! 🎉":" — repasá la lección y probá de nuevo");
  if(esMejora&&correctas>0) sumarXP(correctas*2,"Quiz de "+cursoActual.titulo);
};

renderCursosGrid();
