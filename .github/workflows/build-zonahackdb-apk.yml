name: Compilar APK ZonaHack DB

# Compila la APK del visor de Base de Datos y la publica automáticamente
# en la web (raíz del repo → /ZonaHackDB.apk en Vercel).
# Se dispara al subir cambios en ZonaHackDBApp, o con el botón "Run workflow".

on:
  workflow_dispatch:
  push:
    paths:
      - "ZonaHackDBApp/**"

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el proyecto
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"

      - name: Descargar Gradle
        run: |
          curl -sL "https://services.gradle.org/distributions/gradle-8.5-bin.zip" -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.5/bin" >> $GITHUB_PATH

      - name: Compilar APK (debug = instalable)
        working-directory: ZonaHackDBApp
        run: gradle assembleDebug --no-daemon

      - name: Subir el APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: ZonaHackDB-APK
          path: |
            ZonaHackDBApp/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Publicar APK en la web (auto)
        run: |
          cp ZonaHackDBApp/app/build/outputs/apk/debug/*.apk ZonaHackDB.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ZonaHackDB.apk
          if git diff --cached --quiet; then
            echo "APK sin cambios, no se sube de nuevo"
          else
            git commit -m "auto: APK ZonaHackDB"
            git push
            echo "APK publicado en la web"
          fi