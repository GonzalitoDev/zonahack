<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>JUEGA O MUERE</title>
<style>
:root{--fondo:#070303;--rojo:#ff2d3d;--rojo2:#8a0f18;--tenue:#5a2a2e;--hueso:#f3e6e0;--verde:#5dff9a;--fuente:'Courier New',Courier,ui-monospace,monospace}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--fondo);color:var(--hueso);font-family:var(--fuente);overflow:hidden;user-select:none}
#crt{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px}
#crt::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:30;background:repeating-linear-gradient(to bottom,transparent 0 2px,rgba(0,0,0,.3) 3px)}
#crt::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:31;background:radial-gradient(ellipse at center,transparent 50%,rgba(0,0,0,.8) 100%)}
.pantalla{width:min(720px,100%);display:flex;flex-direction:column;gap:16px;position:relative;z-index:2}
#hud{display:flex;justify-content:space-between;align-items:center;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--tenue);min-height:22px}
#vidas{font-size:20px;letter-spacing:4px;color:var(--rojo)}
#vidas .muerta{color:var(--tenue)}
#reloj{height:6px;border:1px solid var(--tenue);position:relative;overflow:hidden}
#reloj i{position:absolute;left:0;top:0;bottom:0;width:100%;background:var(--rojo);transform-origin:left}
#host{font-size:clamp(17px,2.6vw,21px);line-height:1.55;min-height:96px;white-space:pre-wrap;text-shadow:0 0 8px rgba(255,45,61,.35)}
#host .r{color:var(--rojo)} #host .t{color:var(--tenue)}
#zona{min-height:240px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;position:relative}
.btn{all:unset;cursor:pointer;padding:12px 18px;border:1px solid var(--rojo2);color:var(--hueso);font-size:17px;text-align:center;transition:background .12s,border-color .12s}
.btn:hover,.btn:focus-visible{background:rgba(255,45,61,.12);border-color:var(--rojo)}
.btn.grande{font-size:22px;padding:20px 30px;letter-spacing:.08em}
.fila{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.sim{all:unset;cursor:pointer;width:64px;height:64px;display:flex;align-items:center;justify-content:center;font-size:30px;border:1px solid var(--rojo2);transition:transform .08s,background .12s}
.sim:active{transform:scale(.94)}
.sim.lit{background:var(--rojo);color:#000;border-color:var(--rojo)}
#reflejo{width:min(100%,520px);height:220px;border:1px solid var(--rojo2);display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer;color:var(--tenue)}
#reflejo.ya{background:var(--rojo);color:#000;font-weight:700}
.grilla{display:grid;gap:6px}
.grilla button{all:unset;cursor:pointer;width:42px;height:42px;display:flex;align-items:center;justify-content:center;font-size:22px;color:var(--hueso)}
.grilla button:hover{background:rgba(255,45,61,.12)}
input.txt{all:unset;border-bottom:1px solid var(--rojo);font-size:20px;padding:6px 2px;width:min(420px,100%);color:var(--hueso);caret-color:var(--rojo);text-align:center;user-select:text}
.frase{font-size:20px;color:var(--rojo);letter-spacing:.04em;text-align:center}
.puerta{all:unset;cursor:pointer;width:96px;height:150px;border:2px solid var(--rojo2);display:flex;align-items:flex-end;justify-content:center;padding-bottom:10px;font-size:22px;background:linear-gradient(#140608,#0a0304);transition:border-color .15s,transform .15s}
.puerta:hover,.puerta:focus-visible{border-color:var(--rojo);transform:translateY(-3px)}
.ojo{font-size:64px;color:var(--rojo);animation:ojo 2.2s infinite}
@keyframes ojo{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
#pie{display:flex;justify-content:space-between;font-size:11px;color:var(--tenue)}
#pie button{all:unset;cursor:pointer;color:var(--tenue)} #pie button:hover{color:var(--hueso)}
/* efectos */
body.sacudir .pantalla{animation:sacudir .4s}
@keyframes sacudir{0%,100%{transform:none}20%{transform:translate(-6px,2px)}40%{transform:translate(5px,-3px)}60%{transform:translate(-4px,3px)}80%{transform:translate(3px,-1px)}}
#flash{position:fixed;inset:0;z-index:40;pointer-events:none;opacity:0;background:var(--rojo)}
#flash.on{animation:fl .45s ease-out} @keyframes fl{0%{opacity:.7}100%{opacity:0}}
#muerte{position:fixed;inset:0;z-index:50;background:#000;display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:16px;text-align:center}
#muerte.on{display:flex}
#muerte h1{margin:0;font-size:clamp(46px,12vw,110px);color:var(--rojo);letter-spacing:.12em;text-shadow:0 0 22px rgba(255,45,61,.7);animation:latido 1.1s infinite}
@keyframes latido{0%,100%{transform:scale(1)}12%{transform:scale(1.06)}24%{transform:scale(1)}}
#muerte p{margin:0;color:var(--hueso);font-size:16px;max-width:520px;line-height:1.5}
#cara{position:fixed;inset:0;z-index:60;background:#000;display:none;align-items:center;justify-content:center}
#cara.on{display:flex} #cara svg{width:min(78vw,560px);animation:acerca .8s ease-in forwards}
@keyframes acerca{0%{transform:scale(.3);opacity:0}12%{opacity:1}100%{transform:scale(1.3)}}
body.reducido .pantalla,body.reducido #cara svg,body.reducido #muerte h1{animation:none!important}
</style>
<link rel="stylesheet" href="/zh_update.css?v=1">
<script src="/zh_auth.js?v=2"></script>
</head>
<body>
<div id="crt"><div class="pantalla">
  <div id="hud"><span id="ronda">—</span><span id="vidas"></span><span id="puntos"></span></div>
  <div id="reloj"><i></i></div>
  <div id="host" aria-live="polite"></div>
  <div id="zona"></div>
  <div id="pie"><span id="record"></span><span><button id="btnSonido" type="button">sonido: on</button></span></div>
</div></div>
<div id="flash"></div>
<div id="muerte"><h1>MORISTE</h1><p id="muerteTxt"></p><div class="fila"><button class="btn" id="btnOtra" type="button">Jugar otra vez</button></div></div>
<div id="cara" aria-hidden="true"><svg viewBox="0 0 200 240" xmlns="http://www.w3.org/2000/svg">
  <ellipse cx="100" cy="120" rx="80" ry="106" fill="#0d0505"/>
  <path d="M40 92 Q68 70 92 96" stroke="#000" stroke-width="10" fill="none"/>
  <path d="M108 96 Q132 70 160 92" stroke="#000" stroke-width="10" fill="none"/>
  <ellipse cx="68" cy="108" rx="18" ry="22" fill="#000"/><ellipse cx="132" cy="108" rx="18" ry="22" fill="#000"/>
  <circle cx="68" cy="110" r="4" fill="#ff2d3d"/><circle cx="132" cy="110" r="4" fill="#ff2d3d"/>
  <path d="M50 170 Q100 210 150 170" stroke="#000" stroke-width="6" fill="#000"/>
  <path d="M62 176 l6 10 l6 -9 l6 11 l6 -10 l6 11 l6 -11 l6 10 l6 -10 l6 10 l6 -9 l6 9" stroke="#3a1013" stroke-width="2" fill="none"/>
</svg></div>

<script>
(function(){
"use strict";
var VIDAS_MAX = 3, RONDAS = 12;
var reducido = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
if (reducido) document.body.classList.add("reducido");

/* ─── memoria persistente ─── */
var KEY = "jom_memoria";
function leer(){ try{ return JSON.parse(localStorage.getItem(KEY)) || {}; }catch(e){ return {}; } }
function guardar(m){ try{ localStorage.setItem(KEY, JSON.stringify(m)); }catch(e){} }
var mem = leer(); mem.muertes = mem.muertes || 0; mem.record = mem.record || 0;

/* ─── estado ─── */
var st, timers = [], escuchas = [], escribiendo = null;
function reset(){ st = { nombre: mem.nombre || "", vidas: VIDAS_MAX, ronda: 0, puntos: 0, usados: [], vivo: true }; }
reset();

/* ─── sonido ─── */
var ctx = null, drone = null, sonidoOn = true;
function audio(){
  if (ctx || !sonidoOn) return;
  try{
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    var o = ctx.createOscillator(), o2 = ctx.createOscillator(), f = ctx.createBiquadFilter(), g = ctx.createGain();
    o.type = "sawtooth"; o.frequency.value = 41; o2.type = "triangle"; o2.frequency.value = 61.5;
    f.type = "lowpass"; f.frequency.value = 180; g.gain.value = 0;
    o.connect(f); o2.connect(f); f.connect(g); g.connect(ctx.destination); o.start(); o2.start();
    g.gain.linearRampToValueAtTime(0.04, ctx.currentTime + 2);
    drone = { g: g, f: f };
  }catch(e){ ctx = null; }
}
function tono(freq, dur, tipo, vol){
  if (!ctx || !sonidoOn) return;
  var o = ctx.createOscillator(), g = ctx.createGain();
  o.type = tipo || "square"; o.frequency.value = freq; g.gain.value = vol || 0.05;
  g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + dur);
  o.connect(g); g.connect(ctx.destination); o.start(); o.stop(ctx.currentTime + dur);
}
function ruido(dur, vol){
  if (!ctx || !sonidoOn) return;
  var n = Math.floor(ctx.sampleRate*dur), b = ctx.createBuffer(1, n, ctx.sampleRate), d = b.getChannelData(0);
  for (var i=0;i<n;i++) d[i] = (Math.random()*2-1)*(1-i/n);
  var s = ctx.createBufferSource(), g = ctx.createGain(); g.gain.value = vol || .2; s.buffer = b; s.connect(g); g.connect(ctx.destination); s.start();
}
function sBien(){ tono(660, .12, "triangle", .07); setTimeout(function(){ tono(990, .18, "triangle", .07); }, 90); }
function sMal(){ tono(110, .5, "sawtooth", .12); ruido(.35, .25); }
function sTic(){ tono(1400, .03, "square", .02); }
function sGolpe(){ if (!ctx || !sonidoOn) return; var o = ctx.createOscillator(), g = ctx.createGain(); o.type="sawtooth";
  o.frequency.setValueAtTime(160, ctx.currentTime); o.frequency.exponentialRampToValueAtTime(30, ctx.currentTime+1);
  g.gain.setValueAtTime(.4, ctx.currentTime); g.gain.exponentialRampToValueAtTime(.001, ctx.currentTime+1.1);
  o.connect(g); g.connect(ctx.destination); o.start(); o.stop(ctx.currentTime+1.1); ruido(.8, .35); }
function tension(){ if (drone) drone.f.frequency.linearRampToValueAtTime(180 + st.ronda*55, ctx.currentTime + 1); }

/* ─── helpers ─── */
var $host = document.getElementById("host"), $zona = document.getElementById("zona"), $reloj = document.querySelector("#reloj i");
function T(fn, ms){ var id = setTimeout(fn, ms); timers.push(id); return id; }
function on(el, ev, fn, opt){ el.addEventListener(ev, fn, opt); escuchas.push([el, ev, fn, opt]); }
function limpiar(){
  timers.forEach(clearTimeout); timers = [];
  escuchas.forEach(function(e){ e[0].removeEventListener(e[1], e[2], e[3]); }); escuchas = [];
  if (escribiendo) { escribiendo.cancel(); escribiendo = null; }
  pararReloj(); $zona.textContent = "";
}
function el(tag, cls, txt){ var e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; }
function nom(){ return st.nombre || "jugador"; }
function rnd(a, b){ return a + Math.floor(Math.random()*(b-a+1)); }
function mezclar(a){ for (var i=a.length-1;i>0;i--){ var j = Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function dif(){ return Math.min(1, st.ronda / RONDAS); } // 0..1

function decir(lineas, fin){
  if (escribiendo) escribiendo.cancel();
  $host.textContent = "";
  var i = 0, j = 0, span, l, cancel = false, skip = false;
  function linea(){
    if (cancel) return;
    if (i >= lineas.length){ escribiendo = null; if (fin) fin(); return; }
    l = lineas[i]; if (typeof l === "string") l = { t: l };
    l = { t: l.t.replace(/\{n\}/g, nom()).replace(/\{N\}/g, nom().toUpperCase()), c: l.c };
    span = el("span", l.c || ""); if (i > 0) span.textContent = "\n"; $host.appendChild(span); j = 0; tic();
  }
  function tic(){
    if (cancel) return;
    if (skip){ span.textContent += l.t.slice(j); j = l.t.length; }
    if (j < l.t.length){ span.textContent += l.t[j++]; if (j % 3 === 0) sTic(); setTimeout(tic, ".,!?…".indexOf(l.t[j-1]) >= 0 ? 200 : 22); }
    else { i++; setTimeout(linea, skip ? 30 : 320); }
  }
  escribiendo = { cancel: function(){ cancel = true; }, skip: function(){ skip = true; } };
  linea();
}

var relojFin = null, relojRAF = 0, relojTotal = 0, relojInicio = 0;
function reloj(ms, alAgotar){
  pararReloj(); relojTotal = ms; relojInicio = performance.now(); relojFin = alAgotar;
  var ultimoTic = 0;
  function paso(t){
    var r = Math.max(0, 1 - (t - relojInicio) / relojTotal);
    $reloj.style.transform = "scaleX(" + r + ")";
    if (r < .3 && t - ultimoTic > 250){ ultimoTic = t; sTic(); }
    if (r <= 0){ var f = relojFin; pararReloj(); if (f) f(); return; }
    relojRAF = requestAnimationFrame(paso);
  }
  relojRAF = requestAnimationFrame(paso);
}
function pararReloj(){ cancelAnimationFrame(relojRAF); relojFin = null; }
function relojLleno(){ $reloj.style.transform = "scaleX(1)"; }

function hud(){
  document.getElementById("ronda").textContent = st.ronda ? ("ronda " + st.ronda + "/" + RONDAS) : "—";
  var v = document.getElementById("vidas"); v.textContent = "";
  for (var i=0;i<VIDAS_MAX;i++){ var s = el("span", i < st.vidas ? "" : "muerta", i < st.vidas ? "♥" : "♡"); v.appendChild(s); }
  document.getElementById("puntos").textContent = st.puntos + " pts";
  document.getElementById("record").textContent = "récord: ronda " + mem.record + " · muertes: " + mem.muertes;
}
function efecto(n){
  if (n === "flash" && !reducido){ var f = document.getElementById("flash"); f.classList.remove("on"); void f.offsetWidth; f.classList.add("on"); }
  if (n === "sacudir" && !reducido){ document.body.classList.remove("sacudir"); void document.body.offsetWidth; document.body.classList.add("sacudir"); }
}

/* ─── resultado de cada prueba ─── */
var BURLAS_BIEN = ["Mm. Tuviste suerte, {n}.", "Sobreviviste. Por ahora.", "No te emociones.", "Bien. Eso me aburre.", "Seguís respirando. Qué molesto."];
var BURLAS_MAL = ["Eso dolió, ¿no?", "Uno menos, {n}.", "Te estás quedando sin tiempo. Y sin vidas.", "Me encanta cuando fallan.", "Se te escapa algo rojo del pecho."];
function gano(extra){
  limpiar(); sBien(); st.puntos += 100 + Math.round(dif()*150) + (extra || 0); hud();
  decir([BURLAS_BIEN[rnd(0, BURLAS_BIEN.length-1)]], function(){ T(siguiente, 700); });
}
function perdio(motivo){
  limpiar(); sMal(); efecto("flash"); efecto("sacudir");
  st.vidas--; hud();
  if (st.vidas <= 0){ T(morir.bind(null, motivo), 500); return; }
  decir([{ t: motivo, c: "r" }, BURLAS_MAL[rnd(0, BURLAS_MAL.length-1)]], function(){ T(siguiente, 900); });
}

/* ─── las pruebas ─── */
var JUEGOS = {
  reflejos: function(){
    var limite = Math.round(700 - dif()*330);
    decir(["PRUEBA: REFLEJOS", { t: "Tocá el cuadro cuando se ponga ROJO. Si tocás antes, morís un poco.", c: "t" }], function(){
      var c = el("div", "", "esperá..."); c.id = "reflejo"; $zona.appendChild(c); relojLleno();
      var listo = false, t0 = 0, falsas = st.ronda > 4 ? rnd(0, 2) : 0;
      function fingir(){ // amagues: parpadea sin ponerse rojo
        if (falsas-- <= 0) return;
        T(function(){ c.style.borderColor = "#ff2d3d"; c.textContent = "¿ya?"; T(function(){ c.style.borderColor = ""; c.textContent = "esperá..."; fingir(); }, 260); }, rnd(500, 1100));
      }
      fingir();
      T(function(){ listo = true; t0 = performance.now(); c.classList.add("ya"); c.textContent = "¡AHORA!"; tono(880, .08, "square", .08);
        reloj(limite, function(){ perdio("Demasiado lento."); }); }, rnd(1800, 3800) + (st.ronda > 4 ? 900 : 0));
      on(c, "pointerdown", function(){
        if (!listo){ perdio("Tocaste antes de tiempo."); return; }
        var ms = Math.round(performance.now() - t0); gano(Math.max(0, limite - ms));
      });
    });
  },

  memoria: function(){
    var SIMS = ["◆", "▲", "●", "■", "✚", "★"].slice(0, st.ronda > 6 ? 6 : 4);
    var largo = 3 + Math.round(dif()*4), seq = [], i;
    for (i=0;i<largo;i++) seq.push(rnd(0, SIMS.length-1));
    decir(["PRUEBA: MEMORIA", { t: "Mirá la secuencia. Repetila igual. Un error y pagás.", c: "t" }], function(){
      var fila = el("div", "fila"), bs = SIMS.map(function(s, k){ var b = el("button", "sim", s); b.type = "button"; b.disabled = true; fila.appendChild(b); return b; });
      $zona.appendChild(fila); relojLleno();
      var paso = 0, vel = Math.round(650 - dif()*300);
      seq.forEach(function(k, n){
        T(function(){ bs[k].classList.add("lit"); tono(300 + k*90, .2, "triangle", .06); T(function(){ bs[k].classList.remove("lit"); }, vel*0.7); }, 500 + n*vel);
      });
      T(function(){
        bs.forEach(function(b){ b.disabled = false; });
        decir(["Tu turno."]);
        reloj(2200 + largo*900, function(){ perdio("Te quedaste pensando. Error fatal."); });
        bs.forEach(function(b, k){ on(b, "click", function(){
          b.classList.add("lit"); T(function(){ b.classList.remove("lit"); }, 160); tono(300 + k*90, .15, "triangle", .06);
          if (k !== seq[paso]){ perdio("Esa no era."); return; }
          if (++paso === seq.length) gano(largo*20);
        }); });
      }, 500 + seq.length*vel + 200);
    });
  },

  quieto: function(){
    var dur = 5000 + Math.round(dif()*4000);
    decir(["PRUEBA: QUIETO", { t: "Me está mirando. No muevas el mouse. No toques nada. No hagas ruido.", c: "t" }], function(){
      $zona.appendChild(el("div", "ojo", "◉")); var cuenta = el("div", "frase", ""); $zona.appendChild(cuenta);
      var armado = false;
      T(function(){
        armado = true; reloj(dur, function(){ gano(150); });
        var trampas = ["¿Ya terminó? Podés moverte.", "Listo, {n}. Hacé clic para seguir.", "Se te está por caer algo..."];
        if (st.ronda > 2) T(function(){ decir([{ t: trampas[rnd(0, trampas.length-1)], c: "r" }]); }, dur*0.55);
      }, 900);
      function mover(){ if (armado) perdio("Te moviste. Te vio."); }
      on(window, "mousemove", function(e){ if (Math.abs(e.movementX) + Math.abs(e.movementY) > 2) mover(); });
      on(window, "pointerdown", mover); on(window, "keydown", mover); on(window, "wheel", mover); on(window, "touchmove", mover);
    });
  },

  escribir: function(){
    var FRASES = ["no voy a mirar atras", "la puerta estaba abierta", "nadie sale de la beta", "juego o muero", "el anfitrion siempre gana", "me estoy quedando sin aire", "esto es solo un juego"];
    var frase = FRASES[rnd(0, FRASES.length-1)];
    var tiempo = Math.round(frase.length * (420 - dif()*170)) + 1800;
    decir(["PRUEBA: ESCRIBÍ", { t: "Escribí la frase exacta antes de que se acabe el tiempo.", c: "t" }], function(){
      $zona.appendChild(el("div", "frase", frase));
      var inp = el("input", "txt"); inp.autocomplete = "off"; inp.spellcheck = false; inp.setAttribute("aria-label", "Escribí la frase");
      $zona.appendChild(inp); inp.focus();
      reloj(tiempo, function(){ perdio("El tiempo se terminó antes que vos."); });
      on(inp, "paste", function(e){ e.preventDefault(); decir([{ t: "Pegar es trampa. Lo anoté.", c: "r" }]); });
      on(inp, "input", function(){
        var v = inp.value.toLowerCase();
        if (frase.indexOf(v) !== 0){ inp.style.color = "#ff2d3d"; } else inp.style.color = "";
        if (v === frase) gano(80);
      });
    });
  },

  puertas: function(){
    var ACERTIJOS = [
      { p: "Detrás de una hay aire. La que dice la verdad no tiene número par y no es la última.", ok: 0 },
      { p: "La salida está entre las otras dos.", ok: 1 },
      { p: "La primera miente. La del medio está cerrada desde adentro. Elegí la que queda.", ok: 2 },
      { p: "Escuchá: detrás de la izquierda algo respira. Detrás de la derecha, algo come. La otra está en silencio.", ok: 1 }
    ];
    var a = ACERTIJOS[rnd(0, ACERTIJOS.length-1)];
    decir(["PRUEBA: PUERTAS", { t: a.p, c: "t" }], function(){
      var fila = el("div", "fila");
      ["I", "II", "III"].forEach(function(n, k){
        var p = el("button", "puerta", n); p.type = "button"; fila.appendChild(p);
        on(p, "click", function(){ if (k === a.ok) gano(60); else perdio("Detrás de esa puerta había algo con hambre."); });
      });
      $zona.appendChild(fila);
      reloj(9000 - Math.round(dif()*3000), function(){ perdio("Si no elegís, elijo yo."); });
    });
  },

  cuentas: function(){
    var n = 3, hechas = 0;
    decir(["PRUEBA: CUENTAS", { t: "Tres cuentas. Rápido. Tu cerebro contra el reloj.", c: "t" }], function(){
      var preg = el("div", "frase", ""), fila = el("div", "fila"); $zona.appendChild(preg); $zona.appendChild(fila);
      reloj(9500 - Math.round(dif()*3500), function(){ perdio("No llegaste a contar hasta tu final."); });
      function nueva(){
        var a = rnd(3, 9 + st.ronda), b = rnd(2, 9), op = rnd(0, st.ronda > 5 ? 2 : 1), r, txt;
        if (op === 0){ r = a + b; txt = a + " + " + b; } else if (op === 1){ r = a - b; txt = a + " − " + b; } else { r = a * b; txt = a + " × " + b; }
        preg.textContent = txt + " = ?";
        var ops = [r, r + rnd(1, 3), r - rnd(1, 3), r + (rnd(0,1) ? 10 : -10)];
        ops = mezclar(ops.filter(function(v, i){ return ops.indexOf(v) === i; }));
        fila.textContent = "";
        ops.forEach(function(v){ var b2 = el("button", "btn", String(v)); b2.type = "button"; fila.appendChild(b2);
          on(b2, "click", function(){ if (v !== r){ perdio("Mal. " + txt + " era " + r + "."); return; } sBien(); if (++hechas === n) gano(70); else nueva(); }); });
      }
      nueva();
    });
  },

  intruso: function(){
    var PARES = [["O", "Q"], ["◐", "◑"], ["b", "d"], ["E", "F"], ["▲", "▴"], ["8", "B"], ["ж", "x"]];
    var par = PARES[rnd(0, PARES.length-1)], lado = 5 + Math.round(dif()*3), total = lado*lado, pos = rnd(0, total-1);
    decir(["PRUEBA: EL INTRUSO", { t: "Uno de estos no es como los demás. Igual que vos acá adentro.", c: "t" }], function(){
      var g = el("div", "grilla"); g.style.gridTemplateColumns = "repeat(" + lado + ", 42px)";
      for (var i=0;i<total;i++){
        (function(i){ var b = el("button", "", i === pos ? par[1] : par[0]); b.type = "button"; g.appendChild(b);
          on(b, "click", function(){ if (i === pos) gano(90); else perdio("Ese era igual a todos. Como vos."); }); })(i);
      }
      $zona.appendChild(g);
      reloj(8000 - Math.round(dif()*3000), function(){ perdio("No lo encontraste. Él a vos sí."); });
    });
  },

  noclick: function(){
    var dur = 5000 + Math.round(dif()*2500);
    decir(["PRUEBA: CONFIANZA", { t: "Hacé clic en el botón para sobrevivir.", c: "t" }], function(){
      var b = el("button", "btn grande", "HACÉ CLIC PARA SOBREVIVIR"); b.type = "button"; $zona.appendChild(b);
      reloj(dur, function(){ limpiar(); decir([{ t: "...no lo tocaste. Bien. Era mentira.", c: "r" }], function(){ gano(120); }); });
      T(function(){ b.textContent = "¡RÁPIDO! ¡TOCALO!"; }, dur*0.45);
      T(function(){ b.textContent = "¡SE ACABA EL TIEMPO, {N}!".replace("{N}", nom().toUpperCase()); }, dur*0.75);
      on(b, "click", function(){ perdio("Nunca confíes en el anfitrión."); });
    });
  }
};
var ORDEN_FACIL = ["reflejos", "memoria", "puertas", "cuentas"];

function siguiente(){
  limpiar();
  if (st.ronda >= RONDAS){ ganarJuego(); return; }
  st.ronda++; hud(); tension();
  if (st.ronda > mem.record){ mem.record = st.ronda; guardar(mem); }
  var lista = st.ronda <= 2 ? ORDEN_FACIL : Object.keys(JUEGOS);
  var opciones = lista.filter(function(k){ return st.usados.slice(-3).indexOf(k) < 0; });
  var forzado = new URLSearchParams(location.search).get("juego");
  var j = (forzado && JUEGOS[forzado]) ? forzado : opciones[rnd(0, opciones.length-1)];
  st.usados.push(j);
  JUEGOS[j]();
}

/* ─── pantallas ─── */
function intro(){
  limpiar(); reset(); hud(); relojLleno();
  document.getElementById("muerte").classList.remove("on");
  var lineas = mem.muertes ? [
    { t: "Volviste.", c: "r" },
    "Ya moriste " + mem.muertes + (mem.muertes === 1 ? " vez" : " veces") + ". Tu mejor ronda fue la " + mem.record + ".",
    { t: "Hay " + RONDAS + " rondas. Nadie llegó al final todavía.", c: "t" }
  ] : [
    "Bienvenido a JUEGA O MUERE.",
    { t: "Yo soy el anfitrión. Vos sos el juguete.", c: "r" },
    { t: "Son " + RONDAS + " pruebas. Tenés 3 vidas. Si las perdés todas...", c: "t" },
    { t: "Contiene sustos, destellos y sonidos fuertes.", c: "t" }
  ];
  decir(lineas, function(){
    if (!st.nombre){
      var inp = el("input", "txt"); inp.placeholder = "tu nombre"; inp.maxLength = 16; inp.setAttribute("aria-label", "Tu nombre");
      $zona.appendChild(inp); inp.focus();
      var b = el("button", "btn grande", "JUGAR"); b.type = "button"; $zona.appendChild(b);
      function ir(){ var v = inp.value.replace(/[^\wáéíóúñÁÉÍÓÚÑ .-]/g, "").trim().slice(0, 16); if (!v){ inp.focus(); return; }
        st.nombre = v; mem.nombre = v; guardar(mem); empezar(); }
      on(b, "click", ir); on(inp, "keydown", function(e){ if (e.key === "Enter") ir(); });
    } else {
      var b2 = el("button", "btn grande", "JUGAR"); b2.type = "button"; $zona.appendChild(b2); b2.focus();
      on(b2, "click", empezar);
    }
  });
}
function empezar(){
  audio(); limpiar();
  decir(["Muy bien, {n}.", { t: "Que empiece el juego.", c: "r" }], function(){ T(siguiente, 600); });
}
function morir(motivo){
  limpiar(); st.vivo = false; mem.muertes++; guardar(mem);
  var c = document.getElementById("cara"); c.classList.add("on"); sGolpe();
  T(function(){
    c.classList.remove("on");
    document.getElementById("muerteTxt").textContent = motivo + " Llegaste a la ronda " + st.ronda + " con " + st.puntos + " puntos. " +
      (st.ronda >= mem.record ? "Es tu récord. No te sirve de nada." : "Tu récord es la ronda " + mem.record + ".");
    document.getElementById("muerte").classList.add("on");
    document.getElementById("btnOtra").focus();
    hud();
  }, reducido ? 600 : 1300);
}
function ganarJuego(){
  limpiar(); efecto("flash");
  mem.ganadas = (mem.ganadas || 0) + 1; guardar(mem);
  decir([
    "...",
    { t: "Llegaste al final, {n}.", c: "r" },
    "Nadie había llegado al final.",
    "Ganaste " + st.puntos + " puntos y la única salida que existe.",
    { t: "La puerta está abierta. Pero yo voy con vos.", c: "t" }
  ], function(){
    var b = el("button", "btn grande", "SALIR"); b.type = "button"; $zona.appendChild(b);
    on(b, "click", intro);
  });
}

/* ─── controles generales ─── */
document.getElementById("host").addEventListener("click", function(){ if (escribiendo) escribiendo.skip(); });
document.getElementById("btnOtra").addEventListener("click", intro);
document.getElementById("btnSonido").addEventListener("click", function(){
  sonidoOn = !sonidoOn; this.textContent = "sonido: " + (sonidoOn ? "on" : "off");
  if (ctx){ sonidoOn ? ctx.resume() : ctx.suspend(); } else if (sonidoOn) audio();
});
document.addEventListener("visibilitychange", function(){
  if (document.hidden){ document.title = "volvé, " + nom() + "..."; }
  else { document.title = "JUEGA O MUERE"; }
});

intro();
})();
</script>
