plugins {
    id 'com.android.application'
}
android {
    namespace 'com.cyberalerta.app'
    compileSdk 34
    defaultConfig {
        applicationId "com.cyberalerta.app"
        minSdk 24
        targetSdk 34
        versionCode 3
        versionName "1.2.0"
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
        encoding 'UTF-8'
    }
}
dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
}