<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>📦 Base de Datos · ZonaHack</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#060907;--card:rgba(255,255,255,.03);--border:rgba(0,255,65,.10);--border2:rgba(0,255,65,.18);
  --text:#d6e4dc;--muted:rgba(214,228,220,.45);--accent:#00ff41;--gold:#f1c40f}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh}
.bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.orb{position:absolute;border-radius:50%;filter:blur(80px);opacity:.5;animation:flotar 16s ease-in-out infinite}
.orb1{width:440px;height:440px;background:radial-gradient(circle,rgba(0,255,65,.2),transparent 70%);top:-170px;right:-120px}
.orb2{width:500px;height:500px;background:radial-gradient(circle,rgba(0,200,255,.12),transparent 70%);bottom:-210px;left:-160px;animation-delay:-6s}
@keyframes flotar{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(20px,-14px) scale(1.08)}}
.header{display:flex;align-items:center;gap:12px;padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top));
  border-bottom:1px solid var(--border);background:rgba(6,9,7,.88);backdrop-filter:blur(10px);position:sticky;top:0;z-index:100}
.logo{width:40px;height:40px;border-radius:12px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
  font-size:20px;background:linear-gradient(135deg,rgba(0,255,65,.22),rgba(0,200,255,.15));border:1px solid var(--border2)}
.ttl{flex:1;min-width:0}
.ttl h1{font-size:.92em;color:var(--accent);letter-spacing:1.5px;font-family:'Courier New',monospace;
  text-shadow:0 0 10px rgba(0,255,65,.25);white-space:nowrap}
.ttl span{font-size:.6em;color:var(--gold);letter-spacing:2px}
.back{color:var(--accent);text-decoration:none;font-size:.7em;padding:6px 10px;border:1px solid var(--border2);border-radius:8px}
.container{max-width:860px;margin:0 auto;padding:16px 14px 40px;position:relative;z-index:1}
.hero{text-align:center;padding:20px 12px 8px}
.hero .big{font-size:48px;filter:drop-shadow(0 0 20px rgba(0,255,65,.3));animation:flotar2 5s ease-in-out infinite}
@keyframes flotar2{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.hero h2{font-size:1.45em;font-weight:900;margin-top:6px;color:#fff;letter-spacing:1px;font-family:'Courier New',monospace;
  background:linear-gradient(90deg,#fff,#00ff41,#fff);background-size:200%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:brillo 5s linear infinite}
@keyframes brillo{to{background-position:200%}}
.hero p{color:var(--muted);font-size:.7em;margin-top:4px}
.stats{display:flex;gap:8px;justify-content:center;margin-top:12px;flex-wrap:wrap}
.stat{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:8px 16px;min-width:80px}
.stat b{display:block;font-size:1em;color:#fff;font-family:'Courier New',monospace}
.stat span{font-size:.56em;color:var(--muted);letter-spacing:1px;text-transform:uppercase}
.buscador{max-width:520px;margin:16px auto 6px;display:flex;gap:8px}
.buscador input{flex:1;background:var(--card);border:1px solid var(--border2);border-radius:12px;color:var(--text);
  padding:12px 14px;font-size:.82em;font-family:inherit;outline:none}
.buscador input:focus{border-color:var(--accent);box-shadow:0 0 16px rgba(0,255,65,.15)}
.chips{display:flex;gap:7px;padding:10px 2px;overflow-x:auto}
.chip{white-space:nowrap;padding:6px 13px;border-radius:20px;border:1px solid var(--border2);
  background:rgba(0,255,65,.05);color:var(--muted);font-size:.68em;cursor:pointer;transition:.2s;font-family:inherit}
.chip.on{background:rgba(0,255,65,.12);border-color:rgba(0,255,65,.4);color:var(--accent);font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;margin-top:8px}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;cursor:pointer;transition:.25s}
.card:hover{border-color:var(--border2);transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.4)}
.card .th{aspect-ratio:16/9;background-size:cover;background-position:center;position:relative;background:#0f1430}
.card .th .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:2em;opacity:.35}
.card .inf{padding:10px 12px}
.card .t{font-size:.78em;color:#fff;font-weight:600;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .c{font-size:.58em;color:var(--accent);border:1px solid rgba(0,255,65,.2);padding:1px 8px;border-radius:12px;width:fit-content;margin-top:6px;letter-spacing:.5px}
.empty{text-align:center;color:var(--muted);padding:44px 20px;font-size:.78em}
.empty .big{font-size:40px;margin-bottom:8px}
.spinner{width:34px;height:34px;margin:40px auto;border-radius:50%;border:3px solid var(--border);border-top-color:var(--accent);animation:giro .7s linear infinite}
@keyframes giro{to{transform:rotate(360deg)}}
.footer{text-align:center;margin-top:24px;font-size:.6em;color:var(--gold);letter-spacing:1px}
</style>
</head>
<body>
<div class="bg"><div class="orb orb1"></div><div class="orb orb2"></div></div>

<div class="header">
  <div class="logo">📦</div>
  <div class="ttl">
    <h1>BASE DE DATOS ZONAHACK</h1>
    <span>VISOR · HECHA POR GONZA</span>
  </div>
  <a href="/" class="back">←</a>
</div>

<div class="container">
  <div class="hero">
    <div class="big">🗄️</div>
    <h2>BASE DE DATOS</h2>
    <p>Explorá todo lo que hay en la base de ZonaHack</p>
    <div class="stats">
      <div class="stat"><b id="sVideos">—</b><span>Videos</span></div>
      <div class="stat"><b id="sUsers">—</b><span>Usuarios</span></div>
      <div class="stat"><b id="sCats">—</b><span>Categorías</span></div>
    </div>
  </div>

  <div class="buscador">
    <input id="q" placeholder="Buscar en la base…">
  </div>
  <div class="chips" id="chips"></div>

  <div id="loading"><div class="spinner"></div></div>
  <div class="grid" id="grid"></div>
  <div id="empty" class="empty" style="display:none"><div class="big">📦</div>Aún no hay contenido en la base.</div>
  <div class="footer">ZONAHACK · BASE DE DATOS · HECHA POR GONZA</div>
</div>

<script>
var SB="https://xfwolaurpeofysnymqle.supabase.co";
var KEY="sb_publishable_3VvBUD5Bdu3Uaq59fJ99MQ_XDCtujUU";
var H={"apikey":KEY,"Authorization":"Bearer "+KEY};
var videos=[], cat="Todas", q="";
function $(id){return document.getElementById(id);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}

function cargar(){
  $("loading").style.display="block"; $("empty").style.display="none";
  Promise.all([
    fetch(SB+"/rest/v1/videos?select=id,titulo,url,thumbnail,tipo,categoria&order=created_at.desc&limit=500",{headers:H}).then(function(r){return r.json();}).catch(function(){return[];}),
    fetch(SB+"/rest/v1/usuarios_ext?select=usuario_nombre&limit=1000",{headers:H}).then(function(r){return r.json();}).catch(function(){return[];})
  ]).then(function(res){
    $("loading").style.display="none";
    videos=res[0]||[];
    var cats={}; videos.forEach(function(v){ if(v.categoria) cats[v.categoria]=1; });
    $("sVideos").textContent=videos.length;
    $("sUsers").textContent=(res[1]||[]).length;
    $("sCats").textContent=Object.keys(cats).length;
    buildChips();
    render();
  });
}

function buildChips(){
  var cats=["Todas"];
  videos.forEach(function(v){ if(v.categoria && cats.indexOf(v.categoria)<0) cats.push(v.categoria); });
  $("chips").innerHTML=cats.map(function(c){
    return '<button class="chip'+(c===cat?' on':'')+'" data-c="'+esc(c)+'">'+esc(c)+'</button>';
  }).join("");
  $("chips").querySelectorAll(".chip").forEach(function(b){
    b.addEventListener("click",function(){
      cat=b.getAttribute("data-c");
      $("chips").querySelectorAll(".chip").forEach(function(x){x.classList.toggle("on",x===b);});
      render();
    });
  });
}

function render(){
  var list=videos.filter(function(v){
    var okC=cat==="Todas"||v.categoria===cat;
    var okQ=!q||(v.titulo||"").toLowerCase().indexOf(q)>=0;
    return okC&&okQ;
  });
  var grid=$("grid");
  if(!list.length){ $("empty").style.display="block"; grid.innerHTML=""; return; }
  $("empty").style.display="none";
  grid.innerHTML=list.map(function(v,i){
    var th=v.thumbnail
      ? "background-image:url('"+esc(v.thumbnail).replace(/["']/g,"")+"')"
      : "";
    var urlId=v.url||v.id||"";
    var youtube=urlId.indexOf("http")===0?urlId:("https://www.youtube.com/watch?v="+urlId);
    return '<div class="card" data-url="'+esc(youtube)+'" style="animation:fadeIn .3s '+Math.min(i*25,400)+'ms both">'+
      '<div class="th" '+(th?'style="'+th+'"':'')+'>'+(th?'':'<div class="ph">📦</div>')+'</div>'+
      '<div class="inf"><div class="t">'+esc((v.titulo||"Sin título").slice(0,80))+'</div>'+
      (v.categoria?'<div class="c">'+esc(v.categoria)+'</div>':'')+'</div></div>';
  }).join("");
  grid.querySelectorAll(".card").forEach(function(c){
    c.addEventListener("click",function(){
      var u=c.getAttribute("data-url");
      if(u) window.location.href=u;
    });
  });
}

$("q").addEventListener("input",function(e){ q=e.target.value.trim().toLowerCase(); render(); });
cargar();
</script>
</body>
</html>
