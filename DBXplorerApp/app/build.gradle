plugins {
    id 'com.android.application'
}
android {
    namespace 'com.dbxplorer.app'
    compileSdk 34
    defaultConfig {
        applicationId "com.dbxplorer.app"
        minSdk 24
        targetSdk 34
        versionCode 4
        versionName "1.2.0"
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
        encoding 'UTF-8'
    }
}
