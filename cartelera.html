<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>🎬 Cartelera · Próximos Estrenos</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#07090e;--card:#0d1117;--border:#1c2531;--text:#d7e2ef;--muted:#6d7f93;
  --accent:#00e5ff;--violet:#7a5cff;--gold:#f1c40f;--green:#2ee6a8}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh}
.bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.orb{position:absolute;border-radius:50%;filter:blur(90px);opacity:.4;animation:flotar 18s ease-in-out infinite}
.orb1{width:480px;height:480px;background:radial-gradient(circle,rgba(0,229,255,.25),transparent 70%);top:-180px;right:-120px}
.orb2{width:520px;height:520px;background:radial-gradient(circle,rgba(122,92,255,.25),transparent 70%);bottom:-220px;left:-160px;animation-delay:-7s}
@keyframes flotar{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(24px,-18px) scale(1.08)}}
.header{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--border);
  background:rgba(7,9,14,.9);backdrop-filter:blur(10px);position:sticky;top:0;z-index:100}
.logo{width:40px;height:40px;border-radius:12px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
  font-size:20px;background:linear-gradient(135deg,rgba(0,229,255,.25),rgba(122,92,255,.25));border:1px solid rgba(0,229,255,.4)}
.ttl{flex:1;min-width:0}
.ttl h1{font-size:.95em;letter-spacing:2px;font-weight:900;font-family:'Courier New',monospace;color:#fff;
  background:linear-gradient(90deg,#00e5ff,#7a5cff,#00e5ff);background-size:200%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:brillo 4s linear infinite}
@keyframes brillo{to{background-position:200%}}
.ttl span{font-size:.6em;color:var(--muted);letter-spacing:2px}
.back{color:var(--accent);text-decoration:none;font-size:.7em;padding:6px 10px;border:1px solid var(--border);border-radius:8px}
.container{max-width:900px;margin:0 auto;padding:16px 14px 40px;position:relative;z-index:1}
.hero{text-align:center;padding:22px 12px 10px}
.hero .big{font-size:48px;filter:drop-shadow(0 0 22px rgba(0,229,255,.35))}
.hero h2{font-size:1.5em;font-weight:900;margin-top:6px;color:#fff;letter-spacing:1px;font-family:'Courier New',monospace;
  background:linear-gradient(90deg,#fff,#00e5ff,#7a5cff,#fff);background-size:300%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:brillo 6s linear infinite}
.hero p{color:var(--muted);font-size:.72em;margin-top:5px}
.stats{display:flex;gap:8px;justify-content:center;margin-top:12px}
.stat{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:8px 16px;min-width:90px;text-align:center}
.stat b{display:block;font-size:1.1em;color:#fff;font-family:'Courier New',monospace}
.stat span{font-size:.56em;color:var(--muted);letter-spacing:1px;text-transform:uppercase}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;margin-top:14px}
.peli{background:var(--card);border:1px solid var(--border);border-radius:16px;overflow:hidden;position:relative;
  display:flex;flex-direction:column;transition:transform .2s,border-color .2s,box-shadow .2s;content-visibility:auto;contain-intrinsic-size:230px 210px}
.peli:hover{transform:translateY(-4px);border-color:rgba(0,229,255,.4);box-shadow:0 12px 34px rgba(0,0,0,.5)}
.peli .poster{aspect-ratio:16/9;background:linear-gradient(135deg,#101a2e,#1c1033);position:relative;display:flex;align-items:center;justify-content:center}
.peli .poster .emoji{font-size:34px;filter:drop-shadow(0 0 12px rgba(0,229,255,.4))}
.peli .poster .eta{position:absolute;top:8px;right:8px;font-size:.58em;font-weight:800;color:#03140a;background:var(--green);
  padding:3px 9px;border-radius:12px;letter-spacing:.5px}
.peli .poster .eta.hot{background:var(--gold)}
.peli .body{padding:12px 13px 14px;display:flex;flex-direction:column;gap:5px;flex:1}
.peli .tit{font-size:.86em;color:#fff;font-weight:700;line-height:1.35}
.peli .gen{font-size:.62em;color:var(--accent);letter-spacing:.5px}
.peli .desc{font-size:.66em;color:var(--muted);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.peli .fecha{margin-top:auto;font-size:.68em;color:var(--gold);font-family:'Courier New',monospace}
.add-btn{position:fixed;right:16px;bottom:16px;z-index:50;background:linear-gradient(135deg,#00e5ff,#7a5cff);color:#03140a;
  border:none;border-radius:50%;width:54px;height:54px;font-size:26px;cursor:pointer;box-shadow:0 6px 22px rgba(0,229,255,.3)}
.add-btn:hover{transform:scale(1.05)}
.empty{text-align:center;color:var(--muted);padding:50px 20px;font-size:.8em}
.spinner{width:34px;height:34px;margin:50px auto;border-radius:50%;border:3px solid var(--border);border-top-color:var(--accent);animation:giro .7s linear infinite}
@keyframes giro{to{transform:rotate(360deg)}}
.modal{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;padding:20px}
.modal.open{display:flex}
.modal .box{background:#0d1117;border:1px solid var(--border);border-radius:16px;padding:20px;max-width:360px;width:100%}
.modal h3{color:#fff;font-size:.9em;margin-bottom:12px}
.modal input{width:100%;background:rgba(0,0,0,.4);border:1px solid var(--border);border-radius:10px;color:var(--text);
  padding:10px;font-size:.78em;outline:none;margin-bottom:8px}
.modal input:focus{border-color:var(--accent)}
.modal .row{display:flex;gap:8px}
.btn{background:linear-gradient(135deg,#00e5ff,#0096d6);color:#03140a;border:none;border-radius:10px;padding:10px 16px;
  font-weight:800;font-size:.72em;cursor:pointer;font-family:inherit;flex:1}
.btn.ghost{background:rgba(0,229,255,.08);color:var(--accent);border:1px solid var(--border)}
.footer{text-align:center;margin-top:24px;font-size:.6em;color:var(--muted);letter-spacing:1px}
.status{text-align:center;font-size:.66em;color:var(--green);margin:8px 0;min-height:14px}
</style>
</head>
<body>
<div class="bg"><div class="orb orb1"></div><div class="orb orb2"></div></div>

<div class="header">
  <div class="logo">🎬</div>
  <div class="ttl">
    <h1>CARTELERA</h1>
    <span>PRÓXIMOS ESTRENOS</span>
  </div>
  <a href="/" class="back">←</a>
</div>

<div class="container">
  <div class="hero">
    <div class="big">🍿</div>
    <h2>PRÓXIMOS ESTRENOS</h2>
    <p>Lo que viene al cine: no te lo pierdas</p>
    <div class="stats">
      <div class="stat"><b id="sTotal">—</b><span>Estrenos</span></div>
      <div class="stat"><b id="sEste">—</b><span>Este año</span></div>
      <div class="stat"><b id="sProx">—</b><span>Próximos</span></div>
    </div>
  </div>
  <div class="grid" id="grid"><div class="spinner"></div></div>
  <div class="status" id="status"></div>
  <div class="footer">ZONAHACK · CARTELERA DE ESTRENOS</div>
</div>

<button class="add-btn" id="addBtn" title="Agregar estreno">＋</button>

<div class="modal" id="modal">
  <div class="box">
    <h3>🎬 Agregar estreno</h3>
    <input id="mTitulo" placeholder="Título de la película">
    <input id="mFecha" type="date">
    <input id="mGenero" placeholder="Género (opcional)">
    <input id="mDesc" placeholder="Descripción (opcional)">
    <div class="row">
      <button class="btn" onclick="guardar()">💾 Guardar</button>
      <button class="btn ghost" onclick="cerrarModal()">Cerrar</button>
    </div>
    <div class="status" id="mStatus"></div>
  </div>
</div>

<script>
var SB="https://xfwolaurpeofysnymqle.supabase.co";
var KEY="sb_publishable_3VvBUD5Bdu3Uaq59fJ99MQ_XDCtujUU";
var H={"apikey":KEY,"Authorization":"Bearer "+KEY};
function $(id){return document.getElementById(id);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
var GEN_EMOJI={'Ciencia ficción':'🚀','Animación':'🧸','Acción':'💥','Superhéroes':'🦸','Misterio':'🕵️','Terror':'👻','Comedia':'😂','Drama':'🎭'};

function cargar(){
  fetch(SB+"/rest/v1/estrenos?select=*&activo=eq.true&order=fecha.asc&limit=200",{headers:H})
  .then(function(r){return r.json();}).then(function(d){
    var list=(d||[]).sort(function(a,b){ return new Date(a.fecha)-new Date(b.fecha); });
    if(!list.length){ $('grid').innerHTML='<div class="empty">Aún no hay estrenos cargados.</div>'; return; }
    var hoy=new Date(); var anio=hoy.getFullYear(); var prox=0, este=0;
    list.forEach(function(e){ var f=new Date(e.fecha); if(f>=hoy) prox++; if(f.getFullYear()===anio && f>=hoy) este++; });
    $('sTotal').textContent=list.length; $('sEste').textContent=este; $('sProx').textContent=prox;
    $('grid').innerHTML=list.map(function(e){
      var f=new Date(e.fecha); var dias=Math.ceil((f-hoy)/86400000);
      var eta = dias<0?'ESTRENADO':dias<=60?'¡MUY PRONTO!':'EN '+dias+' DÍAS';
      var hot = dias>=0 && dias<=60;
      var emoji = GEN_EMOJI[e.genero]||'🎬';
      return '<div class="peli"><div class="poster"><span class="emoji">'+emoji+'</span>'+
        '<span class="eta'+(hot?' hot':'')+'">'+eta+'</span></div>'+
        '<div class="body"><div class="tit">'+esc(e.titulo)+'</div>'+
        (e.genero?'<div class="gen">'+esc(e.genero)+'</div>':'')+
        (e.descripcion?'<div class="desc">'+esc(e.descripcion)+'</div>':'')+
        '<div class="fecha">📅 '+f.toLocaleDateString('es-AR',{weekday:'short',day:'numeric',month:'short',year:'numeric'})+'</div></div></div>';
    }).join('');
  }).catch(function(){ $('grid').innerHTML='<div class="empty">Error al cargar (¿corriste sql_estrenos.sql?)</div>'; });
}

function abrirModal(){ $('modal').classList.add('open'); }
function cerrarModal(){ $('modal').classList.remove('open'); }
function guardar(){
  var titulo=$('mTitulo').value.trim(); if(!titulo){$('mStatus').textContent='Poné el título';return;}
  var data={titulo:titulo,fecha:$('mFecha').value||null,genero:$('mGenero').value.trim(),descripcion:$('mDesc').value.trim(),activo:true,autor:localStorage.getItem('vh_usuario')||'anon'};
  fetch(SB+"/rest/v1/estrenos",{method:'POST',headers:Object.assign({},H,{'Content-Type':'application/json','Prefer':'return=minimal'}),body:JSON.stringify(data)})
  .then(function(){ $('mStatus').textContent='✅ Estreno agregado'; cerrarModal(); $('mTitulo').value='';$('mFecha').value='';$('mGenero').value='';$('mDesc').value=''; cargar(); })
  .catch(function(){ $('mStatus').textContent='Error (¿corriste sql_estrenos.sql?)'; });
}
$('addBtn').addEventListener('click',abrirModal);
cargar();
</script>
</body>
</html>
