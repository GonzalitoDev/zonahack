function generarQR(){
  var t=($("qrInput").value||"https://offlinevideoplayer.vercel.app");

function genPW(){
  var len=parseInt($("pwLen").value);$("pwLenVal").textContent=len;
  var ch="abcdefghijklmnopqrstuvwxyz";
  if($("pwUpper").checked)ch+="ABCDEFGHIJKLMNOPQRSTUVWXYZ";
  if($("pwNum").checked)ch+="0123456789";
  if($("pwSym").checked)ch+="!@#$%&*_+-=";
  var pw="";for(var i=0;i<len;i++)pw+=ch[Math.floor(Math.random()*ch.length)];
  $("pwResult").textContent=pw;
  // Fortaleza
  var str=len>14?3:len>10?2:1;
  var colors=["#e74c3c","#f1c40f","#2ecc71"];var widths=["33%","66%","100%"];
  var el=$("pwStrength");el.style.background=colors[str-1];el.style.width=widths[str-1];
}
function b64Encode(){try{$("b64Output").value=btoa($("b64Input").value||"");}catch(e){$("b64Output").value="Error: "+e.message;}}
function b64Decode(){try{$("b64Output").value=atob($("b64Input").value||"");}catch(e){$("b64Output").value="Error: "+e.message;}}
function b64Auto(){try{b64Encode();}catch(e){}}
function jsonFormat(){try{var d=JSON.parse($("jsonInput").value);$("jsonOutput").value=JSON.stringify(d,null,2);}catch(e){$("jsonOutput").value="Error: "+e.message;}}
function jsonMinify(){try{var d=JSON.parse($("jsonInput").value);$("jsonOutput").value=JSON.stringify(d);}catch(e){$("jsonOutput").value="Error: "+e.message;}}
function urlEncode(){$("urlOutput").value=encodeURIComponent($("urlInput").value||"");}
function urlDecode(){$("urlOutput").value=decodeURIComponent($("urlInput").value||"");}
function genHash(){
  var t=$("hashInput").value||"";
  try{
    var enc=new TextEncoder().encode(t);
    crypto.subtle.digest("SHA-256",enc).then(function(h){$("sha256").textContent=Array.from(new Uint8Array(h)).map(function(b){return b.toString(16).padStart(2,"0");}).join("");});
    crypto.subtle.digest("SHA-1",enc).then(function(h){$("sha1").textContent=Array.from(new Uint8Array(h)).map(function(b){return b.toString(16).padStart(2,"0");}).join("");});
  }catch(e){}
  $("md5").textContent="MD5 requiere libreria externa";
}
function updateColor(){
  var c=$("colorPick").value;
  $("hexVal").textContent=c;
  var r=parseInt(c.slice(1,3),16),g=parseInt(c.slice(3,5),16),b=parseInt(c.slice(5,7),16);
  $("rgbVal").textContent="rgb("+r+","+g+","+b+")";
  var max=Math.max(r,g,b)/255,min=Math.min(r,g,b)/255,d=(max-min);
  var l=(max+min)/2,s=d/(1-Math.abs(2*l-1));
  var hh=0;if(d){if(max===r/255)hh=((g/255-b/255)/d)%6;else if(max===g/255)hh=(b/255-r/255)/d+2;else hh=(r/255-g/255)/d+4;}
  hh=Math.round(hh*60);if(hh<0)hh+=360;
  $("hslVal").textContent="hsl("+hh+","+Math.round(s*100)+"%,"+Math.round(l*100)+"%)";
}
function startCountdown(){var m=parseInt($("cdMin").value)||0;var s=parseInt($("cdSec").value)||0;var total=m*60+s;if(cdInterval)clearInterval(cdInterval);cdInterval=setInterval(function(){if(total<=0){clearInterval(cdInterval);$("cdDisplay").textContent="00:00";alert("Tiempo!");return;}total--;var mm=Math.floor(total/60),ss=total%60;$("cdDisplay").textContent=(mm<10?"0":"")+mm+":"+(ss<10?"0":"")+ss;},1000);registrarUso("countdown","iniciar");}

// ─── RENDER ──────────────────────────
function renderBuiltin(list){
  var h='';
  (list||BUILTIN).forEach(function(t){
    var f=esFav(t.id);
    h+='<div class="tool-card builtin"><div class="top"><div class="ico">'+t.ico+'</div>';
    h+='<div class="nm">'+esc(t.nm)+'<span class="badge badge-built">INTEGRADA</span></div></div>';
    h+='<div class="desc">'+esc(t.desc)+'</div>';
    h+='<div class="actions"><button onclick="BUILTIN.find(function(b){return b.id===\''+t.id+'\'}).open()">🚀 USAR</button>';
    h+='<button class="fav" onclick="toggleFav(\''+t.id+'\');renderTodo(document.querySelector(\'#catBtns button.active\'))">'+(f?'❤️':'🤍')+'</button></div></div>';
  });
  $("builtinGrid").innerHTML=h;
}

function renderDownloads(list){
  var h='';
  (list||DOWNLOADS).forEach(function(t){
    var f=esFav(t.id);
    h+='<div class="tool-card"><div class="top"><div class="ico">'+t.ico+'</div>';
    h+='<div class="nm">'+esc(t.nm)+'<span class="badge badge-dl">DESCARGA</span></div></div>';
    h+='<div class="desc">'+esc(t.desc)+'</div>';
    h+='<div class="meta">v'+t.ver+' | '+t.tam+' | '+t.tags.toUpperCase()+'</div>';
    h+='<div class="actions"><a href="'+t.dl+'" target="_blank" rel="noopener" style="color:#00c8ff;text-decoration:none;font-size:.55em;padding:4px 10px;border:1px solid rgba(0,200,255,.15);border-radius:2px">⬇ DESCARGAR</a>';
    h+='<a href="'+t.web+'" target="_blank" rel="noopener" style="color:rgba(0,200,255,.4);text-decoration:none;font-size:.55em;padding:4px 10px;border:1px solid rgba(0,200,255,.06);border-radius:2px">🌐 Web</a>';
    h+='<button class="fav" onclick="toggleFav(\''+t.id+'\');renderTodo(document.querySelector(\'#catBtns button.active\'))" style="background:none;border:1px solid rgba(241,196,15,.15);border-radius:2px;color:#f1c40f;cursor:pointer;font-size:.55em;padding:4px 6px">'+(f?'❤️':'🤍')+'</button></div></div>';
  });
  $("downloadGrid").innerHTML=h;
}

function renderTodo(btn){
  var cat=(btn?btn.textContent.trim().toLowerCase().replace(/[^a-z]/g,''):'todas');
  if(!btn||cat==="todas"){renderBuiltin();renderDownloads();return;}
  if(cat==="builtin"){renderBuiltin();$("downloadGrid").innerHTML='';return;}
  var blist=BUILTIN.filter(function(t){return t.cat===cat||(t.tags||"").indexOf(cat)>=0;});
  var dlist=DOWNLOADS.filter(function(t){return t.cat===cat||(t.tags||"").indexOf(cat)>=0;});
  renderBuiltin(blist);renderDownloads(dlist);
}

function filtrar(cat,btn){
  document.querySelectorAll("#catBtns button").forEach(function(b){b.classList.remove("active");});
  if(btn)btn.classList.add("active");
  renderTodo(btn);
}
function cerrarModal(){$("modal").classList.remove("show");$("modalBody").innerHTML="";if(cdInterval){clearInterval(cdInterval);cdInterval=null;}}

cargarFavs();renderTodo();
