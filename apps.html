<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>📱 Zona de Aplicaciones · ZonaHack</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#060907;--card:rgba(255,255,255,.03);--border:rgba(0,255,65,.10);--border2:rgba(0,255,65,.18);
  --text:#d6e4dc;--muted:rgba(214,228,220,.45);--accent:#00ff41;--gold:#f1c40f;--green2:#2ecc71}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh}
.bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.orb{position:absolute;border-radius:50%;filter:blur(80px);opacity:.5;animation:flotar 16s ease-in-out infinite}
.orb1{width:460px;height:460px;background:radial-gradient(circle,rgba(0,255,65,.2),transparent 70%);top:-180px;right:-120px}
.orb2{width:500px;height:500px;background:radial-gradient(circle,rgba(241,196,15,.14),transparent 70%);bottom:-200px;left:-160px;animation-delay:-6s}
@keyframes flotar{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(20px,-14px) scale(1.08)}}
.header{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--border);
  background:rgba(6,9,7,.85);backdrop-filter:blur(10px);position:sticky;top:0;z-index:100}
.logo{width:40px;height:40px;border-radius:12px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
  font-size:20px;background:linear-gradient(135deg,rgba(0,255,65,.22),rgba(241,196,15,.15));border:1px solid var(--border2)}
.ttl{flex:1;min-width:0}
.ttl h1{font-size:.95em;color:var(--accent);letter-spacing:1.5px;font-family:'Courier New',monospace;
  text-shadow:0 0 10px rgba(0,255,65,.25);white-space:nowrap}
.ttl span{font-size:.62em;color:var(--gold);letter-spacing:2px}
.back{color:var(--accent);text-decoration:none;font-size:.72em;padding:7px 12px;border:1px solid var(--border2);border-radius:10px;transition:.2s;white-space:nowrap}
.back:hover{background:rgba(0,255,65,.08)}
.container{max-width:900px;margin:0 auto;padding:18px 16px 40px;position:relative;z-index:1}
.hero{text-align:center;padding:24px 16px 10px}
.hero .big{font-size:54px;filter:drop-shadow(0 0 24px rgba(0,255,65,.3));animation:flotar 6s ease-in-out infinite}
.hero h2{font-size:1.7em;font-weight:900;margin-top:8px;color:#fff;letter-spacing:1px;font-family:'Courier New',monospace;
  background:linear-gradient(90deg,#fff,#00ff41,#fff);background-size:200%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:brillo 5s linear infinite}
@keyframes brillo{to{background-position:200%}}
.hero .hecha{margin-top:8px;font-size:.72em;color:var(--gold);letter-spacing:1px}
.hero .hecha b{color:#fff}
.hero p{color:var(--muted);font-size:.74em;margin-top:4px}
.chips{display:flex;gap:8px;padding:12px 4px;overflow-x:auto}
.chip{white-space:nowrap;padding:6px 13px;border-radius:20px;border:1px solid var(--border2);
  background:rgba(0,255,65,.05);color:var(--muted);font-size:.7em;cursor:pointer;transition:.2s;font-family:inherit}
.chip:hover{color:var(--text)}
.chip.on{background:rgba(0,255,65,.12);border-color:rgba(0,255,65,.4);color:var(--accent);font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;margin-top:6px}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px;position:relative;
  transition:.25s;display:flex;flex-direction:column;gap:9px;overflow:hidden}
.card:hover{border-color:var(--border2);box-shadow:0 10px 34px rgba(0,0,0,.4),0 0 20px rgba(0,255,65,.07);transform:translateY(-3px)}
.card.destacada{border-color:rgba(241,196,15,.3);background:linear-gradient(180deg,rgba(241,196,15,.05),transparent 55%)}
.card .top{display:flex;align-items:center;gap:12px}
.icono{width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;
  font-size:27px;flex-shrink:0;background:linear-gradient(135deg,rgba(0,255,65,.14),rgba(241,196,15,.08));border:1px solid var(--border2)}
.icono img{width:100%;height:100%;object-fit:cover;border-radius:14px}
.card .nom{font-size:.95em;font-weight:700;color:#fff}
.card .cat{font-size:.6em;color:var(--accent);border:1px solid rgba(0,255,65,.2);padding:2px 8px;border-radius:12px;width:fit-content;letter-spacing:.5px}
.dest-badge{position:absolute;top:12px;right:12px;font-size:.62em;color:var(--gold);background:rgba(241,196,15,.1);
  border:1px solid rgba(241,196,15,.3);padding:3px 9px;border-radius:14px;font-weight:700}
.card .desc{font-size:.72em;color:var(--muted);line-height:1.55;flex:1}
.card .foot{display:flex;align-items:center;justify-content:space-between;margin-top:4px}
.abrir{display:inline-flex;align-items:center;gap:7px;background:linear-gradient(135deg,#00ff41,#00c73a);color:#03140a;
  text-decoration:none;font-weight:700;font-size:.75em;padding:9px 16px;border-radius:10px;transition:.2s;font-family:inherit}
.abrir:hover{box-shadow:0 0 18px rgba(0,255,65,.35);transform:translateY(-1px)}
.autor{font-size:.58em;color:var(--gold)}
.empty{text-align:center;color:var(--muted);padding:50px 20px;font-size:.8em}
.empty .big{font-size:40px;margin-bottom:8px}
.spinner{width:34px;height:34px;margin:40px auto;border-radius:50%;border:3px solid var(--border);border-top-color:var(--accent);animation:giro .7s linear infinite}
@keyframes giro{to{transform:rotate(360deg)}}
.footer{text-align:center;margin-top:26px;font-size:.6em;color:var(--gold);letter-spacing:1px}
</style>
</head>
<body>
<div class="bg"><div class="orb orb1"></div><div class="orb orb2"></div></div>

<div class="header">
  <div class="logo">📱</div>
  <div class="ttl">
    <h1>ZONA DE APLICACIONES</h1>
    <span>HECHA POR GONZA</span>
  </div>
  <a href="/" class="back">← Volver</a>
</div>

<div class="container">
  <div class="hero">
    <div class="big">🧩</div>
    <h2>APLICACIONES</h2>
    <div class="hecha">⚡ Hechas por <b>GONZA</b></div>
    <p>Apps y herramientas subidas directo desde el panel admin</p>
  </div>

  <input id="buscador" type="text" placeholder="🔍 Buscar app..." style="width:100%;box-sizing:border-box;padding:11px 16px;margin:4px 0 12px;border-radius:12px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:.85em;outline:none;font-family:inherit">
  <div class="chips" id="chips"></div>
  <div class="grid" id="grid"></div>
  <div id="loading"><div class="spinner"></div></div>
  <div id="empty" class="empty" style="display:none">
    <div class="big">📦</div>
    Aún no hay aplicaciones publicadas.<br>¡Volvé pronto!
  </div>
  <div class="footer">ZONAHACK · ZONA DE APLICACIONES · HECHA POR GONZA</div>
</div>

<script>
var SB="https://xfwolaurpeofysnymqle.supabase.co";
var KEY="sb_publishable_3VvBUD5Bdu3Uaq59fJ99MQ_XDCtujUU";
var H={"apikey":KEY,"Authorization":"Bearer "+KEY};
var apps=[], cat="Todas", q="";

function $(id){return document.getElementById(id);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}

function cargar(){
  $("loading").style.display="block";
  $("empty").style.display="none";
  fetch(SB+"/rest/v1/apps?select=*&activo=eq.true&order=destacada.desc,created_at.desc&limit=200",{headers:H})
  .then(function(r){return r.json();}).then(function(d){
    $("loading").style.display="none";
    apps=d||[];
    buildChips();
    render();
  }).catch(function(){
    $("loading").style.display="none";
    $("empty").style.display="block";
    $("empty").innerHTML='<div class="big">📡</div>No se pudo conectar.';
  });
}

function buildChips(){
  var cats=["Todas"];
  apps.forEach(function(a){ if(a.categoria && cats.indexOf(a.categoria)<0) cats.push(a.categoria); });
  $("chips").innerHTML=cats.map(function(c){
    return '<button class="chip'+(c===cat?' on':'')+'" data-c="'+esc(c)+'">'+esc(c)+'</button>';
  }).join("");
  $("chips").querySelectorAll(".chip").forEach(function(b){
    b.addEventListener("click",function(){
      cat=b.getAttribute("data-c");
      $("chips").querySelectorAll(".chip").forEach(function(x){x.classList.toggle("on",x===b);});
      render();
    });
  });
}

function render(){
  var qn=q.trim().toLowerCase();
  var list=apps.filter(function(a){
    var okCat=(cat==="Todas"||a.categoria===cat);
    var okQ=!qn||(a.nombre||"").toLowerCase().indexOf(qn)>=0||(a.descripcion||"").toLowerCase().indexOf(qn)>=0;
    return okCat&&okQ;
  });
  var grid=$("grid");
  if(!list.length){
    $("empty").style.display="block";
    $("empty").innerHTML=qn?'<div class="big">🔍</div>Sin resultados para "'+esc(q)+'"':'<div class="big">📦</div>Aún no hay aplicaciones publicadas.<br>¡Volvé pronto!';
    grid.innerHTML="";
    return;
  }
  $("empty").style.display="none";
  grid.innerHTML=list.map(function(a,i){
    var icono=a.icono&&a.icono.indexOf("http")===0
      ? '<img src="'+esc(a.icono)+'" onerror="this.style.display=\'none\'">'
      : esc(a.icono||'📱');
    var btn = a.url ? '<a class="abrir" href="'+esc(a.url)+'" '+(a.url.indexOf("http")===0?'target="_blank" rel="noopener"':'')+'>▶ ABRIR</a>'
                    : '<span style="font-size:.62em;color:var(--muted)">Próximamente</span>';
    return '<div class="card'+(a.destacada?' destacada':'')+'" style="animation:fadeIn .35s '+Math.min(i*40,500)+'ms both">'+
      (a.destacada?'<span class="dest-badge">⭐ DESTACADA</span>':'')+
      '<div class="top"><div class="icono">'+icono+'</div>'+
      '<div><div class="nom">'+esc(a.nombre)+'</div>'+
      (a.categoria?'<div class="cat">'+esc(a.categoria)+'</div>':'')+'</div></div>'+
      '<div class="desc">'+esc(a.descripcion||'Sin descripción')+'</div>'+
      '<div class="foot">'+btn+'<span class="autor">⚡ por Gonza</span></div></div>';
  }).join("");
}

// Tiempo real: si el admin sube o cambia una app, se actualiza al instante
try{
  var ws=new WebSocket("wss://xfwolaurpeofysnymqle.supabase.co/realtime/v1/websocket?apikey="+KEY+"&vsn=1.0.0");
  ws.onopen=function(){
    ws.send(JSON.stringify({topic:"realtime:apps",event:"phx_join",payload:{config:{postgres_changes:[{event:"*",schema:"public",table:"apps"}]}},ref:"1"}));
    ws.send(JSON.stringify({topic:"phoenix",event:"heartbeat",payload:{},ref:"0"}));
  };
  ws.onmessage=function(e){
    try{
      var m=JSON.parse(e.data);
      if(m.event==="postgres_changes") cargar();
    }catch(err){}
  };
  ws.onclose=function(){setTimeout(function(){location.reload();},8000);};
}catch(e){}

$("buscador").addEventListener("input",function(){ q=this.value; render(); });
cargar();
</script>
</body>
</html>
