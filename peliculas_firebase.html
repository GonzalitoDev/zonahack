<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>🎬 Películas en Firebase · ZonaHack</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#07090e;--card:rgba(13,17,23,.9);--border:#1c2531;--text:#d7e2ef;--muted:#6d7f93;--accent:#ffca28;--violet:#7a5cff;--green:#2ee6a8}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh}
.bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.orb{position:absolute;border-radius:50%;filter:blur(90px);opacity:.3;animation:flotar 18s ease-in-out infinite}
.orb1{width:460px;height:460px;background:radial-gradient(circle,rgba(255,202,40,.18),transparent 70%);top:-170px;right:-120px}
.orb2{width:500px;height:500px;background:radial-gradient(circle,rgba(122,92,255,.18),transparent 70%);bottom:-200px;left:-160px;animation-delay:-7s}
@keyframes flotar{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(20px,-14px) scale(1.08)}}
.header{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--border);background:rgba(7,9,14,.92);backdrop-filter:blur(10px);position:sticky;top:0;z-index:100}
.logo{width:40px;height:40px;border-radius:12px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:20px;background:linear-gradient(135deg,rgba(255,202,40,.25),rgba(122,92,255,.25));border:1px solid rgba(255,202,40,.4)}
.ttl{flex:1;min-width:0}
.ttl h1{font-size:.95em;letter-spacing:2px;font-weight:900;font-family:'Courier New',monospace;color:#fff}
.ttl span{font-size:.6em;color:var(--muted)}
.back{color:var(--accent);text-decoration:none;font-size:.7em;padding:6px 10px;border:1px solid var(--border);border-radius:8px}
.container{max-width:1000px;margin:0 auto;padding:16px 14px 40px;position:relative;z-index:1}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.conex{display:inline-flex;align-items:center;gap:7px;font-size:.7em;padding:6px 14px;border-radius:20px}
.conex.on{color:var(--green);border:1px solid rgba(46,230,168,.35);background:rgba(46,230,168,.08)}
.conex.off{color:#ff9a8f;border:1px solid rgba(255,90,90,.35);background:rgba(255,90,90,.08)}
.btn{background:linear-gradient(135deg,#ffca28,#ff8c00);color:#2a1400;border:none;border-radius:10px;padding:10px 18px;font-weight:800;font-size:.75em;cursor:pointer;font-family:inherit}
.btn:active{transform:scale(.97)}
.stat{font-size:.68em;color:var(--muted);flex:1}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden;cursor:pointer;transition:.15s}
.card:hover{transform:translateY(-3px);border-color:rgba(255,202,40,.35)}
.card .img{aspect-ratio:16/9;background:#0f1430;position:relative;overflow:hidden}
.card .img img{width:100%;height:100%;object-fit:cover;display:block}
.card .img .cat{position:absolute;top:6px;left:6px;background:rgba(0,0,0,.65);color:var(--accent);font-size:.55em;padding:2px 7px;border-radius:10px}
.card .bd{padding:8px 9px}
.card .t{font-size:.72em;color:#fff;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .u{font-size:.58em;color:var(--muted);margin-top:4px}
.sync{margin-left:auto;font-size:.6em;color:var(--muted);text-align:right;min-height:14px}
.empty{padding:40px;text-align:center;color:var(--muted);font-size:.75em}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:1000;display:none;align-items:center;justify-content:center;padding:16px}
.modal .box{width:100%;max-width:720px;background:#000;border:1px solid var(--border);border-radius:14px;overflow:hidden}
.modal .bar{display:flex;align-items:center;gap:10px;padding:9px 12px;background:var(--card)}
.modal .bar .mt{flex:1;font-size:.78em;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.modal .bar button{background:none;border:none;color:var(--accent);font-size:1em;cursor:pointer}
.modal iframe{width:100%;aspect-ratio:16/9;border:0;display:block;background:#000}
</style>
</head>
<body>
<div class="bg"><div class="orb orb1"></div><div class="orb orb2"></div></div>

<div class="header">
  <div class="logo">🎬</div>
  <div class="ttl"><h1>PELÍCULAS EN FIREBASE</h1><span>colección 'peliculas' · aaaaa-4938f</span></div>
  <a href="/" class="back">←</a>
</div>

<div class="container">
  <div class="top">
    <div class="conex off" id="conex">📡 <span class="dot"></span> Conectando…</div>
    <div class="stat" id="stat">Cargando…</div>
    <button class="btn" onclick="syncDesdeWeb()">🔄 Sincronizar desde la web</button>
  </div>
  <div class="sync" id="sync"></div>
  <div class="grid" id="grid"><div class="empty">Cargando películas de Firebase…</div></div>
</div>

<div class="modal" id="modal">
  <div class="box">
    <div class="bar">
      <div class="mt" id="mTitle">Título</div>
      <button onclick="document.getElementById('modal').style.display='none'">✕</button>
    </div>
    <iframe id="mFrame" allow="accelerometer;autoplay;encrypted-media;gyroscope;picture-in-picture" allowfullscreen></iframe>
  </div>
</div>

<script src="/firebase_zh.js"></script>
<script>
var SUPABASE="https://xfwolaurpeofysnymqle.supabase.co/rest/v1";
var KEY="sb_publishable_3VvBUD5Bdu3Uaq59fJ99MQ_XDCtujUU";
var H={"apikey":KEY,"Authorization":"Bearer "+KEY,"Content-Type":"application/json"};
var movies={};
var order=[];

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}

function playIdx(i){
  var v=movies[order[i]];
  if(!v) return;
  var url=v.url||'';
  var f=document.getElementById('mFrame');
  if(String(url).indexOf('ia_')===0){
    f.src='https://archive.org/embed/'+url.slice(3)+'?autoplay=1';
  } else if(String(url).indexOf('dm_')===0){
    f.src='https://www.dailymotion.com/embed/video/'+url.slice(3)+'?autoplay=1';
  } else {
    f.src='https://www.youtube-nocookie.com/embed/'+url+'?autoplay=1&rel=0';
  }
  document.getElementById('mTitle').textContent=v.titulo||'';
  document.getElementById('modal').style.display='flex';
}

function render(){
  order=Object.keys(movies).sort(function(a,b){return (movies[b].ts||0)-(movies[a].ts||0);});
  var grid=document.getElementById('grid');
  if(!order.length){
    grid.innerHTML='<div class="empty">No hay películas en Firebase todavía.<br>Tocá «Sincronizar desde la web» para traer todas las de ZonaHack.</div>';
    document.getElementById('stat').textContent='0 películas';
    return;
  }
  grid.innerHTML=order.map(function(k,i){
    var v=movies[k]||{};
    var thumb=v.thumbnail||'';
    return '<div class="card" onclick="playIdx('+i+')">'
      +'<div class="img">'
      +(thumb?'<img src="'+esc(thumb)+'" loading="lazy" onerror="this.onerror=null;this.src=\'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw==\'">':'<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:1.8em;opacity:.4">🎬</div>')
      +(v.categoria?'<span class="cat">'+esc(v.categoria)+'</span>':'')
      +'</div><div class="bd"><div class="t">'+esc(v.titulo||'')+'</div>'
      +'<div class="u">'+esc(v.u||'')+(v.ts?' · '+new Date(v.ts).toLocaleDateString():'')+'</div></div></div>';
  }).join('');
  document.getElementById('stat').textContent=order.length+' películas en Firebase';
}

// ── Sincronizar: trae TODAS las películas de Supabase y las sube a Firebase ──
function syncDesdeWeb(){
  var syncEl=document.getElementById('sync');
  syncEl.textContent='⏳ Descargando de la web…';
  var todas=[];
  function pagina(offset){
    fetch(SUPABASE+'/videos?select=id,titulo,url,thumbnail,categoria&order=created_at.desc&limit=1000&offset='+offset,{headers:H})
      .then(function(r){return r.json();}).then(function(d){
        if(d&&d.length){ todas=todas.concat(d); if(d.length>=1000) pagina(offset+1000); else subir(todas); }
        else subir(todas);
      }).catch(function(){ subir(todas); });
  }
  function subir(lista){
    if(!lista.length){ syncEl.textContent='⚠️ No se encontraron películas en la web'; return; }
    var done=0, err=0;
    syncEl.textContent='⏳ Subiendo 0/'+lista.length+' a Firebase…';
    lista.forEach(function(v){
      ZHFirebase.set('peliculas/'+v.url, {titulo:v.titulo||'', url:v.url||'', thumbnail:v.thumbnail||'', categoria:v.categoria||'', ts:Date.now()})
        .then(function(){ done++; if(done+err>=lista.length) fin(done,err,lista.length); })
        .catch(function(){ err++; if(done+err>=lista.length) fin(done,err,lista.length); });
      if(done+err>0) syncEl.textContent='⏳ Subiendo '+done+'/'+lista.length+' a Firebase…';
    });
  }
  function fin(done,err,total){
    syncEl.textContent='✅ Sincronizado: '+done+' subidas'+(err?' · '+err+' errores':'')+' de '+total;
  }
  pagina(0);
}

ZHFirebase.init(function(){
  var cx=document.getElementById('conex');
  if(ZHFirebase.ready){ cx.className='conex on'; cx.innerHTML='🟢 <span class="dot"></span> Conectado a Firebase'; }
  else { cx.className='conex off'; cx.innerHTML='🔴 <span class="dot"></span> Sin conexión'; }
  ZHFirebase.on('peliculas', function(obj){ movies=obj||{}; render(); });
});
</script>
<script src="/logger_zh.js?v=2026"></script>
</body>
</html>
