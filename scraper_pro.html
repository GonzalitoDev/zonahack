<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>⚡ ZH PRO</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#07090e;--card:rgba(13,17,23,.85);--border:#1c2531;--text:#d7e2ef;--muted:#6d7f93;
  --accent:#00e5ff;--violet:#7a5cff;--green:#2ee6a8;--gold:#f1c40f;--red:#ff5a5a}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh}
.bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.orb{position:absolute;border-radius:50%;filter:blur(80px);opacity:.45;animation:flotar 16s ease-in-out infinite}
.orb1{width:460px;height:460px;background:radial-gradient(circle,rgba(0,229,255,.2),transparent 70%);top:-180px;right:-120px}
.orb2{width:500px;height:500px;background:radial-gradient(circle,rgba(122,92,255,.2),transparent 70%);bottom:-200px;left:-160px;animation-delay:-6s}
@keyframes flotar{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(20px,-14px) scale(1.08)}}
.header{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--border);
  background:rgba(7,9,14,.9);backdrop-filter:blur(10px);position:sticky;top:0;z-index:100}
.logo{width:40px;height:40px;border-radius:12px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
  font-size:20px;background:linear-gradient(135deg,rgba(0,229,255,.2),rgba(122,92,255,.2));border:1px solid rgba(0,229,255,.4)}
.ttl{flex:1;min-width:0}
.ttl h1{font-size:.95em;letter-spacing:2px;font-weight:900;font-family:'Courier New',monospace;color:#fff;
  background:linear-gradient(90deg,#00e5ff,#7a5cff,#00e5ff);background-size:200%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:brillo 4s linear infinite}
@keyframes brillo{to{background-position:200%}}
.ttl span{font-size:.6em;color:var(--muted);letter-spacing:2px}
.back{color:var(--accent);text-decoration:none;font-size:.7em;padding:6px 10px;border:1px solid var(--border);border-radius:8px}
.container{max-width:960px;margin:0 auto;padding:16px 14px 40px;position:relative;z-index:1}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:14px}
.card h3{font-size:.82em;color:var(--accent);margin-bottom:12px;letter-spacing:1px;display:flex;align-items:center;gap:8px}
.card h3 .pro{color:var(--violet);font-size:.7em;border:1px solid rgba(122,92,255,.4);padding:1px 8px;border-radius:10px;letter-spacing:1px}
label{font-size:.64em;color:var(--muted);display:block;margin:10px 0 3px;letter-spacing:.5px}
textarea,input,select{width:100%;background:rgba(0,0,0,.4);border:1px solid var(--border);border-radius:10px;color:var(--text);
  padding:10px 12px;font-size:.78em;outline:none;font-family:inherit}
textarea:focus,input:focus,select:focus{border-color:var(--accent)}
textarea{min-height:120px;font-family:'Courier New',monospace;font-size:.72em;resize:vertical;line-height:1.5}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{background:linear-gradient(135deg,#00e5ff,#0096d6);color:#03140a;border:none;border-radius:10px;padding:11px 18px;
  font-weight:800;font-size:.74em;cursor:pointer;font-family:inherit;transition:.2s;letter-spacing:.5px}
.btn:hover{box-shadow:0 0 18px rgba(0,229,255,.35)}
.btn:active{transform:scale(.97)}
.btn.violet{background:linear-gradient(135deg,#7a5cff,#5a3dff)}
.btn.green{background:linear-gradient(135deg,#2ee6a8,#1fbf87)}
.btn.red{background:rgba(255,90,90,.12);color:#ff9a8f;border:1px solid rgba(255,90,90,.4)}
.btn.ghost{background:rgba(0,229,255,.08);color:var(--accent);border:1px solid var(--border)}
.btn.small{padding:7px 12px;font-size:.66em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin-top:10px}
.res{background:rgba(0,0,0,.3);border:1px solid var(--border);border-radius:12px;overflow:hidden;position:relative}
.res .th{aspect-ratio:16/9;background-size:cover;background-position:center;background:#0f1430;position:relative}
.res .th .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:1.6em;opacity:.4}
.res .src{position:absolute;top:6px;left:6px;font-size:.52em;font-weight:800;padding:2px 7px;border-radius:6px;color:#03140a}
.res .inf{padding:8px 10px}
.res .t{font-size:.7em;color:#fff;line-height:1.35;font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.res .meta{font-size:.56em;color:var(--muted);margin-top:4px;display:flex;justify-content:space-between;align-items:center}
.res input[type=checkbox]{position:absolute;top:6px;right:6px;width:18px;height:18px;accent-color:#2ee6a8;z-index:2}
.res.yt{border-color:rgba(46,230,168,.35)}
.res.yt::after{content:'YT ✓';position:absolute;bottom:6px;left:6px;font-size:.5em;color:#2ee6a8;font-weight:800;letter-spacing:.5px}
.empty{text-align:center;color:var(--muted);padding:40px 16px;font-size:.75em}
.status{text-align:center;font-size:.68em;color:var(--accent);margin:10px 0;min-height:14px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:1.2em;color:#fff;font-family:'Courier New',monospace}
.stat span{font-size:.54em;color:var(--muted);letter-spacing:1px;text-transform:uppercase}
.fchip{padding:4px 10px;border-radius:12px;font-size:.58em;letter-spacing:.5px;border:1px solid var(--border);color:var(--muted);cursor:pointer;background:transparent;font-family:inherit}
.fchip.on{color:#03140a;background:linear-gradient(135deg,#00e5ff,#0096d6);border-color:transparent}
/* LOCK */
#lock{position:fixed;inset:0;z-index:200;background:radial-gradient(circle at 50% 30%,#101a30,#06070c 70%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
#lock .big{font-size:50px;filter:drop-shadow(0 0 20px rgba(0,229,255,.4))}
#lock h1{font-size:22px;color:#fff;letter-spacing:2px;font-family:'Courier New',monospace;margin-top:8px}
#lock h1 em{color:var(--accent);font-style:normal}
#lock p{color:var(--muted);font-size:12px;margin-top:8px;max-width:340px;line-height:1.6}
#lock .fila{display:flex;gap:8px;margin-top:18px;width:100%;max-width:340px}
#lock input{flex:1;font-family:'Courier New',monospace;text-align:center;letter-spacing:3px}
/* PLAYER */
.ply{position:fixed;inset:0;background:rgba(0,0,0,.93);z-index:400;display:none;align-items:center;justify-content:center;padding:14px}
.ply .box{width:100%;max-width:720px;background:#0d0d0d;border:1px solid rgba(0,255,65,.25);border-radius:10px;padding:12px}
.ply iframe{width:100%;aspect-ratio:16/9;border:none;border-radius:6px;background:#000}
.ply .t{color:#00ff41;font-size:.7em;margin:8px 0 4px;letter-spacing:.5px;word-break:break-word}
.ply .close{float:right;background:none;border:1px solid rgba(255,90,90,.4);color:#ff9a8f;border-radius:6px;padding:6px 12px;cursor:pointer;font-family:inherit;font-size:.7em}
.res .th{cursor:pointer}
.hidden{display:none}
@media(max-width:480px){.grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}}
</style>
</head>
<body>
<div class="bg"><div class="orb orb1"></div><div class="orb orb2"></div></div>

<div class="header">
  <div class="logo">⚡</div>
  <div class="ttl">
    <h1>ZH PRO SCRAPER</h1>
    <span>OCULTA · SOLO ADMIN</span>
  </div>
  <a href="/" class="back">←</a>
</div>

<div class="container" id="app">
  <div class="stats">
    <div class="stat"><b id="sQueries">0</b><span>Búsquedas</span></div>
    <div class="stat"><b id="sRes">0</b><span>Resultados</span></div>
    <div class="stat"><b id="sYT">0</b><span>YouTube</span></div>
    <div class="stat"><b id="sSaved">0</b><span>Guardados</span></div>
  </div>

  <div class="card">
    <h3>🚀 Scraper masivo <span class="pro">PRO</span></h3>
    <label>Búsquedas (una por línea — se scrappean todas en lote)</label>
    <textarea id="qList" placeholder="pelicula argentina completa&#10;pelicula de terror español latino&#10;documental spacex español&#10;animé acción español"></textarea>
    <div class="row" style="margin-top:12px">
      <div style="flex:1;min-width:120px">
        <label>Resultados por búsqueda</label>
        <select id="qNum">
          <option value="10">10</option><option value="15" selected>15</option><option value="25">25</option><option value="40">40</option>
        </select>
      </div>
      <div style="flex:1;min-width:120px">
        <label>Duración mínima</label>
        <select id="qDur">
          <option value="0" selected>Cualquiera</option><option value="5">≥ 5 min</option>
          <option value="15">≥ 15 min</option><option value="30">≥ 30 min</option><option value="60">≥ 1 hora</option>
        </select>
      </div>
      <div style="flex:1;min-width:120px">
        <label>Ordenar</label>
        <select id="qSort">
          <option value="relevancia" selected>Relevancia</option><option value="dur">Duración</option><option value="vistas">Vistas</option>
        </select>
      </div>
      <div style="flex:1;min-width:120px">
        <label>Categoría</label>
        <select id="qCat">
          <option value="pelicula">🎬 Película</option><option value="serie">📺 Serie</option>
          <option value="documental">📖 Documental</option><option value="anime">🍥 Anime</option>
          <option value="música">🎵 Música</option><option value="general">📦 General</option>
        </select>
      </div>
      <div style="display:flex;align-items:center;gap:6px;margin-top:22px">
        <input type="checkbox" id="qShorts" style="width:auto" checked>
        <label style="margin:0">Excluir Shorts</label>
      </div>
      <div style="display:flex;align-items:center;gap:6px;margin-top:22px">
        <input type="checkbox" id="qExcluir" style="width:auto" checked>
        <label style="margin:0">Excluir trailers/reseñas</label>
      </div>
      <div style="display:flex;align-items:center;gap:6px;margin-top:22px">
        <input type="checkbox" id="autoG" style="width:auto">
        <label style="margin:0">Auto-guardar YouTube a la base</label>
      </div>
    </div>
    <div class="row" style="margin-top:14px">
      <button class="btn" onclick="scrapear()">⚡ SCRAPEAR TODO</button>
      <button class="btn green" onclick="guardarSel()">💾 Guardar seleccionados</button>
      <button class="btn ghost" onclick="limpiar()">🗑 Limpiar</button>
    </div>
    <div class="status" id="status"></div>
  </div>

  <div class="card">
    <h3>📦 Resultados</h3>
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px">
      <button class="btn ghost small" onclick="cargarMas()">⏳ Cargar más</button>
      <button class="btn ghost small" onclick="aleatorio()">🎲 Aleatorio</button>
      <button class="btn ghost small" onclick="exportarCSV()">⬇ CSV</button>
    </div>
    <div id="filtroRow"></div>
    <div id="grid"><div class="empty">Todavía no scrapeaste nada. Escribí búsquedas y tocá SCRAPEAR.</div></div>
  </div>
</div>

<!-- LOCK -->
<div id="lock">
  <div class="big">🔒</div>
  <h1>ZH <em>PRO</em></h1>
  <p>Área restringida. Ingresá la clave de acceso secreta.</p>
  <div class="fila">
    <input id="clave" type="password" placeholder="CLAVE" autocomplete="off">
    <button class="btn" onclick="intentar()">ENTRAR</button>
  </div>
</div>

<!-- PLAYER -->
<div class="ply" id="ply" onclick="if(event.target===this)this.style.display='none'">
  <div class="box">
    <button class="close" onclick="document.getElementById('ply').style.display='none'">✕ Cerrar</button>
    <div class="t" id="plyTitle"></div>
    <iframe id="plyFrame" allow="autoplay; fullscreen; encrypted-media" allowfullscreen></iframe>
  </div>
</div>

<script>
// ── Secretos ofuscados (no visibles en texto plano en el código fuente) ──
function _dec(s,k){var r='';for(var i=0;i<s.length;i+=2){r+=String.fromCharCode(parseInt(s.substr(i,2),16)^k.charCodeAt((i/2)%k.length));}return r;}
function _b64(s){return atob(s);}
var _master=_b64("WkgkM2N1cjF0eSE=");
var SB=_b64("aHR0cHM6Ly94ZndvbGF1cnBlb2Z5c255bXFsZS5zdXBhYmFzZS5jbw==");
var KEY=_b64("c2JfcHVibGlzaGFibGVfM1Z2QlVENUJkdTNVYXE1OWZKOTlNUV9YREN0dWpVVQ==");
var H={"apikey":KEY,"Authorization":"Bearer "+KEY};
function _secret(){ return "Gonzalo2026"; }
var resultados=[];
var guardadas=0;
var filtro="all";
var ULTIMA=null;
function $(id){return document.getElementById(id);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}

/* ─── SECRETO ─── */
function obtenerSecreto(cb){
  var fallback=_secret();
  fetch(SB+"/rest/v1/secretos?nombre=eq.scraper_secret&select=valor&limit=1",{headers:H})
  .then(function(r){return r.json();})
  .then(function(d){ cb(d&&d[0]&&d[0].valor?d[0].valor:fallback); })
  .catch(function(){ cb(fallback); });
}
function intentar(){
  var c=$('clave').value.trim();
  obtenerSecreto(function(secret){
    if(c===secret){ entrar(); }
    else { alert('🔒 Clave incorrecta'); }
  });
}
$('clave').addEventListener('keydown',function(e){ if(e.key==='Enter') intentar(); });
function entrar(){ $('lock').style.display='none'; init(); }

/* entrada por URL: /scraper_pro.html?clave=XXXX */
(function(){
  try{
    var p=new URLSearchParams(location.search);
    var c=p.get('clave');
    if(c) obtenerSecreto(function(secret){ if(c===secret) entrar(); });
  }catch(e){}
})();

function init(){ /* listo */ }

/* ─── SCRAPER ─── */
async function scrapear(){
  var queries=$('qList').value.split('\n').map(function(s){return s.trim();}).filter(Boolean);
  if(!queries.length){ $('status').textContent='Escribí al menos una búsqueda'; return; }
  var por=$('qNum').value, cat=$('qCat').value, auto=$('autoG').checked;
  var minDur=$('qDur').value, shorts=$('qShorts').checked;
  var sort=$('qSort').value, excluir=$('qExcluir').checked;
  resultados=[]; guardadas=0;
  $('status').textContent='⚡ Scrapeando '+queries.length+' búsquedas en paralelo...';
  $('grid').innerHTML='<div class="empty">Scrapeando... esto tarda unos segundos por búsqueda.</div>';
  var totalGuardadas=0;
  for(var i=0;i<queries.length;i++){
    var q=queries[i];
    try{
      var url='/api/search_multi?q='+encodeURIComponent(q)+'&limit='+por+'&min_dur='+minDur+'&shorts='+(shorts?'1':'0')+'&sort='+encodeURIComponent(sort)+'&excluir='+(excluir?'1':'0')+(auto?'&guardar=1&cat='+encodeURIComponent(cat):'');
      var r=await fetch(url);
      var d=await r.json();
      (d.results||[]).forEach(function(v){ v.busqueda=q; resultados.push(v); });
      if(d.guardadas) totalGuardadas+=d.guardadas;
    }catch(e){}
    $('status').textContent='⚡ Scrapeando ('+(i+1)+'/'+queries.length+')...';
  }
  guardadas=totalGuardadas;
  ULTIMA={q:queries[queries.length-1],por:por,minDur:minDur,shorts:shorts?'1':'0',sort:sort,excluir:excluir?'1':'0',auto:auto?'1':'0',cat:cat,page:1};
  render();
  $('status').textContent='✅ Listo: '+resultados.length+' resultados · '+totalGuardadas+' guardados automáticos';
  $('sSaved').textContent=totalGuardadas;
}
function cargarMas(){
  if(!ULTIMA){$('status').textContent='⛔ Primero scrapeá una búsqueda';return;}
  ULTIMA.page++;
  $('status').textContent='⏳ Cargando más (página '+ULTIMA.page+')...';
  var url='/api/search_multi?q='+encodeURIComponent(ULTIMA.q)+'&limit='+ULTIMA.por+'&min_dur='+ULTIMA.minDur+'&shorts='+ULTIMA.shorts+'&sort='+encodeURIComponent(ULTIMA.sort)+'&excluir='+ULTIMA.excluir+'&page='+ULTIMA.page+(ULTIMA.auto==='1'?'&guardar=1&cat='+encodeURIComponent(ULTIMA.cat):'');
  fetch(url).then(function(r){return r.json();}).then(function(d){
    var seen={};
    resultados.forEach(function(v){seen[v.source+':'+v.id]=1;});
    var agregados=0;
    (d.results||[]).forEach(function(v){
      if(!seen[v.source+':'+v.id]){seen[v.source+':'+v.id]=1;resultados.push(v);agregados++;}
    });
    render();
    $('status').textContent='✅ +'+agregados+' nuevos · total '+resultados.length;
  }).catch(function(){ $('status').textContent='⛔ Error al cargar más'; });
}
function aleatorio(){
  if(!resultados.length)return;
  resultados.sort(function(){return Math.random()-0.5;});
  render();
  $('status').textContent='🎲 Orden aleatorio';
}
function exportarCSV(){
  if(!resultados.length){$('status').textContent='⛔ No hay resultados';return;}
  var filas=[["fuente","titulo","canal","duracion","vistas","publicado","url"]];
  resultados.forEach(function(v){
    filas.push([v.source||"",(v.title||"").replace(/"/g,'""'),v.channel||"",v.duration||"",v.views||"",v.published||"",
      (v.play==='youtube'&&v.id?'https://www.youtube.com/watch?v='+v.id:(v.url||""))]);
  });
  var csv=filas.map(function(f){return '"'+f.join('","')+'"';}).join("\n");
  var blob=new Blob(["\ufeff"+csv],{type:"text/csv;charset=utf-8"});
  var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="resultados.csv";document.body.appendChild(a);a.click();
  setTimeout(function(){document.body.removeChild(a);URL.revokeObjectURL(a.href);},300);
}
function render(){
  $('sQueries').textContent=$('qList').value.split('\n').filter(function(s){return s.trim();}).length;
  $('sRes').textContent=resultados.length;
  var yt=resultados.filter(function(v){return v.source==='youtube';}).length;
  $('sYT').textContent=yt;
  renderFiltros();
  var grid=$('grid');
  if(!resultados.length){ grid.innerHTML='<div class="empty">Sin resultados.</div>'; return; }
  var vis=resultados.map(function(v,i){return {v:v,i:i};}).filter(function(x){return filtro==='all'||x.v.source===filtro;});
  grid.innerHTML=vis.map(function(x){
    var v=x.v,i=x.i;
    var th=v.thumb?"background-image:url('"+String(v.thumb).replace(/["'<>\\]/g,'')+"')":"";
    var srcCol={"youtube":"#2ee6a8","archive":"#f1c40f","commons":"#00e5ff","dailymotion":"#7a5cff","vimeo":"#ff5a5a","pexels":"#ffcc00","pixabay":"#7a5cff","mixkit":"#ff7ad9","rutube":"#ff7a59","okru":"#00bfff","peertube":"#8a2be2"}[v.source]||"#889";
    return '<div class="res '+(v.source==='youtube'?'yt':'')+'" data-i="'+i+'">'+
      '<div class="th"'+(th?' style="'+th+'"':'')+' onclick="abrirVideo(resultados['+i+'])" title="Reproducir"><span class="ph">▶</span></div>'+
      '<input type="checkbox" data-i="'+i+'"'+(v.source==='youtube'?' checked':'')+'>'+
      '<div class="inf"><div class="t">'+esc(v.title)+'</div>'+
      '<div class="meta"><span style="color:'+srcCol+'">'+esc(v.source)+'</span>'+
      '<span>'+esc(v.duration||'')+(v.views?' · '+esc(v.views):'')+'</span></div>'+
      (v.published?'<div class="meta"><span style="color:rgba(241,196,15,.6)">'+esc(v.published)+'</span><span>'+esc(v.channel||v.busqueda||'')+'</span></div>':'')+
      '</div></div>';
  }).join('');
}
function renderFiltros(){
  var counts={};
  resultados.forEach(function(v){counts[v.source]=(counts[v.source]||0)+1;});
  var h='<div style="display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px;align-items:center">'+
    '<span style="font-size:.56em;color:var(--muted);letter-spacing:1px">FUENTE:</span>'+
    '<button class="fchip'+(filtro==='all'?' on':'')+'" onclick="setFiltro(\'all\')">Todas ('+resultados.length+')</button>'+
    Object.keys(counts).map(function(s){return '<button class="fchip'+(filtro===s?' on':'')+'" onclick="setFiltro(\''+s+'\')">'+esc(s)+' ('+counts[s]+')</button>';}).join("")+
    '<button class="btn ghost small" style="margin-left:auto" onclick="copiarLinks()">📋 Copiar links</button>'+
    '</div>';
  $("filtroRow").innerHTML=h;
}
function setFiltro(s){filtro=s;render();}
function copiarLinks(){
  var urls=resultados.filter(function(v){return filtro==='all'||v.source===filtro;}).map(function(v){
    if(v.play==='youtube'&&v.id)return "https://www.youtube.com/watch?v="+v.id;
    return v.url||"";
  }).filter(Boolean);
  if(!urls.length)return;
  (navigator.clipboard?navigator.clipboard.writeText(urls.join("\n")):Promise.reject()).then(function(){
    $("status").textContent="✅ "+urls.length+" links copiados";
  }).catch(function(){prompt("Copiá los links (Ctrl+C):",urls.join("\n"));});
}
function guardarSel(){
  var sel=[];
  [].forEach.call($('grid').querySelectorAll('input[type=checkbox]:checked'),function(c){
    var v=resultados[parseInt(c.getAttribute('data-i'),10)];
    if(v&&v.source==='youtube'&&v.id) sel.push(v);
  });
  if(!sel.length){ $('status').textContent='Seleccioná resultados de YouTube para guardar'; return; }
  $('status').textContent='💾 Guardando '+sel.length+' a la base...';
  // dedupe contra existentes
  fetch(SB+"/rest/v1/videos?select=url&limit=3000",{headers:H})
  .then(function(r){return r.json();}).then(function(ex){
    var exist=[]; (ex||[]).forEach(function(v){ if(v.url) exist.push(v.url); });
    var filas=[],vistos={};
    sel.forEach(function(v){
      if(exist.indexOf(v.id)>=0||vistos[v.id]) return;
      vistos[v.id]=1;
      filas.push({titulo:(v.title||"Video").slice(0,180),url:v.id,tipo:"youtube",thumbnail:(v.thumb||"").slice(0,500),categoria:$('qCat').value});
    });
    if(!filas.length){ $('status').textContent='Todo ya estaba en la base (sin duplicados)'; return; }
    fetch(SB+"/rest/v1/videos",{method:'POST',headers:Object.assign({},H,{'Content-Type':'application/json','Prefer':'resolution=ignore-duplicates,return=minimal'}),body:JSON.stringify(filas)})
    .then(function(r){ guardadas+=filas.length; $('sSaved').textContent=guardadas; $('status').textContent='✅ '+filas.length+' guardados a la base ('+sel.length+' seleccionados, sin duplicados)'; })
    .catch(function(){ $('status').textContent='Error al guardar'; });
  });
}
function limpiar(){ resultados=[]; $('grid').innerHTML='<div class="empty">Limpio.</div>'; $('status').textContent=''; $('sRes').textContent='0';$('sYT').textContent='0'; }

function abrirVideo(v){
  if(!v)return;
  var u=v.url||"";
  if(v.play==="youtube"&&v.id)u="https://www.youtube.com/embed/"+v.id+"?autoplay=1&rel=0";
  else if(v.play==="archive"&&v.id)u="https://archive.org/embed/"+(v.id||"").replace(/^ia_/,"");
  if(!u){alert("No hay URL de reproducción");return;}
  $('plyTitle').textContent=v.title||"";
  $('plyFrame').src=u;
  $('ply').style.display="flex";
}
