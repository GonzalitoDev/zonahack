<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>ZonaHack</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:#030705;
    font-family:'Courier New',monospace;color:#d6e4dc;
    -webkit-user-select:none;user-select:none}

  /* ── fondo: lluvia matrix + neones ─────────────── */
  #matrix{position:fixed;inset:0;width:100%;height:100%;z-index:0;opacity:.85}

  .glow{position:fixed;border-radius:50%;filter:blur(60px);z-index:1;pointer-events:none}
  .glow.g1{width:420px;height:260px;left:-120px;top:-120px;background:radial-gradient(circle,rgba(0,255,65,.22),transparent 65%);animation:flota 6s ease-in-out infinite}
  .glow.g2{width:420px;height:260px;right:-120px;bottom:-120px;background:radial-gradient(circle,rgba(0,204,255,.16),transparent 65%);animation:flota 7s ease-in-out infinite reverse}
  .glow.g3{width:300px;height:300px;left:50%;top:50%;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(0,255,140,.08),transparent 60%);animation:flota 9s ease-in-out infinite}
  @keyframes flota{0%,100%{transform:translateY(0)}50%{transform:translateY(-22px)}}

  /* líneas de escaneo CRT */
  .scan{position:fixed;inset:0;z-index:2;pointer-events:none;
    background:repeating-linear-gradient(0deg,rgba(0,0,0,0) 0,rgba(0,0,0,0) 2px,rgba(0,0,0,.18) 2px,rgba(0,0,0,.18) 4px);
    mix-blend-mode:overlay}
  .scan::after{content:'';position:absolute;left:0;right:0;height:120px;top:-140px;
    background:linear-gradient(180deg,transparent,rgba(0,255,65,.12),transparent);
    animation:barrido 3.2s linear infinite}
  @keyframes barrido{0%{top:-140px}100%{top:110%}}

  /* ── contenido ─────────────────────────────────── */
  .wrap{position:relative;z-index:3;height:100%;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:14px;padding:20px}

  .logo{position:relative;width:74px;height:74px;display:flex;align-items:center;justify-content:center}
  .logo .ring{position:absolute;inset:0;border-radius:50%;
    border:2px solid transparent;border-top-color:#00ff41;border-right-color:#00ccff;
    animation:girar 2.4s linear infinite;filter:drop-shadow(0 0 8px rgba(0,255,65,.6))}
  .logo .ring2{position:absolute;inset:8px;border-radius:50%;
    border:2px solid transparent;border-bottom-color:#00ccff;border-left-color:#00ff41;
    animation:girar 3.4s linear infinite reverse;filter:drop-shadow(0 0 8px rgba(0,204,255,.5))}
  @keyframes girar{to{transform:rotate(360deg)}}
  .logo .core{font-size:40px;filter:drop-shadow(0 0 18px rgba(0,255,65,.75));animation:latido 1.8s ease-in-out infinite}
  @keyframes latido{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}

  /* título con glitch neón */
  .ttl{position:relative;font-weight:900;font-size:40px;letter-spacing:6px;line-height:1;
    color:#fff;text-shadow:0 0 10px rgba(0,255,65,.7),0 0 26px rgba(0,255,65,.45),0 0 60px rgba(0,255,65,.3)}
  .ttl::before,.ttl::after{content:attr(data-text);position:absolute;inset:0;letter-spacing:6px}
  .ttl::before{color:#0ff;text-shadow:none;clip-path:inset(0 0 50% 0);transform:translate(-3px,-2px);opacity:.7;animation:glitch1 2.6s infinite linear alternate}
  .ttl::after{color:#ff2d75;text-shadow:none;clip-path:inset(50% 0 0 0);transform:translate(3px,2px);opacity:.7;animation:glitch2 2.1s infinite linear alternate}
  @keyframes glitch1{0%,86%{clip-path:inset(0 0 50% 0);transform:translate(-3px,-2px)}
    88%{clip-path:inset(10% 0 40% 0);transform:translate(-6px,-1px)}
    92%{clip-path:inset(60% 0 10% 0);transform:translate(4px,1px)}
    96%{clip-path:inset(30% 0 55% 0);transform:translate(-2px,2px)}
    100%{clip-path:inset(0 0 50% 0);transform:translate(-3px,-2px)}}
  @keyframes glitch2{0%,80%{clip-path:inset(50% 0 0 0);transform:translate(3px,2px)}
    84%{clip-path:inset(55% 0 30% 0);transform:translate(5px,-2px)}
    90%{clip-path:inset(5% 0 65% 0);transform:translate(-4px,-1px)}
    96%{clip-path:inset(40% 0 20% 0);transform:translate(2px,3px)}
    100%{clip-path:inset(50% 0 0 0);transform:translate(3px,2px)}}

  .sub{font-size:11px;letter-spacing:5px;color:rgba(120,255,150,.9);
    text-shadow:0 0 8px rgba(0,255,65,.5)}
  .sub b{color:#00ccff;font-weight:700;text-shadow:0 0 8px rgba(0,204,255,.6)}

  /* secuencia de arranque */
  .boot{width:360px;max-width:92%;height:64px;font-size:10.5px;line-height:1.9;
    color:rgba(150,255,170,.78);text-align:left;overflow:hidden}
  .boot .ln{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:0;animation:aparece .3s forwards}
  .boot .ln .ok{color:#00ff41;font-weight:700}
  .boot .ln.dim{color:rgba(120,255,150,.35)}
  @keyframes aparece{to{opacity:1}}

  /* barra de progreso */
  .bar{width:360px;max-width:92%;height:6px;border-radius:6px;
    background:rgba(0,255,65,.10);border:1px solid rgba(0,255,65,.18);overflow:hidden;position:relative}
  .bar i{display:block;height:100%;width:0;border-radius:6px;position:relative;
    background:linear-gradient(90deg,#00c73a,#00ff41,#00ccff);
    box-shadow:0 0 14px rgba(0,255,65,.7);transition:width .12s linear}
  .bar i::after{content:'';position:absolute;inset:0;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);
    animation:brillo 1.4s linear infinite}
  @keyframes brillo{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}

  .meta{width:360px;max-width:92%;display:flex;justify-content:space-between;font-size:9px;
    letter-spacing:1px;color:rgba(150,255,170,.55)}
  .meta .pct{color:#00ff41;font-weight:700;text-shadow:0 0 6px rgba(0,255,65,.5)}

  .hint{font-size:9.5px;color:rgba(214,228,220,.4);letter-spacing:2px}
</style>
<link rel="stylesheet" href="/tema.css" data-zh-tema>
</head>
<body>
  <canvas id="matrix"></canvas>
  <div class="glow g1"></div>
  <div class="glow g2"></div>
  <div class="glow g3"></div>
  <div class="scan"></div>

  <div class="wrap">
    <div class="logo">
      <div class="ring"></div>
      <div class="ring2"></div>
      <div class="core">💀</div>
    </div>

    <div class="ttl" data-text="ZONAHACK">ZONAHACK</div>
    <div class="sub">PELÍCULAS <b>·</b> ANIME <b>·</b> OFFLINE</div>

    <div class="boot" id="boot"></div>

    <div class="bar"><i id="bar"></i></div>
    <div class="meta"><span id="status">INICIANDO…</span><span class="pct" id="pct">0%</span></div>

    <div class="hint">CARGANDO LA APP<span class="d" id="dots"></span></div>
  </div>

<script>
(function(){
  /* ── lluvia matrix ─────────────────────────── */
  var cv = document.getElementById('matrix');
  var ctx = cv.getContext('2d');
  var W, H, cols, drops;
  var glyphs = 'アイウエオカキクケコサシスセソタチツテトナニヌネノ0123456789ABCDEF<>/\\|$#@%&*+=';
  function size(){
    W = cv.width = window.innerWidth;
    H = cv.height = window.innerHeight;
    cols = Math.floor(W / 16);
    drops = [];
    for (var i=0;i<cols;i++) drops[i] = Math.random()*-60;
  }
  size();
  window.addEventListener('resize', size);
  function draw(){
    ctx.fillStyle = 'rgba(3,7,5,0.08)';
    ctx.fillRect(0,0,W,H);
    ctx.font = '15px monospace';
    for (var i=0;i<cols;i++){
      var ch = glyphs[Math.floor(Math.random()*glyphs.length)];
      var x = i*16, y = drops[i]*16;
      ctx.fillStyle = Math.random()>0.975 ? '#aaffcc' : '#00ff41';
      ctx.fillText(ch, x, y);
      if (y > H && Math.random() > 0.975) drops[i] = 0;
      drops[i]++;
    }
    requestAnimationFrame(draw);
  }
  draw();

  /* ── secuencia de arranque ─────────────────── */
  var boot = document.getElementById('boot');
  var lines = [
    '> inicializando núcleo <span class="ok">ZonaHack v1.0</span>',
    '> verificando caché offline… <span class="ok">OK</span>',
    '> conectando a offlinevideoplayer.vercel.app… <span class="ok">OK</span>',
    '> módulos: películas · anime · radio · juegos… <span class="ok">OK</span>',
    '> estableciendo conexión segura… <span class="ok">LISTO</span>'
  ];
  var li = 0;
  function typeLine(){
    if (li >= lines.length){
      setTimeout(function(){ boot.innerHTML=''; li=0; typeLine(); }, 1400);
      return;
    }
    var full = lines[li];
    // pinta la línea anterior como "dim" para dar sensación de historial
    var prev = boot.querySelectorAll('.ln');
    prev.forEach(function(p){ if(!p.classList.contains('dim')) p.classList.add('dim'); });
    var div = document.createElement('div');
    div.className = 'ln';
    div.innerHTML = full;
    boot.appendChild(div);
    // limita el historial visible
    while (boot.children.length > 4) boot.removeChild(boot.firstChild);
    li++;
    setTimeout(typeLine, 460);
  }
  typeLine();

  /* ── progreso ──────────────────────────────── */
  var bar = document.getElementById('bar');
  var pct = document.getElementById('pct');
  var status = document.getElementById('status');
  var target = 92, cur = 0;
  var t0 = null;
  function paso(ts){
    if (!t0) t0 = ts;
    var t = (ts - t0) / 2600; // ~2.6s hasta el 92%
    if (t > 1) t = 1;
    var eased = 1 - Math.pow(1 - t, 3); // easeOutCubic
    cur = Math.round(target * eased);
    bar.style.width = cur + '%';
    pct.textContent = cur + '%';
    status.textContent = cur < 30 ? 'INICIANDO…' : cur < 60 ? 'CARGANDO MÓDULOS…' : cur < 85 ? 'CONECTANDO…' : 'CASI LISTO…';
    if (t < 1) requestAnimationFrame(paso);
  }
  requestAnimationFrame(paso);

  /* ── puntos animados ───────────────────────── */
  var d = document.getElementById('dots'), k = 0;
  setInterval(function(){ d.textContent = '.'.repeat(k = (k + 1) % 4); }, 400);
})();
</script>
</body>
</html>
