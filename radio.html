<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>📻 ZONA RADIO</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#050805;color:#c8d6e5;font-family:'Courier New',monospace;min-height:100vh;padding-bottom:120px}
.header{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid rgba(0,255,65,.1);background:#050505;position:sticky;top:0;z-index:100}
.header h1{color:#00ff41;font-size:.85em;letter-spacing:1px;text-shadow:0 0 10px rgba(0,255,65,.2)}
.back{color:#00ff41;text-decoration:none;font-size:.65em;padding:4px 8px;border:1px solid rgba(255,255,255,.1);border-radius:3px}
.container{max-width:720px;margin:0 auto;padding:12px}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin:8px 0}
.tabs button{padding:6px 11px;border:1px solid rgba(0,255,65,.12);border-radius:16px;background:rgba(0,255,65,.03);color:rgba(0,255,65,.7);font-size:.64em;cursor:pointer;font-family:'Courier New',monospace;transition:.15s}
.tabs button:hover{background:rgba(0,255,65,.1);color:#00ff41}
.tabs button.active{background:rgba(0,255,65,.15);border-color:#00ff41;color:#fff}
.tabs .sep{border-left:1px solid rgba(0,255,65,.12);margin:0 4px}
.status{text-align:center;font-size:.6em;color:rgba(255,255,255,.35);margin:6px 0;min-height:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:7px}
.sta{background:#0d0f0d;border:1px solid rgba(0,255,65,.07);border-radius:8px;padding:9px;cursor:pointer;transition:.15s;position:relative}
.sta:hover{border-color:#00ff41;box-shadow:0 0 12px rgba(0,255,65,.1)}
.sta.playing{border-color:#00ff41;background:rgba(0,255,65,.06)}
.sta .nm{font-size:.72em;color:#e6f7ec;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sta .ct{font-size:.58em;color:rgba(0,255,65,.5);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sta .fav{position:absolute;top:5px;right:7px;font-size:.85em;cursor:pointer}
.sta .live{position:absolute;top:5px;left:7px;font-size:.5em;color:#ff5a5a;font-weight:700;letter-spacing:.5px}
.empty{text-align:center;color:rgba(255,255,255,.15);padding:40px;font-size:.78em}
.spin{width:22px;height:22px;border:2px solid rgba(0,255,65,.15);border-top-color:#00ff41;border-radius:50%;animation:spin .7s linear infinite;margin:12px auto}
@keyframes spin{to{transform:rotate(360deg)}}
/* Reproductor */
.player{position:fixed;left:0;right:0;bottom:0;background:rgba(5,8,5,.96);border-top:1px solid rgba(0,255,65,.15);backdrop-filter:blur(10px);z-index:200;padding:10px 14px;display:none}
.player .top{display:flex;align-items:center;gap:10px}
.player .live-dot{width:9px;height:9px;border-radius:50%;background:#ff3333;box-shadow:0 0 8px #ff3333;animation:pulse 1.2s infinite;flex-shrink:0}
@keyframes pulse{50%{opacity:.35}}
.player .info{flex:1;min-width:0}
.player .info .n{font-size:.72em;color:#00ff41;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.player .info .s{font-size:.6em;color:rgba(255,255,255,.5);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px}
.player .btn{background:none;border:1px solid rgba(0,255,65,.2);border-radius:50%;width:38px;height:38px;color:#00ff41;font-size:.9em;cursor:pointer;font-family:'Courier New',monospace;flex-shrink:0}
.player .btn:active{background:rgba(0,255,65,.15)}
.player .bar{display:flex;align-items:center;gap:8px;margin-top:8px}
.player input[type=range]{flex:1;height:4px;appearance:none;-webkit-appearance:none;background:rgba(255,255,255,.15);border-radius:2px;outline:none}
.player input[type=range]::-webkit-slider-thumb{appearance:none;width:14px;height:14px;border-radius:50%;background:#00ff41;cursor:pointer}
.conn{font-size:.55em;letter-spacing:.5px;text-align:center;margin-top:6px;color:rgba(0,255,65,.5)}
.conn.warn{color:#f1c40f}
.conn.err{color:#e74c3c}
/* THOR */
.thor-box{display:flex;gap:6px;margin:10px 0}
.thor-box input{flex:1;padding:9px 11px;border:1px solid rgba(0,255,65,.12);border-radius:8px;background:#0a0a0a;color:#00ff41;font-size:.72em;outline:none;font-family:'Courier New',monospace}
.thor-box button{padding:9px 14px;border:1px solid rgba(0,255,65,.2);border-radius:8px;background:rgba(0,255,65,.08);color:#00ff41;font-size:.68em;cursor:pointer;font-family:'Courier New',monospace}
.thor-msg{font-size:.62em;color:rgba(0,255,65,.6);min-height:16px;margin-bottom:4px}
.sleep{font-size:.55em;color:rgba(241,196,15,.7);text-align:right;margin-top:4px}
</style>
</head>
<body>
<div class="header">
  <a href="/" class="back">←</a>
  <h1>📻 ZONA RADIO</h1>
  <span style="font-size:.55em;color:rgba(0,255,65,.4)">LIVE</span>
</div>
<div class="container">
  <div class="thor-box">
    <input id="thorIn" placeholder='THOR: "poné rock", "subí el volumen", "apagá en 30 minutos"...' onkeydown="if(event.key==='Enter')thorCmd()">
    <button onclick="thorCmd()">🤖 THOR</button>
  </div>
  <div class="thor-msg" id="thorMsg"></div>

  <div class="tabs" id="tabs">
    <button class="active" onclick="cargarPais('argentina',this)">🇦🇷 Argentina</button>
    <button onclick="cargarPais('uruguay',this)">🇺🇾 Uruguay</button>
    <button onclick="cargarPais('chile',this)">🇨🇱 Chile</button>
    <button onclick="cargarPais('brasil',this)">🇧🇷 Brasil</button>
    <button onclick="cargarPais('spain',this)">🇪🇸 España</button>
    <button onclick="cargarPais('mexico',this)">🇲🇽 México</button>
    <button onclick="cargarTop(this)">🌎 Top</button>
    <span class="sep"></span>
    <button onclick="cargarTag('rock',this)">🎸 Rock</button>
    <button onclick="cargarTag('pop',this)">🎤 Pop</button>
    <button onclick="cargarTag('electronic',this)">🎧 Electrónica</button>
    <button onclick="cargarTag('classical',this)">🎼 Clásica</button>
    <button onclick="cargarTag('news',this)">📰 Noticias</button>
    <button onclick="cargarTag('sport',this)">⚽ Deportes</button>
    <button onclick="cargarTag('chill',this)">🌙 Nocturna</button>
    <button onclick="cargarFavs(this)">❤️ Favoritas</button>
  </div>

  <div class="status" id="status">Elegí un país o categoría...</div>
  <div id="grid" class="grid"></div>
</div>

<!-- REPRODUCTOR -->
<div class="player" id="player">
  <div class="top">
    <span class="live-dot"></span>
    <div class="info">
      <div class="n" id="pName">Radio ZonaHack</div>
      <div class="s" id="pMeta">🔴 EN DIRECTO</div>
    </div>
    <button class="btn" onclick="radioPause()" id="btnPP">⏸</button>
    <button class="btn" onclick="radioFav()" id="btnFav" style="border-radius:8px;width:auto;padding:0 10px;font-size:.8em">🤍</button>
  </div>
  <div class="bar">
    <span style="font-size:.55em;color:rgba(255,255,255,.4)">🔊</span>
    <input type="range" id="vol" min="0" max="100" value="80" oninput="radioVol(this.value)">
    <span id="sleepInfo" class="sleep" style="text-align:right;min-width:120px"></span>
  </div>
  <div class="conn" id="conn">● Conectado</div>
</div>

<script>
var API="https://all.api.radio-browser.info/json";
var HOSTS=["https://all.api.radio-browser.info/json","https://de1.api.radio-browser.info/json","https://at1.api.radio-browser.info/json"];
var radio=new Audio();
var cur={name:"",url:""};
var retryT=null;

function esc(s){return (s||"").replace(/[&<>"]/g,function(m){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m];});}
function favs(){try{return JSON.parse(localStorage.getItem("zh_radio_fav")||"[]");}catch(e){return[];}}
function setFavs(f){try{localStorage.setItem("zh_radio_fav",JSON.stringify(f));}catch(e){}}

function buscar(ruta){
  var hosts=[API].concat(HOSTS.filter(function(h){return h!==API;}));
  function probar(i){
    return fetch(hosts[i]+ruta,{signal:AbortSignal.timeout(15000),headers:{"User-Agent":"ZonaHack/1.0"}})
      .then(function(r){if(!r.ok)throw new Error();return r.json();})
      .catch(function(){ if(i+1<hosts.length)return probar(i+1); throw new Error(); });
  }
  return probar(0);
}

function renderer(st){
  document.getElementById("status").textContent=st+" emisoras";
  var grid=document.getElementById("grid");
  if(!st.length){grid.innerHTML='<div class="empty">Sin emisoras</div>';return;}
  var favsArr=favs();
  grid.innerHTML=st.map(function(s){
    var nm=s.name||"Radio";
    var ct=s.country||"";
    var tags=(s.tags||"").split(",")[0]||"";
    var isFav=favsArr.some(function(f){return f.url===s.url;});
    return '<div class="sta'+(cur.url===s.url?" playing":"")+'" onclick="reproducir(\''+esc(s.url)+'\',\''+esc(nm)+'\',\''+esc(ct)+'\',this)">'+
      '<span class="live">🔴 LIVE</span>'+
      '<span class="fav" onclick="event.stopPropagation();toggleFav(\''+esc(s.url)+'\',\''+esc(nm)+'\')">'+(isFav?'❤️':'🤍')+'</span>'+
      '<div class="nm">'+esc(nm)+'</div>'+
      '<div class="ct">'+(tags?tags+" · ":"")+esc(ct)+'</div></div>';
  }).join("");
}

function cargarPais(pais,btn){
  marcarBtn(btn);
  document.getElementById("grid").innerHTML='<div class="spin"></div>';
  document.getElementById("status").textContent="Buscando emisoras de "+pais+"...";
  buscar("/stations/bycountry/"+encodeURIComponent(pais)+"?order=clickcount&reverse=true&limit=30&hidebroken=true")
  .then(function(d){renderer(d||[]);}).catch(function(){document.getElementById("grid").innerHTML='<div class="empty">Error al cargar. Probá de nuevo.</div>';});
}
function cargarTag(tag,btn){
  marcarBtn(btn);
  document.getElementById("grid").innerHTML='<div class="spin"></div>';
  document.getElementById("status").textContent="Buscando radios de "+tag+"...";
  buscar("/stations/bytag/"+encodeURIComponent(tag)+"?order=clickcount&reverse=true&limit=30&hidebroken=true")
  .then(function(d){renderer(d||[]);}).catch(function(){document.getElementById("grid").innerHTML='<div class="empty">Error al cargar</div>';});
}
function cargarTop(btn){
  marcarBtn(btn);
  document.getElementById("grid").innerHTML='<div class="spin"></div>';
  document.getElementById("status").textContent="Cargando las más escuchadas...";
  buscar("/stations/topvote/30").then(function(d){renderer(d||[]);}).catch(function(){document.getElementById("grid").innerHTML='<div class="empty">Error al cargar</div>';});
}
function cargarFavs(btn){
  marcarBtn(btn);
  var f=favs();
  document.getElementById("status").textContent=f.length+" favoritas";
  document.getElementById("grid").innerHTML=f.length?f.map(function(x){
    return '<div class="sta'+(cur.url===x.url?" playing":"")+'" onclick="reproducir(\''+esc(x.url)+'\',\''+esc(x.nombre)+'\',\'Favorita\',this)">'+
      '<span class="live">🔴 LIVE</span><span class="fav" onclick="event.stopPropagation();toggleFav(\''+esc(x.url)+'\',\''+esc(x.nombre)+'\')">❤️</span>'+
      '<div class="nm">'+esc(x.nombre)+'</div><div class="ct">❤️ Favorita</div></div>';
  }).join(''):'<div class="empty">Sin favoritas todavía</div>';
}
function marcarBtn(btn){
  document.querySelectorAll("#tabs button").forEach(function(b){b.classList.remove("active");});
  if(btn)btn.classList.add("active");
}

function reproducir(url,nombre,ct,el){
  if(!url||url.indexOf("http")!==0){document.getElementById("status").textContent="⚠️ Emisora sin stream válido";return;}
  document.querySelectorAll(".sta").forEach(function(s){s.classList.remove("playing");});
  if(el)el.classList.add("playing");
  cur={name:nombre,url:url};
  document.getElementById("pName").textContent=nombre;
  document.getElementById("pMeta").textContent=(ct?"📍 "+ct+" · ":"")+"🔴 EN DIRECTO";
  document.getElementById("player").style.display="block";
  document.getElementById("btnPP").textContent="⏸";
  conn("● Conectando...");
  radio.src=url;radio.volume=document.getElementById("vol").value/100;
  radio.play().catch(function(){conn("⚠️ No se pudo reproducir","warn");});
  marcarFavBtn();
  // reconexión automática
  if(retryT)clearTimeout(retryT);
  radio.onerror=function(){conn("⚠️ Error de conexión. Reconectando...","err");retryT=setTimeout(function(){try{radio.play();}catch(e){}},3000);};
  radio.onstalled=function(){conn("⏳ Cargando...","warn");setTimeout(function(){if(radio.paused)return;conn("● Conectado");},4000);};
  radio.onplaying=function(){conn("● Conectado");};
}

function radioPause(){
  if(radio.paused){radio.play().catch(function(){});document.getElementById("btnPP").textContent="⏸";conn("● Conectado");}
  else{radio.pause();document.getElementById("btnPP").textContent="▶";conn("⏸ Pausada");}
}
function radioVol(v){radio.volume=v/100;}
function conn(txt,cls){
  var c=document.getElementById("conn");
  c.textContent=txt;c.className="conn"+(cls?" "+cls:"");
}
function marcarFavBtn(){
  var f=favs();
  document.getElementById("btnFav").textContent=f.some(function(x){return x.url===cur.url;})?"❤️":"🤍";
}
function radioFav(){
  if(!cur.url)return;
  toggleFav(cur.url,cur.name);
  marcarFavBtn();
}
function toggleFav(url,nombre){
  var f=favs();
  var i=f.findIndex(function(x){return x.url===url;});
  if(i>=0)f.splice(i,1);else f.push({url:url,nombre:nombre});
  setFavs(f);
  document.getElementById("status").textContent="❤️ "+(i>=0?"Quitada":"Agregada")+" de favoritas";
  var btn=document.getElementById("btnFav");if(btn)btn.textContent=i>=0?"🤍":"❤️";
}

// ─── SLEEP TIMER ───
var sleepT=null;
function sleepTimer(min){
  if(sleepT)clearTimeout(sleepT);
  if(min<=0){document.getElementById("sleepInfo").textContent="";return;}
  sleepT=setTimeout(function(){radio.pause();document.getElementById("btnPP").textContent="▶";conn("😴 Radio apagada (timer)");document.getElementById("sleepInfo").textContent="";thorSay("😴 Radio apagada por el temporizador.");},min*60000);
  document.getElementById("sleepInfo").textContent="😴 Apagado en "+min+" min";
}

// ─── THOR ───
function thorSay(m){document.getElementById("thorMsg").textContent="🤖 THOR // RADIO: "+m;}
function thorCmd(){
  var t=document.getElementById("thorIn").value.trim().toLowerCase();
  if(!t)return;
  document.getElementById("thorIn").value="";
  if(t.indexOf("rock")>=0){cargarTag("rock",document.querySelector('[onclick*="rock"]'));thorSay("📻 Reproduciendo: Rock");}
  else if(t.indexOf("pop")>=0){cargarTag("pop",document.querySelector('[onclick*="pop"]'));thorSay("📻 Reproduciendo: Pop");}
  else if(t.indexOf("electron")>=0||t.indexOf("electro")>=0){cargarTag("electronic",document.querySelector('[onclick*="electronic"]'));thorSay("📻 Reproduciendo: Electrónica");}
  else if(t.indexOf("clasica")>=0||t.indexOf("clásica")>=0){cargarTag("classical",document.querySelector('[onclick*="classical"]'));thorSay("📻 Reproduciendo: Clásica");}
  else if(t.indexOf("noticia")>=0||t.indexOf("news")>=0){cargarTag("news",document.querySelector('[onclick*="news"]'));thorSay("📻 Reproduciendo: Noticias");}
  else if(t.indexOf("deporte")>=0||t.indexOf("sport")>=0){cargarTag("sport",document.querySelector('[onclick*="sport"]'));thorSay("📻 Reproduciendo: Deportes");}
  else if(t.indexOf("nocturna")>=0||t.indexOf("chill")>=0){cargarTag("chill",document.querySelector('[onclick*="chill"]'));thorSay("📻 Reproduciendo: Nocturna");}
  else if(t.indexOf("argentina")>=0){cargarPais("argentina",document.querySelector('[onclick*="argentina"]'));thorSay("📻 Emisoras de Argentina");}
  else if(t.indexOf("uruguay")>=0){cargarPais("uruguay",document.querySelector('[onclick*="uruguay"]'));thorSay("📻 Emisoras de Uruguay");}
  else if(t.indexOf("chile")>=0){cargarPais("chile",document.querySelector('[onclick*="chile"]'));thorSay("📻 Emisoras de Chile");}
  else if(t.indexOf("brasil")>=0||t.indexOf("brasil")>=0){cargarPais("brasil",document.querySelector('[onclick*="brasil"]'));thorSay("📻 Emisoras de Brasil");}
  else if(t.indexOf("espa")>=0||t.indexOf("spain")>=0){cargarPais("spain",document.querySelector('[onclick*="spain"]'));thorSay("📻 Emisoras de España");}
  else if(t.indexOf("mexico")>=0||t.indexOf("méxico")>=0){cargarPais("mexico",document.querySelector('[onclick*="mexico"]'));thorSay("📻 Emisoras de México");}
  else if(t.indexOf("top")>=0){cargarTop(document.querySelector('[onclick*="cargarTop"]'));thorSay("📻 Las más escuchadas");}
  else if(t.indexOf("favorit")>=0){cargarFavs(document.querySelector('[onclick*="cargarFavs"]'));thorSay("📻 Tus favoritas");}
  else if(t.indexOf("subí el volumen")>=0||t.indexOf("mas volumen")>=0||t.indexOf("volumen")>=0){var v=Math.min(100,parseInt(document.getElementById("vol").value)+15);document.getElementById("vol").value=v;radioVol(v);thorSay("🔊 Volumen al "+v+"%");}
  else if(t.indexOf("bajá el volumen")>=0||t.indexOf("menos volumen")>=0){var v2=Math.max(0,parseInt(document.getElementById("vol").value)-15);document.getElementById("vol").value=v2;radioVol(v2);thorSay("🔉 Volumen al "+v2+"%");}
  else if(t.indexOf("apag")>=0&&t.indexOf("min")>=0){var m=parseInt(t.match(/(\d+)/)[1])||30;sleepTimer(m);thorSay("😴 Apagado en "+m+" minutos");}
  else if(t.indexOf("apag")>=0&&t.indexOf("radio")>=0){radio.pause();document.getElementById("btnPP").textContent="▶";thorSay("⏹ Radio apagada");}
  else if(t.indexOf("que suena")>=0||t.indexOf("sonando")>=0){thorSay("🎵 Sonando: "+cur.name||"Nada todavía");}
  else{thorSay("No entendí. Probá: 'poné rock', 'subí el volumen', 'apagá en 30 minutos'");}
}
</script>
</body>
</html>
