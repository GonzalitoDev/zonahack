<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>📋 Logs en vivo · ZonaHack</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#07090e;--card:rgba(13,17,23,.9);--border:#1c2531;--text:#d7e2ef;--muted:#6d7f93;--accent:#ffca28;--violet:#7a5cff;--green:#2ee6a8;--red:#ff5a5a}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh}
.bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.orb{position:absolute;border-radius:50%;filter:blur(90px);opacity:.35;animation:flotar 18s ease-in-out infinite}
.orb1{width:460px;height:460px;background:radial-gradient(circle,rgba(255,202,40,.2),transparent 70%);top:-170px;right:-120px}
.orb2{width:500px;height:500px;background:radial-gradient(circle,rgba(122,92,255,.2),transparent 70%);bottom:-200px;left:-160px;animation-delay:-7s}
@keyframes flotar{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(20px,-14px) scale(1.08)}}
.header{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--border);background:rgba(7,9,14,.92);backdrop-filter:blur(10px);position:sticky;top:0;z-index:100}
.logo{width:40px;height:40px;border-radius:12px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:20px;background:linear-gradient(135deg,rgba(255,202,40,.25),rgba(122,92,255,.25));border:1px solid rgba(255,202,40,.4)}
.ttl{flex:1;min-width:0}
.ttl h1{font-size:.95em;letter-spacing:2px;font-weight:900;font-family:'Courier New',monospace;color:#fff}
.ttl span{font-size:.6em;color:var(--muted)}
.back{color:var(--accent);text-decoration:none;font-size:.7em;padding:6px 10px;border:1px solid var(--border);border-radius:8px}
.lock{position:fixed;inset:0;z-index:1000;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px}
.lock-box{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:30px;width:100%;max-width:360px;text-align:center}
.lock-box .ico{font-size:2.2em}
.lock-box h2{font-size:1em;margin:8px 0 4px;letter-spacing:1px}
.lock-box p{color:var(--muted);font-size:.7em;margin-bottom:16px}
.lock-box input{width:100%;background:rgba(0,0,0,.4);border:1px solid var(--border);border-radius:10px;color:var(--text);padding:12px;font-size:.9em;outline:none;text-align:center;font-family:inherit}
.lock-box input:focus{border-color:var(--accent)}
.lock-box .btn{margin-top:12px;width:100%;padding:12px;border:none;border-radius:10px;background:linear-gradient(135deg,#ffca28,#ff8c00);color:#2a1400;font-weight:900;font-size:.85em;cursor:pointer;font-family:inherit}
.lock-msg{margin-top:10px;font-size:.75em;min-height:16px;color:var(--red)}
.container{max-width:1100px;margin:0 auto;padding:16px 14px 40px;position:relative;z-index:1}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.conex{display:inline-flex;align-items:center;gap:7px;font-size:.7em;padding:6px 14px;border-radius:20px}
.conex.on{color:var(--green);border:1px solid rgba(46,230,168,.35);background:rgba(46,230,168,.08)}
.conex.on .dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green);animation:pulse 1.4s infinite}
.conex.off{color:var(--red);border:1px solid rgba(255,90,90,.35);background:rgba(255,90,90,.08)}
.conex.off .dot{width:8px;height:8px;border-radius:50%;background:var(--red)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.stats{display:flex;gap:10px;flex-wrap:wrap;flex:1}
.stat{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:8px 14px;text-align:center;min-width:80px}
.stat b{display:block;font-size:1.3em;color:var(--accent)}
.stat span{font-size:.6em;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.filters input,.filters select{background:rgba(0,0,0,.4);border:1px solid var(--border);border-radius:10px;color:var(--text);padding:9px 12px;font-size:.75em;outline:none;font-family:inherit}
.filters input{flex:1;min-width:160px}
.filters input:focus,.filters select:focus{border-color:var(--accent)}
.danger{background:rgba(255,90,90,.15);color:#ff9a8f;border:1px solid rgba(255,90,90,.3);border-radius:10px;padding:9px 14px;font-size:.72em;font-weight:700;cursor:pointer;font-family:inherit}
.log-list{background:var(--card);border:1px solid var(--border);border-radius:16px;overflow:hidden}
.log-item{display:flex;gap:12px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--border);font-size:.76em;animation:fadeIn .2s}
.log-item:last-child{border-bottom:none}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.l-time{color:var(--muted);white-space:nowrap;font-family:'Courier New',monospace;font-size:.85em}
.l-ev{min-width:78px;text-align:center;padding:3px 10px;border-radius:8px;font-weight:800;font-size:.68em}
.ev-view{background:rgba(122,92,255,.15);color:#b39cff}
.ev-error{background:rgba(255,90,90,.15);color:#ff9a8f}
.ev-click{background:rgba(255,202,40,.15);color:#ffca28}
.ev-login{background:rgba(46,230,168,.15);color:#2ee6a8}
.ev-chat{background:rgba(0,197,255,.15);color:#00c5ff}
.l-user{color:var(--accent);font-weight:700;white-space:nowrap}
.l-page{color:var(--muted);white-space:nowrap;max-width:180px;overflow:hidden;text-overflow:ellipsis}
.l-data{flex:1;color:var(--text);word-break:break-all;min-width:0}
.empty{padding:30px;text-align:center;color:var(--muted);font-size:.75em}
</style>
</head>
<body>
<div class="bg"><div class="orb orb1"></div><div class="orb orb2"></div></div>

<div class="lock" id="lock">
  <div class="lock-box">
    <div class="ico">🔐</div>
    <h2>LOGS · ZONAHACK</h2>
    <p>Zona restringida. Ingresá la contraseña.</p>
    <input id="lockPass" type="password" placeholder="Contraseña…" autocomplete="off">
    <button class="btn" onclick="desbloquear()">Entrar</button>
    <div class="lock-msg" id="lockMsg"></div>
  </div>
</div>

<div class="header">
  <div class="logo">📋</div>
  <div class="ttl">
    <h1>LOGS EN VIVO</h1>
    <span>Firestore · aaaaa-4938f / (default)</span>
  </div>
  <a href="/" class="back">←</a>
</div>

<div class="container" id="main" style="display:none">
  <div class="top">
    <div class="conex off" id="conex">📡 <span class="dot"></span> Conectando…</div>
    <div class="stats">
      <div class="stat"><b id="sTotal">0</b><span>Logs</span></div>
      <div class="stat"><b id="sView">0</b><span>Visitas</span></div>
      <div class="stat"><b id="sErr">0</b><span>Errores</span></div>
      <div class="stat"><b id="sUsers">0</b><span>Usuarios</span></div>
    </div>
    <button class="danger" onclick="vaciarLogs()">🗑️ Vaciar logs</button>
  </div>

  <div class="filters">
    <input id="fTxt" placeholder="🔎 Buscar (usuario, página, evento, datos)…" oninput="render()">
    <select id="fEv" onchange="render()">
      <option value="">Todos los eventos</option>
      <option value="view">view</option>
      <option value="error">error</option>
      <option value="click">click</option>
      <option value="login">login</option>
      <option value="chat">chat</option>
    </select>
  </div>

  <div class="log-list" id="list"><div class="empty">Conectando a Firebase…</div></div>
</div>

<script src="/firebase_zh.js"></script>
<script>
/* ─── BLOQUEO (misma contraseña que el Panel Admin) ─── */
function _dec(s,k){var r='';for(var i=0;i<s.length;i+=2){r+=String.fromCharCode(parseInt(s.substr(i,2),16)^k.charCodeAt((i/2)%k.length));}return r;}
function _b64(s){return atob(s);}
var _master=_b64("WkgkM2N1cjF0eSE=");
var _passAdmin=_dec("000065570e1c1c03444b17",_master);
function desbloquear(){
  var c=document.getElementById("lockPass").value;
  if(c===_passAdmin){
    sessionStorage.setItem("zh_logs_unlock","1");
    document.getElementById("lock").style.display="none";
    document.getElementById("main").style.display="block";
    iniciar();
  } else document.getElementById("lockMsg").textContent="❌ Contraseña incorrecta";
}
(function(){ try{ var p=new URLSearchParams(location.search); if(p.get("pass")===_passAdmin){ sessionStorage.setItem("zh_logs_unlock","1"); document.getElementById("lock").style.display="none"; document.getElementById("main").style.display="block"; iniciar(); } }catch(e){} })();
if(sessionStorage.getItem("zh_logs_unlock")==="1"){ document.getElementById("lock").style.display="none"; document.getElementById("main").style.display="block"; iniciar(); }

/* ─── VISOR EN VIVO (REST + EventSource) ─── */
var LOGS={};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function fmt(ts){ var d=new Date(ts); function p(n){return (n<10?'0':'')+n;} return p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds()); }
function evClass(e){ return 'ev-'+(String(e).replace(/[^a-z]/gi,'')||'view'); }

function render(){
  var q=(document.getElementById('fTxt').value||'').toLowerCase();
  var fe=document.getElementById('fEv').value;
  var items=Object.keys(LOGS).map(function(k){ var it=LOGS[k]; it._k=k; return it; });
  var arr=items.filter(function(it){
    if(fe && it.e!==fe) return false;
    if(q){
      var blob=(it.u+' '+it.p+' '+it.e+' '+(it.d||'')).toLowerCase();
      if(blob.indexOf(q)===-1) return false;
    }
    return true;
  }).sort(function(a,b){ return (b.ts||0)-(a.ts||0); }).slice(0,150);

  var list=document.getElementById('list');
  if(!arr.length){ list.innerHTML='<div class="empty">Sin logs que coincidan</div>'; }
  else {
    list.innerHTML=arr.map(function(it){
      return '<div class="log-item">'
        +'<span class="l-time">'+esc(fmt(it.ts))+ '</span>'
        +'<span class="l-ev '+evClass(it.e)+'">'+esc(it.e)+'</span>'
        +'<span class="l-user">'+esc(it.u)+'</span>'
        +'<span class="l-page">'+esc(it.p)+'</span>'
        +(it.d?'<span class="l-data">'+esc(it.d)+'</span>':'')
        +'</div>';
    }).join('');
  }

  var keys=items;
  var users={}; var nv=0; var ne=0;
  keys.forEach(function(it){ if(it.u)users[it.u]=1; if(it.e==='view')nv++; if(it.e==='error')ne++; });
  document.getElementById('sTotal').textContent=keys.length;
  document.getElementById('sView').textContent=nv;
  document.getElementById('sErr').textContent=ne;
  document.getElementById('sUsers').textContent=Object.keys(users).length;
}

function iniciar(){
  var cx=document.getElementById('conex');
  var li=document.getElementById('list');
  ZHFirebase.init(function(){
    if(!ZHFirebase.ready){
      cx.className='conex off'; cx.innerHTML='🔴 <span class="dot"></span> Sin conexión';
      li.innerHTML='<div class="empty">❌ No conecta a Firebase.<br>Revisá las reglas de Firestore → deben permitir lectura (modo test).<br>Reglas → <b>match /{document=**} { allow read, write: if true; }</b></div>';
      return;
    }
    cx.className='conex on'; cx.innerHTML='🟢 <span class="dot"></span> En vivo';
    ZHFirebase.on('logs', function(obj){ LOGS=obj||{}; render(); });
  });
}

function vaciarLogs(){
  if(!confirm('¿Borrar TODOS los logs? Esta acción no se puede deshacer.')) return;
  ZHFirebase.remove('logs').then(function(){ LOGS={}; render(); document.getElementById('conex').innerHTML='🗑️ Logs vaciados'; });
}
</script>
</body>
</html>
