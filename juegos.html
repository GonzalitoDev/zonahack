<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>ZonaHack - Juegos</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:sans-serif;background:#080c24;color:#e8e8e8;padding:10px;max-width:900px;margin:0 auto;text-align:center;min-height:100vh}
h1{color:#667eea;font-size:1.3em;margin:8px 0}
.sub{color:#888;font-size:.7em;margin-bottom:8px}
.back{color:#667eea;text-decoration:none;font-size:.78em;display:block;margin-bottom:8px}
.juego-card{background:#111639;border-radius:10px;padding:15px;margin:5px 0;cursor:pointer;border:1px solid rgba(255,255,255,.03);display:flex;align-items:center;gap:10px}
.juego-card:active{transform:scale(.98)}
.juego-card .ico{font-size:2em;min-width:45px;text-align:center}
.juego-card .info{flex:1;text-align:left}
.juego-card .nom{font-size:.85em;font-weight:bold}
.juego-card .desc{font-size:.68em;color:#888}
.juego-card .score{font-size:.75em;color:#f1c40f;font-weight:bold}
#gameArea{display:none}
#gameArea .top{display:flex;align-items:center;gap:6px;margin-bottom:6px;flex-wrap:wrap;padding:5px;background:#111639;border-radius:8px}
#gameArea .top button{padding:6px 12px;border:none;border-radius:5px;color:white;font-weight:600;font-size:.72em;cursor:pointer}
canvas{background:#0f1430;border-radius:6px;max-width:100%;touch-action:none;display:block;margin:0 auto}
.controles{display:none;flex-wrap:wrap;justify-content:center;gap:4px;margin:6px auto;max-width:280px}
.controles.show{display:flex}
.ctrl-btn{width:64px;height:64px;border-radius:12px;border:none;background:#111639;color:#ddd;font-size:1.3em;display:flex;align-items:center;justify-content:center;cursor:pointer;touch-action:manipulation;user-select:none;-webkit-user-select:none;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.ctrl-btn:active{background:#667eea44;transform:scale(.92)}
.ctrl-row{display:flex;gap:4px;justify-content:center;width:100%}
.ctrl-label{font-size:.6em;color:#555;text-align:center;margin:2px 0}
#score{color:#f1c40f;font-size:.95em;font-weight:bold;flex:1;text-align:right}
#gameInfo{font-size:.72em;color:#888;margin:4px 0;min-height:18px}
.ranking{font-size:.7em;color:#555;margin-top:3px}
.ranking span{color:#f1c40f}
@media(min-width:768px){canvas{max-width:400px}}
</style>
</head>
<body>

</div>
</div>

<script>
var API_URL = "https://xfwolaurpeofysnymqle.supabase.co";
var API_KEY = "sb_publishable_3VvBUD5Bdu3Uaq59fJ99MQ_XDCtujUU";
var HEADERS = {"apikey": API_KEY, "Authorization": "Bearer " + API_KEY, "Content-Type": "application/json"};
var usuario = localStorage.getItem('vh_usuario') || 'anon';
var juegoActual = '', puntaje = 0, record = 0, gameLoop = null;
var canvas = document.getElementById('gameCanvas'), ctx = canvas.getContext('2d');
var rankingDiv = document.getElementById('ranking');

var JUEGOS = [
    {id:'tetris', ico:'🧱', nom:'Tetris', desc:'Armá filas completas con las piezas', pl:'PC+Android'},
    {id:'snake', ico:'🐍', nom:'Snake', desc:'Atrapá la comida sin chocar', pl:'PC+Android'},
    {id:'invaders', ico:'👾', nom:'Space Invaders', desc:'Dispará a los invasores', pl:'PC+Android'},
    {id:'clicker', ico:'👆', nom:'Clicker', desc:'La mayor cantidad de clicks en 10s', pl:'Android'},
    {id:'reflejos', ico:'⚡', nom:'Reflejos', desc:'Tocá cuando cambie a verde', pl:'Android'},
    {id:'pong', ico:'🏓', nom:'Pong', desc:'Golpeá la pelota con la paleta', pl:'PC'},
    {id:'game2048', ico:'🔢', nom:'2048', desc:'Uní los números hasta llegar a 2048', pl:'Android'},
    {id:'memoria', ico:'🃏', nom:'Memoria', desc:'Encontrá los pares de cartas', pl:'Android'},
    {id:'laberinto', ico:'🌀', nom:'Laberinto', desc:'Salí del laberinto tocando', pl:'Android'},

    {id:'puzzle8', ico:'🧩', nom:'Puzzle 8', desc:'Ordená los numeros', pl:'Android'},

];

function mostrarMenu() {
    var div = document.getElementById('menuJuegos');
    div.innerHTML = JUEGOS.map(function(j) {
        var pl = j.pl === 'PC+Android' ? '<span style="font-size:.55em;color:#00ff41;border:1px solid rgba(0,255,65,.08);padding:1px 5px;border-radius:3px;margin-left:4px">PC+Android</span>'
             : j.pl === 'PC' ? '<span style="font-size:.55em;color:#3498db;border:1px solid rgba(52,152,219,.08);padding:1px 5px;border-radius:3px;margin-left:4px">PC</span>'
             : '<span style="font-size:.55em;color:#f1c40f;border:1px solid rgba(241,196,15,.08);padding:1px 5px;border-radius:3px;margin-left:4px">Android</span>';
        return '<div class="juego-card" onclick="iniciarJuego(\''+j.id+'\')">'
            + '<div class="ico">'+j.ico+'</div>'
            + '<div class="info"><div class="nom">'+j.nom+pl+'</div><div class="desc">'+j.desc+'</div></div>'
            + '<div class="score" id="rec_'+j.id+'">-</div></div>';
    }).join('');
    cargarRecords();
}
mostrarMenu();

function api(m, e, d) {
    return fetch(API_URL+"/rest/v1/"+e, {method:m, headers:HEADERS, body:d?JSON.stringify(d):undefined})
    .then(function(r){return r.json().catch(function(){return[]})});
}

function cargarRecords() {
    api("GET", "juegos_puntuaciones?select=juego,puntuacion,usuario_nombre&order=puntuacion.desc&limit=30")
    .then(function(d) {
        if (!d || !d.length) return;
        var mejores = {};
        d.forEach(function(r) {
            if (!mejores[r.juego] || r.puntuacion > mejores[r.juego].p) {
                mejores[r.juego] = {p: r.puntuacion, u: r.usuario_nombre};
            }
        });
        Object.keys(mejores).forEach(function(k) {
            var el = document.getElementById('rec_'+k);
            if (el) el.textContent = '🏆 '+mejores[k].p;
        });
    });
}

function guardarPuntaje(juego, puntos) {
    var nivel = 1;
    if(juego==='hackerman') nivel = hack.nivel || 1;
    // Guardar en la base de datos
    api("POST", "juegos_puntuaciones", {usuario_nombre: usuario, juego: juego, puntuacion: puntos, nivel: nivel});
    guardarPuntajeFirebase(juego, puntos, nivel);
    try{ if(window.ZHRango) ZHRango.sumar(5, "Jugaste "+juego); }catch(e){}
    // Guardar mejor puntaje local automaticamente
    try{
      var key = "vh_best_"+juego;
      var prev = parseInt(localStorage.getItem(key))||0;
      if(puntos>prev) localStorage.setItem(key, puntos);
    }catch(e){}
    cargarRecords();
}

// Espejo en Firestore: un documento por juego+usuario con su mejor puntaje.
function guardarPuntajeFirebase(juego, puntos, nivel){
  if(!window.ZHFirebase || !usuario || usuario==='anon') return;
  var docId = juego+'_'+usuario;
  ZHFirebase.get('juegos_puntuaciones/'+docId).then(function(actual){
    if(actual && actual.puntuacion>=puntos) return;
    return ZHFirebase.set('juegos_puntuaciones/'+docId, {usuario:usuario, juego:juego, puntuacion:puntos, nivel:nivel||1, ts:Date.now()});
  }).catch(function(){});
}

function mostrarRanking(juego) {
    api("GET", "juegos_puntuaciones?juego=eq."+juego+"&order=puntuacion.desc&limit=5")
    .then(function(d) {
        if (!d || !d.length) { rankingDiv.innerHTML = ''; return; }
        rankingDiv.innerHTML = '🏆 Ranking: '+d.map(function(r,i){return (i+1)+'. '+r.usuario_nombre+': '+r.puntuacion;}).join(' | ');
    });
}

function iniciarJuego(id) {
    juegoActual = id; puntaje = 0; record = 0;
    detenerLoops();
    document.getElementById('menuJuegos').style.display = 'none';
    document.getElementById('gameArea').style.display = 'block';
    canvas.width = Math.min(320, window.innerWidth - 30);
    canvas.height = canvas.width;
    document.getElementById('score').textContent = '0';
    document.getElementById('gameInfo').textContent = 'Cargando...';
    rankingDiv.innerHTML = '';

    if (id === 'tetris') iniciarTetris();
    else if (id === 'snake') iniciarSnake();
    else if (id === 'invaders') iniciarInvaders();
    else if (id === 'clicker') iniciarClicker();
    else if (id === 'reflejos') iniciarReflejos();
    else if (id === 'pong') iniciarPong();
    else if (id === 'game2048') iniciar2048();
    else if (id === 'memoria') iniciarMemoria();
    else if (id === 'laberinto') iniciarLaberinto();
    else if (id === 'flappy') iniciarFlappy();
    else if (id === 'tateti') iniciarTaTeTi();
    else if (id === 'simon') iniciarSimon();
    else if (id === 'piedrapapel') iniciarPiedraPapel();
    else if (id === 'reaccion') iniciarReaccion();
    else if (id === 'serpiente2') iniciarSerpiente2();
    else if (id === 'velocidad') iniciarVelocidad();
    else if (id === 'puzzle8') iniciarPuzzle8();
    else if (id === 'memoria2') iniciarMemoria2();
    else if (id === 'hackerman') iniciarHackerman();
    // Auto-mostrar controles tactiles en dispositivos touch
    if (('ontouchstart' in window) || (navigator.maxTouchPoints > 0)) {
        if (!controlesVisibles) alternarControles();
    }
}

// ─── LOOP CENTRAL: un solo gameLoop para todos los juegos ───
var loopPrincipal = null;
function detenerLoops() {
    if (loopPrincipal) { clearInterval(loopPrincipal); loopPrincipal = null; }
    if (tetrisLoop) { clearInterval(tetrisLoop); tetrisLoop = null; }
    if (invLoop) { clearInterval(invLoop); invLoop = null; }
    if (flappy && flappy.flappyLoop) { clearInterval(flappy.flappyLoop); flappy.flappyLoop = null; }
    if (simon && simon.simonLoop) { clearInterval(simon.simonLoop); simon.simonLoop = null; }
}
function iniciarLoop(fn, ms) { detenerLoops(); loopPrincipal = setInterval(fn, ms); return loopPrincipal; }

// ─── CONTROL TACTIL ────────────────────
var controlesVisibles = false;
function alternarControles() {
controlesVisibles = !controlesVisibles;
document.getElementById('controles').className = 'controles' + (controlesVisibles ? ' show' : '');
}
function ctrlPress(dir) {
if (!juegoActual) return;
if (juegoActual === 'tetris') tetrisCtrl(dir);
else if (juegoActual === 'snake') snakeCtrl(dir);
else if (juegoActual === 'invaders') invCtrl(dir);
else if (juegoActual === 'pong') pongCtrl(dir);
else if (juegoActual === 'clicker') { if (dir==='action') canvas.onclick && canvas.onclick(); }
else if (juegoActual === 'reflejos') { if (dir==='action') canvas.onclick && canvas.onclick(); }
else if (juegoActual === 'game2048') {
if (dir==='up'||dir==='down'||dir==='left'||dir==='right'){
document.dispatchEvent(new KeyboardEvent('keydown',{key:{up:'ArrowUp',down:'ArrowDown',left:'ArrowLeft',right:'ArrowRight'}[dir]}));
}
}
else if (juegoActual === 'memoria') { if (dir==='action'&&canvas.onclick) canvas.onclick({clientX:canvas.width/2+20,clientY:canvas.height/2}); }
else if (juegoActual === 'laberinto') {
if(canvas.onclick&&labPos){
if(dir==='up'&&labPos.x>0)canvas.onclick({clientX:(labPos.y+0.5)*(canvas.width/10),clientY:(labPos.x-0.5)*(canvas.height/10)});
if(dir==='down'&&labPos.x<9)canvas.onclick({clientX:(labPos.y+0.5)*(canvas.width/10),clientY:(labPos.x+1.5)*(canvas.height/10)});
if(dir==='left'&&labPos.y>0)canvas.onclick({clientX:(labPos.y-0.5)*(canvas.width/10),clientY:(labPos.x+0.5)*(canvas.height/10)});
if(dir==='right'&&labPos.y<9)canvas.onclick({clientX:(labPos.y+1.5)*(canvas.width/10),clientY:(labPos.x+0.5)*(canvas.height/10)});
}
}
else if (juegoActual === 'flappy') { if (dir==='action') flappyCtrl(); }
else if (juegoActual === 'tateti') { if (dir==='action'&&canvas.onclick) canvas.onclick({clientX:canvas.width/2,clientY:canvas.height/2}); }
else if (juegoActual === 'simon') { if (dir==='action'&&canvas.onclick) canvas.onclick({clientX:canvas.width/2,clientY:canvas.height/2}); }
else if (juegoActual === 'piedrapapel') { if (dir==='action'&&canvas.onclick) canvas.onclick({clientX:canvas.width/2,clientY:canvas.height/2}); }
else if (juegoActual === 'reaccion') { if (dir==='action') canvas.onclick && canvas.onclick(); }
else if (juegoActual === 'serpiente2') { if (dir==='up'&&dirS2.y===0) dirS2={x:0,y:-1}; else if (dir==='down'&&dirS2.y===0) dirS2={x:0,y:1}; else if (dir==='left'&&dirS2.x===0) dirS2={x:-1,y:0}; else if (dir==='right'&&dirS2.x===0) dirS2={x:1,y:0}; }
else if (juegoActual === 'velocidad') { if (dir==='left') carril=Math.max(0,carril-1); else if (dir==='right') carril=Math.min(2,carril+1); }
else if (juegoActual === 'puzzle8') { if (dir==='up'||dir==='down'||dir==='left'||dir==='right'){ document.dispatchEvent(new KeyboardEvent('keydown',{key:{up:'ArrowUp',down:'ArrowDown',left:'ArrowLeft',right:'ArrowRight'}[dir]})); } }
else if (juegoActual === 'memoria2') { if (dir==='action'&&canvas.onclick) canvas.onclick({clientX:canvas.width/2+20,clientY:canvas.height/2}); }
}

// ─── TECLADO UNICO (sin acumular listeners) ───
var teclaHandler = null;
document.addEventListener('keydown', function(e){
  if (teclaHandler) teclaHandler(e);
});
function setTeclaHandler(fn){ teclaHandler = fn; }
function tetrisCtrl(d) {
if (d==='left') moverPieza(-1,0);
if (d==='right') moverPieza(1,0);
if (d==='down') moverPieza(0,1);
if (d==='up'||d==='action') rotarPieza();
dibujarTetris();
}
function snakeCtrl(d) {
if (d==='up'&&dirSnake.y===0) dirSnake={x:0,y:-1};
if (d==='down'&&dirSnake.y===0) dirSnake={x:0,y:1};
if (d==='left'&&dirSnake.x===0) dirSnake={x:-1,y:0};
if (d==='right'&&dirSnake.x===0) dirSnake={x:1,y:0};
}
function invCtrl(d) {
if (d==='left') playerInv.x = Math.max(0, playerInv.x-1);
if (d==='right') playerInv.x = Math.min(Math.floor(canvas.width/(canvas.width/8))-1, playerInv.x+1);
if (d==='action') { balasInv.push({x:playerInv.x+0.5, y:playerInv.y}); }
dibujarInvaders(canvas.width/8);
}
function pongCtrl(d) {
if (d==='up') pong.p1y=Math.max(0,pong.p1y-15);
if (d==='down') pong.p1y=Math.min(canvas.height-40,pong.p1y+15);
if (d==='action') pong.p2y=Math.max(0,pong.p2y-15);
if (d==='action2') pong.p2y=Math.min(canvas.height-40,pong.p2y+15);
}
// ─── SWIPE EN CANVAS ────────────────────
var swipeX=0,swipeY=0;
canvas.addEventListener('touchstart',function(e){var t=e.touches[0];swipeX=t.clientX;swipeY=t.clientY;},{passive:true});
canvas.addEventListener('touchmove',function(e){e.preventDefault();},{passive:false});
canvas.addEventListener('touchend',function(e){
var dx=e.changedTouches[0].clientX-swipeX;
var dy=e.changedTouches[0].clientY-swipeY;
if(!juegoActual)return;
// Solo swipes direccionales; los taps los maneja canvas.onclick
if(Math.abs(dx)<10&&Math.abs(dy)<10)return;
if(Math.abs(dx)>Math.abs(dy)){ctrlPress(dx>0?'right':'left');}
else{ctrlPress(dy>0?'down':'up');}
},{passive:true});

function cerrarJuego() {
    detenerLoops();
    setTeclaHandler(null);
    canvas.onclick = null;
    document.getElementById('gameArea').style.display = 'none';
    document.getElementById('menuJuegos').style.display = 'block';
    juegoActual = '';
}
function reiniciarJuego() { if (juegoActual) iniciarJuego(juegoActual); }

// ═══════════════ TETRIS ═══════════════
var tetris, piezaActual, tetrisLoop;

function iniciarTetris() {
    detenerLoops();
    var size = canvas.width / 10;
    tetris = Array.from({length:20}, function(){return Array(10).fill(0)});
    piezaActual = generarPieza();
    puntaje = 0;
    mostrarRanking('tetris');

    setTeclaHandler(tetrisKey);

    tetrisLoop = setInterval(function() {
        if (!moverPieza(0,1)) {
            colocarPieza();
            eliminarFilas();
            piezaActual = generarPieza();
            if (colision(piezaActual.pieza, piezaActual.x, piezaActual.y)) {
                clearInterval(tetrisLoop); tetrisLoop=null;
                document.getElementById('gameInfo').textContent = 'Game Over! Puntaje: '+puntaje;
                guardarPuntaje('tetris', puntaje);
                mostrarRanking('tetris');
                return;
            }
        }
        dibujarTetris();
    }, 400);
}

var PIEZAS = [
    {pieza:[[1,1],[1,1]], color:'#f1c40f'},  // O
    {pieza:[[1,1,1,1]], color:'#2ecc71'},     // I
    {pieza:[[1,1,1],[0,1,0]], color:'#9b59b6'}, // T
    {pieza:[[1,1,1],[1,0,0]], color:'#e74c3c'}, // L
    {pieza:[[1,1,1],[0,0,1]], color:'#3498db'}, // J
    {pieza:[[1,1,0],[0,1,1]], color:'#e67e22'}, // S
    {pieza:[[0,1,1],[1,1,0]], color:'#1abc9c'}, // Z
];

function generarPieza() {
    var p = JSON.parse(JSON.stringify(PIEZAS[Math.floor(Math.random()*PIEZAS.length)]));
    p.x = Math.floor((10 - p.pieza[0].length)/2);
    p.y = 0;
    return p;
}

function colision(pieza, x, y) {
    for (var i=0;i<pieza.length;i++)
        for (var j=0;j<pieza[i].length;j++)
            if (pieza[i][j] && (tetris[y+i] === undefined || tetris[y+i][x+j] === undefined || tetris[y+i][x+j])) return true;
    return false;
}

function moverPieza(dx, dy) {
    if (!colision(piezaActual.pieza, piezaActual.x+dx, piezaActual.y+dy)) {
        piezaActual.x += dx; piezaActual.y += dy; return true;
    }
    return false;
}

function rotarPieza() {
    var p = piezaActual.pieza;
    var rot = p[0].map(function(_,i){return p.map(function(r){return r[i]}).reverse()});
    if (!colision(rot, piezaActual.x, piezaActual.y)) piezaActual.pieza = rot;
}

function colocarPieza() {
    var p = piezaActual;
    for (var i=0;i<p.pieza.length;i++)
        for (var j=0;j<p.pieza[i].length;j++)
            if (p.pieza[i][j]) tetris[p.y+i][p.x+j] = p.color;
}

function eliminarFilas() {
    for (var i=tetris.length-1; i>=0; i--) {
        if (tetris[i].every(function(c){return c!==0})) {
            tetris.splice(i,1);
            tetris.unshift(Array(10).fill(0));
            puntaje += 10;
            document.getElementById('score').textContent = puntaje;
            i++;
        }
    }
}

function dibujarTetris() {
    ctx.fillStyle = '#0f1430'; ctx.fillRect(0,0,canvas.width,canvas.height);
    var size = canvas.width / 10;
    for (var y=0;y<tetris.length;y++) for (var x=0;x<tetris[y].length;x++) {
        if (tetris[y][x]) { ctx.fillStyle = tetris[y][x]; ctx.fillRect(x*size, y*size, size-1, size-1); }
    }
    var p = piezaActual;
    for (var i=0;i<p.pieza.length;i++) for (var j=0;j<p.pieza[i].length;j++) {
        if (p.pieza[i][j]) { ctx.fillStyle = p.color; ctx.fillRect((p.x+j)*size, (p.y+i)*size, size-1, size-1); }
    }
}

function tetrisKey(e) {
    if (e.key === 'ArrowLeft') moverPieza(-1,0);
    if (e.key === 'ArrowRight') moverPieza(1,0);
    if (e.key === 'ArrowDown') moverPieza(0,1);
    if (e.key === 'ArrowUp') rotarPieza();
    dibujarTetris();
}

var tetrisTouchX, tetrisTouchY;
function tetrisTouch(e) {
    var t = e.touches[0]; tetrisTouchX = t.clientX; tetrisTouchY = t.clientY;
    canvas.addEventListener('touchend', function(e2) {
        var dx = e2.changedTouches[0].clientX - tetrisTouchX;
        var dy = e2.changedTouches[0].clientY - tetrisTouchY;
        if (Math.abs(dx) > Math.abs(dy)) { if (dx>0) moverPieza(1,0); else moverPieza(-1,0); }
        else { if (dy>0) moverPieza(0,1); else rotarPieza(); }
        dibujarTetris();
    }, {once:true});
}

function iniciarSnake() {

        if (head.x<0||head.x>=cols||head.y<0||head.y>=cols||snake.some(function(s){return s.x===head.x&&s.y===head.y})) {
            gameOverSnake = true;

        }
        snake.unshift(head);

        else snake.pop();

function generarComida(cols) {

function snakeKey(e) {

}

var invaders, playerInv, balasInv, dirInv, invLoop;

function iniciarInvaders() {
    detenerLoops();
    var cols = 8; var size = canvas.width / cols;
    invaders = []; playerInv = {x:Math.floor(cols/2)-1,y:Math.floor(canvas.height/size)-2};
    balasInv = []; dirInv = 1; puntaje = 0;
    mostrarRanking('invaders');
    for (var i=0;i<3;i++) for (var j=0;j<cols;j++) invaders.push({x:j,y:i});
    setTeclaHandler(invKey);
    invLoop = setInterval(function() {
        var mover = false;
        invaders.forEach(function(inv) {
            inv.x += dirInv * 0.5;
            if (inv.x >= cols-1 || inv.x <= 0) mover = true;
        });
        if (mover) { dirInv *= -1; invaders.forEach(function(inv){inv.y+=0.5;}); }
        if (invaders.some(function(inv){return inv.y*size>=playerInv.y*size})) {
            clearInterval(invLoop); invLoop=null; document.getElementById('gameInfo').textContent='Game Over! Puntaje: '+puntaje;
            guardarPuntaje('invaders', puntaje); mostrarRanking('invaders'); return;
        }
        balasInv.forEach(function(b){b.y-=1;});
        balasInv = balasInv.filter(function(b){return b.y>0;});
        invaders = invaders.filter(function(inv){
            var hit = balasInv.some(function(b){return Math.abs(b.x-inv.x)<0.5&&Math.abs(b.y-inv.y)<0.5;});
            if (hit) { puntaje+=10; document.getElementById('score').textContent=puntaje; }
            return !hit;
        });
        if (!invaders.length) {
            clearInterval(invLoop); invLoop=null; document.getElementById('gameInfo').textContent='Ganaste! Puntaje: '+puntaje;
            guardarPuntaje('invaders', puntaje); mostrarRanking('invaders'); return;
        }
        dibujarInvaders(size);
    }, 300);
    document.getElementById('gameInfo').textContent = 'Flechas: mover, Espacio: disparar';
}

    ctx.fillStyle='#2ecc71'; ctx.fillRect(playerInv.x*s,playerInv.y*s,s,s-2);
    balasInv.forEach(function(b){ctx.fillStyle='#f1c40f';ctx.fillRect(b.x*s-1,b.y*s,3,6);});
}

function invKey(e) {
    if (e.key==='ArrowLeft') playerInv.x = Math.max(0, playerInv.x-1);
    if (e.key==='ArrowRight') playerInv.x = Math.min(Math.floor(canvas.width/(canvas.width/8))-1, playerInv.x+1);
    if (e.key===' ') { balasInv.push({x:playerInv.x+0.5, y:playerInv.y}); e.preventDefault(); }

}

// ═══════════════ 2048 ═══════════════
var tab2048, score2048, gameOver2048, win2048;
function iniciar2048() {
detenerLoops();
tab2048=Array.from({length:4},function(){return Array(4).fill(0)});
score2048=0;gameOver2048=false;win2048=false;
mostrarRanking('game2048');
var dirs={left:{x:0,y:-1},right:{x:0,y:1},up:{x:-1,y:0},down:{x:1,y:0}};
setTeclaHandler(function(e){
if(gameOver2048||win2048)return;
var d={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down'}[e.key];
if(d)mover2048(d);
});
function agregarNum(){var c=[];for(var i=0;i<4;i++)for(var j=0;j<4;j++)if(!tab2048[i][j])c.push({x:i,y:j});if(!c.length)return;var p=c[Math.floor(Math.random()*c.length)];tab2048[p.x][p.y]=Math.random()<.9?2:4;}
function mover2048(d){
var movido=false;
function deslizar(arr){var f=arr.filter(function(v){return v});for(var i=0;i<f.length-1;i++){if(f[i]===f[i+1]){f[i]*=2;score2048+=f[i];f.splice(i+1,1);}}while(f.length<4)f.push(0);return f;}
if(d==='left'){for(var i=0;i<4;i++){var n=deslizar(tab2048[i]);if(n.join(',')!==tab2048[i].join(','))movido=true;tab2048[i]=n;}}
if(d==='right'){for(var i=0;i<4;i++){var n=deslizar(tab2048[i].slice().reverse()).reverse();if(n.join(',')!==tab2048[i].join(','))movido=true;tab2048[i]=n;}}
if(d==='up'){for(var j=0;j<4;j++){var col=[];for(var i=0;i<4;i++)col.push(tab2048[i][j]);var n=deslizar(col);for(var i=0;i<4;i++){if(tab2048[i][j]!==n[i])movido=true;tab2048[i][j]=n[i];}}}
if(d==='down'){for(var j=0;j<4;j++){var col=[];for(var i=3;i>=0;i--)col.push(tab2048[i][j]);var n=deslizar(col).reverse();for(var i=0;i<4;i++){if(tab2048[i][j]!==n[i])movido=true;tab2048[i][j]=n[i];}}}
if(movido){agregarNum();document.getElementById('score').textContent=score2048;dibujar2048();}
var lleno=true;for(var i=0;i<4;i++)for(var j=0;j<4;j++){if(tab2048[i][j]===2048&&!win2048){win2048=true;document.getElementById('gameInfo').textContent='Ganaste! 2048! Puntaje: '+score2048;guardarPuntaje('game2048',score2048);mostrarRanking('game2048');}if(!tab2048[i][j])lleno=false;}
if(lleno&&!win2048){gameOver2048=true;document.getElementById('gameInfo').textContent='Game Over! Puntaje: '+score2048;guardarPuntaje('game2048',score2048);mostrarRanking('game2048');}
}
agregarNum();agregarNum();dibujar2048();
document.getElementById('gameInfo').textContent='Deslizá para mover las fichas';
}
function dibujar2048(){
var s=canvas.width/4;ctx.fillStyle='#0f1430';ctx.fillRect(0,0,canvas.width,canvas.height);
var cols={0:'#0f1430',2:'#1a1050',4:'#2d1b69',8:'#e74c3c',16:'#e67e22',32:'#f1c40f',64:'#2ecc71',128:'#3498db',256:'#9b59b6',512:'#f1c40f',1024:'#e74c3c',2048:'#f1c40f'};
for(var i=0;i<4;i++)for(var j=0;j<4;j++){
var v=tab2048[i][j];ctx.fillStyle=cols[v]||'#333';ctx.fillRect(j*s,i*s,s-4,s-4);
if(v){ctx.fillStyle=v>64?'white':'#ddd';ctx.font='bold '+(v>999?s/6+'px':s/4+'px')+' sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(v,j*s+s/2,i*s+s/2);}
}
}

// ═══════════════ LABERINTO ═══════════════
var labGrid,labFin,labMov,labTimer; window.labPos=null;
function iniciarLaberinto(){
detenerLoops();
var size=10;window.labPos={x:0,y:0};labFin={x:size-1,y:size-1};labMov=0;
// Generar laberinto con DFS
labGrid=Array.from({length:size},function(){return Array(size).fill(1)});
var stack=[{x:0,y:0}];labGrid[0][0]=0;
while(stack.length){
var c=stack[stack.length-1];
var vecinos=[];
if(c.x>1&&labGrid[c.x-2][c.y])vecinos.push({x:c.x-2,y:c.y,mx:c.x-1,my:c.y});
if(c.x<size-2&&labGrid[c.x+2][c.y])vecinos.push({x:c.x+2,y:c.y,mx:c.x+1,my:c.y});
if(c.y>1&&labGrid[c.x][c.y-2])vecinos.push({x:c.x,y:c.y-2,mx:c.x,my:c.y-1});
if(c.y<size-2&&labGrid[c.x][c.y+2])vecinos.push({x:c.x,y:c.y+2,mx:c.x,my:c.y+1});
if(!vecinos.length){stack.pop();continue;}
var n=vecinos[Math.floor(Math.random()*vecinos.length)];
labGrid[n.x][n.y]=0;labGrid[n.mx][n.my]=0;stack.push(n);
}
mostrarRanking('laberinto');
dibujarLaberinto(size);
document.getElementById('gameInfo').textContent='Llegá a la meta 🏁';
canvas.onclick=function(e){
if(labPos.x===labFin.x&&labPos.y===labFin.y)return;
var rect=canvas.getBoundingClientRect();var s=canvas.width/size;
var x=Math.floor((e.clientX-rect.left)/s);var y=Math.floor((e.clientY-rect.top)/s);
if(x<0||x>=size||y<0||y>=size)return;
if(Math.abs(x-labPos.x)+Math.abs(y-labPos.y)!==1)return;
if(labGrid[x][y]===1)return;
labPos={x:x,y:y};labMov++;
document.getElementById('score').textContent=labMov;
dibujarLaberinto(size);
if(x===labFin.x&&y===labFin.y){
document.getElementById('gameInfo').textContent='Ganaste! '+labMov+' movimientos';
guardarPuntaje('laberinto',Math.max(1,100-labMov));mostrarRanking('laberinto');
}
};
}
function dibujarLaberinto(size){
var s=canvas.width/size;ctx.fillStyle='#0f1430';ctx.fillRect(0,0,canvas.width,canvas.height);
for(var i=0;i<size;i++)for(var j=0;j<size;j++){
if(labGrid[i][j]){ctx.fillStyle='#111639';ctx.fillRect(j*s,i*s,s,s);}
}
ctx.fillStyle='#2ecc71';ctx.fillRect(labPos.y*s,labPos.x*s,s-2,s-2);
ctx.fillStyle='#f1c40f';ctx.fillRect(labFin.y*s,labFin.x*s,s-2,s-2);
}

// ═══════════════ HACKERMAN (EXCLUSIVO ZonaHack) ═══════════════
var hack = {nivel:0, tiempo:0, codigo:"", escrito:"", fallos:0, activo:false, hackLoop:null, codigos:null};
var HACK_CODIGOS = [
  ["PASSWORD","ACCESS","LOGIN","HACK"],
  ["BREACH","ROOT","SHELL","CRACK"],
  ["OVERDRIVE","FIREWALL","GATEWAY","PROXY"],
  ["ZONAHACK","TERMINAL","INJECT","BYPASS"],
  ["MALWARE","TROJAN","ENCRYPT","DECRYPT"],
];
var HACK_SISTEMAS = ["BANCO CENTRAL","PENTAGON V2","NASA-SAT","CORP.CLOUD","DARKNET","ZONAHACK CORE"];

function iniciarHackerman(){
  detenerLoops();
  hack = {nivel:0, tiempo:30, codigo:"", escrito:"", fallos:0, activo:true, codigos:null};
  var btn=document.querySelector("#btnSpeed");if(btn)btn.style.display="none";
  hack.nivel=1;
  nuevoNivelHack();
  hack.hackLoop=setInterval(function(){ tickHack(); }, 100);
  dibujarHack();
  document.getElementById('gameInfo').textContent='🔓 Hackea el sistema escribiendo el codigo';
}

function nuevoNivelHack(){
  var nivelIdx = Math.min(Math.floor((hack.nivel-1)/4), HACK_CODIGOS.length-1);
  var lista = HACK_CODIGOS[nivelIdx] || HACK_CODIGOS[0];
  hack.codigo = lista[Math.floor(Math.random()*lista.length)];
  hack.escrito = "";
  hack.tiempo = 30;
}

function tickHack(){
  if(!hack.activo) return;
  hack.tiempo -= 0.1;
  if(hack.tiempo<=0){
    gameOverHack("💀 TIEMPO AGOTADO - EL SISTEMA TE DETECTO");
    return;
  }
  dibujarHack();
}

function hackTecla(car){
  if(!hack.activo) return;
  if(car && car.length===1){
    var esperado = hack.codigo.charAt(hack.escrito.length);
    if(car.toUpperCase() === esperado){
      hack.escrito += car.toUpperCase();
      if(hack.escrito === hack.codigo){
        hack.nivel++;
        if(hack.nivel > HACK_CODIGOS.length*4){
          gameOverHack("🏆 FELICITACIONES! HACKEASTE TODO EL SISTEMA");
          return;
        }
        nuevoNivelHack();
        document.getElementById('gameInfo').textContent='✅ SISTEMA HACKEADO! Nivel '+hack.nivel;
      }
    }else{
      hack.fallos++;
      if(hack.fallos%5===0 && hack.tiempo>5) hack.tiempo -= 3;
    }
    dibujarHack();
  }
}

function gameOverHack(msg){
  hack.activo=false;
  clearInterval(hack.hackLoop); hack.hackLoop=null;
  var puntos = (hack.nivel-1)*100;
  document.getElementById('gameInfo').textContent = msg + ' | Puntaje: '+puntos;
  guardarPuntaje('hackerman', puntos);
  mostrarRanking('hackerman');
  // Logros automaticos
  autoLogroHack(puntos, hack.nivel);
}

// Logros automaticos de Hackerman
function autoLogroHack(puntos, nivel){
  try{
    var usuario = localStorage.getItem('vh_usuario') || 'anon';
    var logros = [];
    if(nivel>=3) logros.push({logro:'PRIMER HACK', juego:'hackerman'});
    if(nivel>=8) logros.push({logro:'HACKER NOVATO', juego:'hackerman'});
    if(nivel>=15) logros.push({logro:'HACKER EXPERTO', juego:'hackerman'});
    if(nivel>=24) logros.push({logro:'MASTER HACKER', juego:'hackerman'});
    if(puntos>=2000) logros.push({logro:'LEYENDA HACKER', juego:'hackerman'});
    var logrosPrevios = [];
    try{logrosPrevios = JSON.parse(localStorage.getItem('vh_logros_hack')||'[]');}catch(e){}
    logros.forEach(function(l){
      // Verificar si ya lo tiene (local)
      if(logrosPrevios.indexOf(l.logro)>=0) return;
      // Intentar guardar en DB (si no existe la tabla, falla silencioso y queda en local)
      try{
        fetch(API_URL+"/rest/v1/juegos_logros",{method:'POST',headers:{'apikey':API_KEY,'Authorization':'Bearer '+API_KEY,'Content-Type':'application/json','Prefer':'return=minimal'},
          body:JSON.stringify({usuario_nombre:usuario, logro:l.logro, juego:l.juego})}).catch(function(){});
      }catch(e){}
      // Guardar local siempre (respaldo automatico)
      logrosPrevios.push(l.logro);
      localStorage.setItem('vh_logros_hack', JSON.stringify(logrosPrevios));
      // Notificar logro
      if(document.getElementById('gameInfo')){
        var gi=document.getElementById('gameInfo');
        gi.textContent='🏆 LOGRO: '+l.logro+'!';
        setTimeout(function(){gi.textContent='💻 HACKERMAN';},1500);
      }
    });
  }catch(e){}
}

function dibujarHack(){
  var s=canvas.width;
  ctx.fillStyle='#020404';ctx.fillRect(0,0,canvas.width,canvas.height);
  // Terminal estilo
  ctx.fillStyle='rgba(0,255,65,.08)';
  ctx.fillRect(8,8,s-16,s-70);

  // Sistema objetivo
  ctx.fillStyle='#00ff41';ctx.font='bold '+(s/18)+'px Courier New';ctx.textAlign='center';
  ctx.fillText('>> HACKEANDO: '+HACK_SISTEMAS[Math.min(Math.floor((hack.nivel-1)/4),HACK_SISTEMAS.length-1)]+' <<', s/2, 35);
  ctx.font='bold '+(s/11)+'px Courier New';
  ctx.fillStyle='#f1c40f';
  ctx.fillText('NIVEL '+hack.nivel, s/2, s/2-40);

  // Codigo a escribir (mostrar enmascarado progresivo)
  ctx.font='bold '+(s/14)+'px Courier New';
  ctx.fillStyle='#888';
  ctx.fillText('CODIGO: '+hack.codigo, s/2, s/2+5);
  // Barra de progreso del codigo
  var pct = hack.codigo.length ? (hack.escrito.length/hack.codigo.length) : 0;
  ctx.fillStyle='#1a1a1a';ctx.fillRect(s/4, s/2+20, s/2, 8);
  ctx.fillStyle='#00ff41';ctx.fillRect(s/4, s/2+20, s/2*pct, 8);

  // Escrito actual
  ctx.font='bold '+(s/13)+'px Courier New';
  ctx.fillStyle='#00ff41';
  ctx.fillText(hack.escrito + '_', s/2, s/2+48);

  // Barra de tiempo
  ctx.fillStyle='#1a1a1a';ctx.fillRect(s/4, s-38, s/2, 6);
  ctx.fillStyle = hack.tiempo>10?'#00ff41':hack.tiempo>5?'#f1c40f':'#e74c3c';
  ctx.fillRect(s/4, s-38, s/2*(hack.tiempo/30), 6);
  ctx.font='bold '+(s/18)+'px Courier New';
  ctx.fillText(Math.ceil(hack.tiempo)+'s', s/2, s-20);

  // Fallos
  ctx.font='bold '+(s/22)+'px Courier New';
  ctx.fillStyle='#e74c3c';
  ctx.fillText('FALLOS: '+hack.fallos, s-80, 25);
}

function hackCtrl(dir){
  if(!hack.activo) return;
  var btn = document.querySelector("#btnAction");
  if(!btn) return;
  btn.textContent = dir;
}
// Soporte teclado para hackerman
document.addEventListener('keydown',function(e){
  if(juegoActual==='hackerman' && hack.activo){
    e.preventDefault();
    if(e.key.length===1) hackTecla(e.key);
  }
});

// Agregar boton para letras en movil (se muestra en controles)
function initHackMobile(){
  var c=document.getElementById('controles');
  if(!c) return;
  var row=document.createElement('div');row.className='ctrl-row';row.style.marginTop='4px';
  var letras='ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
  var i=0;
  var addBtn=function(l){
    var b=document.createElement('button');b.className='ctrl-btn';b.style.width='40px';b.style.height='40px';b.style.fontSize='.8em';
    b.textContent=l;
    b.onpointerdown=function(ev){ev.preventDefault();hackTecla(l);};
    row.appendChild(b);
  };
  for(i=0;i<8;i++)addBtn(letras[i]);
  c.appendChild(row);
  var row2=document.createElement('div');row2.className='ctrl-row';
  for(i=8;i<16;i++)addBtn(letras[i]);
  c.appendChild(row2);
  var row3=document.createElement('div');row3.className='ctrl-row';
  for(i=16;i<24;i++)addBtn(letras[i]);
  c.appendChild(row3);
  var row4=document.createElement('div');row4.className='ctrl-row';
  for(i=24;i<36;i++)addBtn(letras[i]);
  c.appendChild(row4);
}
initHackMobile();
