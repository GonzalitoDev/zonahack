<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>🔥 Firebase en vivo · ZonaHack</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#07090e;--card:rgba(13,17,23,.85);--border:#1c2531;--text:#d7e2ef;--muted:#6d7f93;--accent:#ffca28;--violet:#7a5cff;--green:#2ee6a8}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh}
.bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.orb{position:absolute;border-radius:50%;filter:blur(90px);opacity:.4;animation:flotar 18s ease-in-out infinite}
.orb1{width:460px;height:460px;background:radial-gradient(circle,rgba(255,202,40,.2),transparent 70%);top:-170px;right:-120px}
.orb2{width:500px;height:500px;background:radial-gradient(circle,rgba(122,92,255,.2),transparent 70%);bottom:-200px;left:-160px;animation-delay:-7s}
@keyframes flotar{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(20px,-14px) scale(1.08)}}
.header{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--border);background:rgba(7,9,14,.9);backdrop-filter:blur(10px);position:sticky;top:0;z-index:100}
.logo{width:40px;height:40px;border-radius:12px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:20px;background:linear-gradient(135deg,rgba(255,202,40,.25),rgba(122,92,255,.25));border:1px solid rgba(255,202,40,.4)}
.ttl{flex:1;min-width:0}
.ttl h1{font-size:.95em;letter-spacing:2px;font-weight:900;font-family:'Courier New',monospace;color:#fff;background:linear-gradient(90deg,#ffca28,#7a5cff,#ffca28);background-size:200%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:brillo 4s linear infinite}
@keyframes brillo{to{background-position:200%}}
.ttl span{font-size:.6em;color:var(--muted)}
.back{color:var(--accent);text-decoration:none;font-size:.7em;padding:6px 10px;border:1px solid var(--border);border-radius:8px}
.container{max-width:720px;margin:0 auto;padding:16px 14px 40px;position:relative;z-index:1}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:14px}
.card h3{font-size:.82em;color:var(--accent);margin-bottom:12px;letter-spacing:1px;display:flex;align-items:center;gap:8px}
.conex{display:inline-flex;align-items:center;gap:7px;font-size:.7em;padding:6px 14px;border-radius:20px;margin-bottom:4px}
.conex .dot{width:8px;height:8px;border-radius:50%;background:#888}
.conex.on{color:var(--green);border:1px solid rgba(46,230,168,.35);background:rgba(46,230,168,.08)}
.conex.on .dot{background:var(--green);box-shadow:0 0 8px var(--green);animation:pulse 1.4s infinite}
.conex.off{color:#ff9a8f;border:1px solid rgba(255,90,90,.35);background:rgba(255,90,90,.08)}
.conex.off .dot{background:#ff5a5a}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.counter{text-align:center;padding:22px}
.counter .num{font-size:3.2em;font-weight:900;color:#fff;font-family:'Courier New',monospace;text-shadow:0 0 24px rgba(255,202,40,.35)}
.counter .lbl{color:var(--muted);font-size:.7em;letter-spacing:2px;text-transform:uppercase}
.counter .btn{margin-top:14px;padding:12px 28px;border:none;border-radius:12px;background:linear-gradient(135deg,#ffca28,#ff8c00);color:#2a1400;font-weight:900;font-size:.9em;cursor:pointer;font-family:inherit}
.counter .btn:active{transform:scale(.95)}
.row{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
input{flex:1;min-width:120px;background:rgba(0,0,0,.4);border:1px solid var(--border);border-radius:10px;color:var(--text);padding:10px 12px;font-size:.8em;outline:none;font-family:inherit}
input:focus{border-color:var(--accent)}
.btn{background:linear-gradient(135deg,#ffca28,#7a5cff);color:#03140a;border:none;border-radius:10px;padding:11px 18px;font-weight:800;font-size:.76em;cursor:pointer;font-family:inherit}
.dato{display:flex;align-items:center;gap:8px;padding:9px 12px;border:1px solid var(--border);border-radius:10px;margin-bottom:6px;font-size:.8em;animation:fadeIn .25s}
@keyframes fadeIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.dato .k{color:var(--accent);font-weight:800}
.dato .v{flex:1;color:#fff;word-break:break-all}
.dato button{background:none;border:none;color:#ff5a5a;cursor:pointer;font-size:.9em}
.chat-box{display:flex;flex-direction:column;gap:8px;max-height:300px;overflow-y:auto;padding:4px}
.msg{background:rgba(0,0,0,.35);border:1px solid var(--border);border-radius:12px;padding:9px 12px;font-size:.8em}
.msg b{color:var(--accent)}
.msg .t{color:var(--muted);font-size:.6em;margin-top:3px}
.empty{text-align:center;color:var(--muted);padding:20px;font-size:.75em}
.status{font-size:.66em;color:var(--muted);text-align:center;min-height:14px}
</style>
</head>
<body>
<div class="bg"><div class="orb orb1"></div><div class="orb orb2"></div></div>

<div class="header">
  <div class="logo">🔥</div>
  <div class="ttl">
    <h1>FIREBASE EN VIVO</h1>
    <span>Realtime Database · tiempo real</span>
  </div>
  <a href="/" class="back">←</a>
</div>

<div class="container">
  <div class="conex off" id="conex">📡 <span class="dot"></span> Conectando a Firebase…</div>

  <div class="card">
    <h3>🔢 Contador compartido</h3>
    <div class="counter">
      <div class="num" id="cntNum">—</div>
      <div class="lbl">Todos ven el mismo número (en vivo)</div>
      <button class="btn" id="cntBtn">+1</button>
    </div>
  </div>

  <div class="card">
    <h3>🗃️ Almacenar datos</h3>
    <div class="row">
      <input id="kInp" placeholder="clave (ej: pelicula)">
      <input id="vInp" placeholder="valor (ej: mi data)">
      <button class="btn" onclick="guardarDato()">Guardar</button>
    </div>
    <div id="datos"><div class="empty">Escribí una clave y un valor</div></div>
  </div>

  <div class="card">
    <h3>💬 Mini chat (Firebase)</h3>
    <div class="chat-box" id="chat"></div>
    <div class="row" style="margin-top:8px">
      <input id="msgInp" placeholder="Escribí un mensaje…" maxlength="200">
      <button class="btn" onclick="enviarMsg()">Enviar</button>
    </div>
  </div>

  <div class="status" id="st"></div>
</div>

<script src="/firebase_zh.js"></script>
<script>
var USER=localStorage.getItem('vh_usuario')||'anon';
function $(id){return document.getElementById(id);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}

ZHFirebase.init(function(){
  var on=ZHFirebase.ready;
  $('conex').className='conex '+(on?'on':'off');
  $('conex').innerHTML=(on?'🟢 <span class="dot"></span>':'🔴 <span class="dot"></span>')+' '+(on?'Conectado a Firebase':'Error de conexión');
  if(!on){ $('st').textContent='❌ No conecta a Firebase. ¿Creaste la Realtime Database? (Console → Build → Realtime Database → Create database → modo test)'; return; }

  // Contador compartido
  ZHFirebase.on('demo/contador', function(v){
    var n=(v&&v.n)||0;
    $('cntNum').textContent=n;
  });
  $('cntBtn').onclick=function(){
    ZHFirebase.get('demo/contador').then(function(v){
      var n=((v&&v.n)||0)+1;
      ZHFirebase.set('demo/contador',{n:n, por:USER, ts:Date.now()});
    });
  };

  // Datos (clave/valor)
  ZHFirebase.on('datos', function(obj){
    var box=$('datos');
    if(!obj){ box.innerHTML='<div class="empty">Sin datos todavía</div>'; return; }
    var keys=Object.keys(obj).reverse();
    if(!keys.length){ box.innerHTML='<div class="empty">Sin datos todavía</div>'; return; }
    box.innerHTML=keys.slice(0,40).map(function(k){
      var d=obj[k];
      return '<div class="dato"><span class="k">'+esc(k.slice(0,6))+'</span><span class="v">'+esc(d.v||'')+'</span><span style="color:var(--muted);font-size:.65em">'+esc(d.por||'')+'</span><button onclick="borrarDato(\''+k+'\')">✕</button></div>';
    }).join('')
    +(keys.length>40?'<div class="empty">… y '+ (keys.length-40) +' más</div>':'')
    +'<div style="text-align:right;margin-top:4px"><button class="btn" style="background:rgba(255,90,90,.15);color:#ff9a8f;border:1px solid rgba(255,90,90,.3)" onclick="vaciarDatos()">🗑️ Vaciar todo</button></div>';
  });
  window.guardarDato=function(){
    var k=$('kInp').value.trim(), v=$('vInp').value.trim();
    if(!k){ $('st').textContent='Poné una clave'; return; }
    ZHFirebase.push('datos',{k:k,v:v,por:USER,ts:Date.now()}).then(function(key){
      $('kInp').value=''; $('vInp').value='';
      $('st').textContent= key ? '✅ Guardado' : '⚠️ No se guardó (revisá permisos de la base)';
    }).catch(function(e){ $('st').textContent='❌ '+(e&&e.message?e.message:'error'); });
  };
  window.borrarDato=function(key){ ZHFirebase.remove('datos/'+key).then(function(){ $('st').textContent='🗑️ Borrado'; }); };
  window.vaciarDatos=function(){
    if(!confirm('¿Borrar TODOS los datos guardados?')) return;
    ZHFirebase.remove('datos').then(function(){ $('st').textContent='🗑️ Todo vaciado'; });
  };

  // Chat
  ZHFirebase.on('chat', function(obj){
    var box=$('chat');
    if(!obj){ box.innerHTML='<div class="empty">Sin mensajes todavía</div>'; return; }
    box.innerHTML=Object.keys(obj).reverse().slice(0,40).map(function(k){
      var m=obj[k];
      return '<div class="msg"><b>'+esc(m.u||'anon')+'</b> '+esc(m.t||'')+'<div class="t">'+esc(new Date(m.ts).toLocaleTimeString())+'</div></div>';
    }).join('');
    box.scrollTop=box.scrollHeight;
  });
  window.enviarMsg=function(){
    var t=$('msgInp').value.trim();
    if(!t)return;
    ZHFirebase.push('chat',{u:USER,t:t,ts:Date.now()});
    $('msgInp').value='';
  };
  $('msgInp').addEventListener('keydown',function(e){ if(e.key==='Enter') enviarMsg(); });
});
</script>
</body>
</html>
